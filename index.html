<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>雅思词汇真经 · 情境阅读训练</title>
<style>
/* ============================================================
   1. 设计令牌 —— 配色 / 圆角 / 阴影 / 玻璃 / 动效集中管理
   ============================================================ */
:root{
  /* 文字色阶：主文字 → 次要 → 卡片正文 → 弱化辅助 → 极弱 */
  --iel-ink:#2b3a34; --iel-ink2:#63706a; --iel-ink3:#4d5a53; --iel-mute:#6e7973; --iel-ink-faint:#b3bdb7;
  /* 线条 */
  --iel-line:#e7eee9; --iel-line2:#edf2ee;
  /* 主题色（薄荷绿） */
  --iel-accent:#10b487; --iel-accent-deep:#0c9c74; --iel-accent-soft:#e0f5ec; --iel-accent-line:#bfe6d6; --iel-tw:#0d9d74;
  /* 功能色 */
  --iel-gold:#f2b73f; --iel-gold-bg:#fdf3e3; --iel-gold-deep:#c78d2e;
  --iel-coral:#e07a5f; --iel-coral-deep:#c9564a; --iel-coral-line:#f2c9c2; --iel-coral-bg:#fdf4f2;
  --iel-warn:#e8833c; --iel-warn-line:#f5d5b8; --iel-warn-bg:#fdf6ee;
  --iel-ok-line:#b7e6cf; --iel-ok-bg:rgba(248,253,251,.92); --iel-bad-line:#f6cdc5; --iel-bad-bg:rgba(253,248,246,.92);
  --iel-lv0:#f2705d; --iel-lv1:#f5a623; --iel-lv2:#5b9bd5; --iel-lv3:#27c498;
  /* 圆角：嵌套小件 → 小 → 卡片 → 大弹层 */
  --iel-radius-xs:10px; --iel-radius-sm:12px; --iel-radius:16px; --iel-radius-lg:18px;
  /* 渐变与阴影 */
  --iel-grad:linear-gradient(135deg,#2bd4a4,#0fae7e);
  --iel-shadow:0 2px 12px rgba(43,58,52,.06);
  --iel-shadow-lg:0 12px 40px rgba(30,60,48,.14);
  --iel-grad-shadow:0 3px 10px rgba(16,180,135,.25);
  /* 玻璃拟态 */
  --iel-glass:rgba(255,255,255,.94); --iel-glass-strong:rgba(255,255,255,.97); --iel-glass-line:rgba(255,255,255,.65);
  --iel-blur:blur(22px) saturate(170%);
  /* 字体栈：正文中文无衬线；故事正文/单词/音标用衬线 */
  --iel-font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --iel-font-serif:Georgia,"Times New Roman","Songti SC",serif;
  /* 中性底色与悬停色（行/卡片/按钮共用，避免各处色差） */
  --iel-tint:#f4faf7; --iel-tint-hover:#eaf5ef;
  --iel-chip:#eef5f0; --iel-chip-hover:#dff0e7;
  --iel-accent-hover:#d8f0e7;
  --iel-track:#e2ebe5;
  --iel-mark:#c9f2e2; --iel-mark-line:#8fd8bd;
  --iel-gold-line:#e8cf8f;
  /* 动效 */
  --iel-t:.25s ease; --iel-t-fast:.15s ease;
}

/* ============================================================
   2. 基础重置与全局
   ============================================================ */
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth;
  background-image:
    linear-gradient(180deg, rgba(93,190,157,.08) 0%, rgba(93,190,157,.03) 60%, rgba(93,190,157,0) 100%),
    linear-gradient(170deg,#f8fdfa 0%,#ffffff 40%,#ffffff 100%);
  background-size:100% 64px, 100% 100%;
  background-repeat:no-repeat;
  background-attachment:fixed, fixed;}
body{color:var(--iel-ink); font-family:var(--iel-font-ui); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:hidden;}
button{font-family:inherit; cursor:pointer;}
select,input{font-family:inherit;}
:focus-visible{outline:2px solid var(--iel-accent); outline-offset:2px;}
::selection{background:var(--iel-accent-soft);}
/* 系统偏好减少动效时：关闭平滑滚动与所有动画/过渡 */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}

/* ============================================================
   3. 共享原语 —— 毛玻璃 / 主次按钮 / 输入控件 / 胶囊标签
   ============================================================ */
/* 毛玻璃表面：仅固定/浮层元素实时模糊（朗读条、词弹窗、速查面板——它们悬浮于正文之上，模糊可见且必要）。
   文档流内卡片（.card/.q-item/.q-result/.ov-cell/.rv-def）不做实时模糊：背后只有静态页面渐变、
   底色不透明度 ≥.94，blur 视觉不可感知；但首页故事列表是一张贯穿整页的巨型卡片，
   滚动时逐帧重采样大面积 backdrop-filter 是卡顿主源，故文档流卡片直接用半透明底色（视觉等效、滚动流畅）。 */
.audiobar,#wpop,.wq-panel{
  -webkit-backdrop-filter:var(--iel-blur); backdrop-filter:var(--iel-blur);}

/* 主按钮：渐变胶囊（各处只覆写尺寸） */
.s-go,.audiobar .ab,.q-submit,.q-actions button.pri,.rv-btn,.fav-tools button.pri{
  border:none; border-radius:999px; background:var(--iel-grad); color:#fff; font-weight:600; box-shadow:var(--iel-grad-shadow);
  transition:filter var(--iel-t-fast);}
.s-go:hover,.audiobar .ab:hover,.q-submit:hover:not(:disabled),.q-actions button.pri:hover,.rv-btn:hover,.fav-tools button.pri:hover{filter:brightness(1.05);}

/* 次按钮：白底绿描边胶囊，悬停统一浅绿底 */
.s-go.sub,.audiobar .ab.ghost,.q-actions button,.rv-btn.ghost,.backup-zone button,.fav-tools button,.acc-acts button{
  background:#fff; border:1px solid var(--iel-accent-line); color:var(--iel-accent-deep); box-shadow:none; font-weight:500; min-height:40px;
  transition:background var(--iel-t-fast), border-color var(--iel-t-fast);}
.s-go.sub:hover,.audiobar .ab.ghost:hover,.q-actions button:hover:not(.pri),.rv-btn.ghost:hover,.backup-zone button:hover,.fav-tools button:hover,.acc-acts button:hover{
  background:var(--iel-accent-soft); border-color:var(--iel-accent);}

/* 输入控件：统一白底圆角规格 */
.chsel select,.abar-sel,.stat-controls input[type=search],.stat-controls select,.wq-search{
  border:1px solid var(--iel-line); background:#fff; color:var(--iel-ink); border-radius:var(--iel-radius-xs); font-size:13px; padding:7px 10px; min-height:40px;
  transition:border-color var(--iel-t-fast);}
.chsel select:hover,.abar-sel:hover{border-color:var(--iel-accent);}
.wq-search:focus{outline:none; border-color:var(--iel-accent);}

/* 主题色胶囊：章节徽章 / 题目词标签 / 弹窗词级标签 */
.r-badge,.q-word,.wp-badge{background:var(--iel-accent-soft); color:var(--iel-accent-deep); border-radius:999px; font-weight:600;}

/* 禁用态 */
.audiobar .ab:disabled,.q-submit:disabled,.navbtn:disabled,.prog input[type=range]:disabled{opacity:.45; cursor:default;}
.q-submit:disabled{box-shadow:none;}

/* ============================================================
   4. 导航框架
   一级导航：桌面左侧边栏（移动端改为底部导航，见 15 块媒体查询）
   二级导航：顶部条（首页二级 = 情景阅读 / 随身听；右侧章节筛选 + 口音）
   ============================================================ */
/* 一级导航：苹果玻璃侧栏——重模糊+高饱和+发丝级描边；选中=轻染 tint（macOS 侧栏语言，非色块按钮） */
#sidenav{position:fixed; left:0; top:0; bottom:0; width:200px; z-index:70; display:flex; flex-direction:column; padding:24px 16px 20px;
  background:rgba(250,252,251,.6); -webkit-backdrop-filter:blur(30px) saturate(180%); backdrop-filter:blur(30px) saturate(180%);
  border-right:.5px solid rgba(31,45,38,.09); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.55);
  transition:transform var(--iel-t), visibility var(--iel-t);}
.sn-logo{display:flex; align-items:center; gap:10px; padding:2px 8px 20px; color:var(--iel-ink1);}
.sn-logo .sn-mark{width:34px; height:34px; flex:none; border-radius:9px; background:var(--iel-grad); color:#fff;
  box-shadow:var(--iel-grad-shadow), inset 0 1px 0 rgba(255,255,255,.28); display:flex; align-items:center; justify-content:center;}
.sn-logo .sn-mark i{font-size:18px; line-height:1;}
.sn-name{font-weight:700; font-size:13.5px; line-height:1.4; letter-spacing:.2px; white-space:nowrap;}
.sn-nav{display:flex; flex-direction:column; gap:2px;}
.sn-nav button{position:relative; display:flex; align-items:center; gap:10px; padding:8px 11px; border:none; border-radius:8px;
  background:transparent; color:var(--iel-ink3); font-size:13.5px; font-family:inherit; cursor:pointer; text-align:left;
  transition:background var(--iel-t-fast), color var(--iel-t-fast);}
/* 图标双态（Remix Icon）：未选中=线条，选中=填充（随 color 变色） */
.sn-nav button .sn-ic{font-size:19px; line-height:1; flex:none; width:19px; text-align:center;}
.sn-nav button .sn-ic-fill{display:none;}
.sn-nav button.on .sn-ic-line{display:none;}
.sn-nav button.on .sn-ic-fill{display:inline-block;}
/* Remix Icon 通用：行内图标与文字基线对齐（按钮/标签内的小图标） */
i[class^="ri-"], i[class*=" ri-"]{vertical-align:-.125em;}
.sn-nav button:hover{background:rgba(31,45,38,.05); color:var(--iel-ink1);}
.sn-nav button.on{background:rgba(16,180,135,.12); color:var(--iel-accent-deep); font-weight:600;}
#shell{margin-left:200px; transition:margin-left var(--iel-t);}
body.reading #sidenav{transform:translateX(-102%); visibility:hidden;}   /* 阅读页沉浸：隐藏侧栏 */
body.reading #shell{margin-left:0;}

#topbar{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.42);
  -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%);
  border-bottom:1px solid rgba(231,238,233,.7); padding:10px 18px;
  display:flex; justify-content:center; transition:transform var(--iel-t), padding .3s ease;}
body.reading #topbar{position:fixed; left:0; right:0; transform:translateY(-110%);}
body.reading{padding-top:0;}
/* 顶栏内容与正文同列（max-width:860px 居中）：每个页面宽度规则一致；
   章节筛选贴内容区最左，口音钮靠右；「我的」页无筛选需求，整个顶栏隐藏 */
.topbar-in{width:100%; max-width:860px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
body[data-view="me"] #topbar{display:none;}
.chsel{display:flex; align-items:center; gap:6px; color:var(--iel-ink2); font-size:13px; min-width:0;}
/* 顶栏英音/美音切换胶囊 */
.accent-btn{flex:none; margin-left:auto; border:1px solid var(--iel-accent-line); background:#fff; color:var(--iel-accent-deep); border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer; position:relative; transition:background var(--iel-t-fast), border-color var(--iel-t-fast);}
.accent-btn::after{content:""; position:absolute; inset:-5px 0; border-radius:999px;}   /* 纵向 hit-slop：有效触达 40px 不撑大视觉 */
.accent-btn:hover{background:var(--iel-accent-soft); border-color:var(--iel-accent);}
.chsel select{max-width:190px; box-shadow:var(--iel-shadow);}
/* 顶栏滚动收缩态：滚入正文时收紧上下 padding */
#topbar.compact{padding:5px 18px;}
/* 桌面端非阅读视图：播放条在内容区（侧栏右侧）内居中 */
@media (min-width:641px){ body:not(.reading) .audiobar{left:calc(50% + 100px);} }

/* ============================================================
   5. 布局与首页
   ============================================================ */
main{max-width:860px; margin:0 auto; padding:24px 18px 130px;}
.card{background:var(--iel-glass); border:1px solid var(--iel-glass-line); border-radius:var(--iel-radius); padding:20px 22px; margin-bottom:18px; box-shadow:var(--iel-shadow);}
/* 卡片区块标题：全站统一层级（指南/数据管理/测验等卡片内 h3） */
.card h3{font-size:15px; font-weight:700; color:var(--iel-accent-deep); margin-bottom:10px;}
.guide{background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(250,253,252,.93));}
.guide ol{margin-left:20px; font-size:13.5px; color:var(--iel-ink3);}
.guide ol li{margin:3px 0;}
.me-p{font-size:13px; color:var(--iel-ink3); line-height:1.7;}
.story-item{display:flex; align-items:center; gap:16px; padding:16px 6px; border-bottom:1px dashed var(--iel-line);}
.story-item:last-child{border-bottom:none;}
.s-num{flex:none; width:44px; height:44px; border-radius:14px; background:var(--iel-accent-soft); color:var(--iel-accent-deep); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:15px;}
.s-info{flex:1; min-width:0;}
.s-title{font-weight:600; font-size:16px; letter-spacing:.1px;}
.s-title .tcn{color:var(--iel-ink2); font-weight:400; font-size:13px; margin-left:8px;}
.s-meta{font-size:12.5px; color:var(--iel-ink2); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap;}
.s-meta .done{color:var(--iel-lv3); font-weight:600;}
.s-meta .part{color:var(--iel-lv1); font-weight:600;}
.s-go{padding:9px 18px; font-size:13.5px; min-height:40px;}   /* .sub 仅需覆写配色，尺寸继承本规则 */
/* 游客锁定：提示条 + 锁定故事项 */
.guest-banner{display:flex; align-items:center; gap:14px; padding:14px 16px; background:linear-gradient(135deg,#fdf6e3,#f2f8f3);}
.gb-ic{flex:none; font-size:22px; color:#b07a10;}
.gb-sub{font-size:12.5px; color:var(--iel-ink2);}
.gb-go{flex:none; margin-left:auto; padding:8px 16px; min-height:40px;}
.story-item.locked .s-num{background:#f3f2ee; color:#a8a49c;}
.story-item.locked .s-title{color:var(--iel-ink2);}
.story-item.locked .s-go{background:#f3f2ee; color:#8a867c; box-shadow:none;}
.story-item.locked .s-go i{margin-right:2px; font-size:12px; vertical-align:-.125em;}
.empty-box{text-align:center; color:var(--iel-ink2); padding:34px 10px; font-size:14px;}
.empty-box b{display:block; font-size:16px; color:var(--iel-ink); margin-bottom:8px;}

/* ============================================================
   6. 阅读页：悬浮标题条（滚动收缩）与返回
   ============================================================ */
.reader-head{position:fixed; top:12px; left:50%; transform:translateX(-50%); width:min(860px, calc(100% - 28px)); z-index:105; display:flex; align-items:center; gap:5px; padding:6px 14px 6px 6px;
  background:rgba(255,255,255,.42); -webkit-backdrop-filter:var(--iel-blur); backdrop-filter:var(--iel-blur);
  border:1px solid rgba(255,255,255,.5); border-radius:999px; box-shadow:0 3px 14px rgba(30,60,48,.08);
  pointer-events:none; transition:padding var(--iel-t), top var(--iel-t);}
.reader-head .r-title{pointer-events:none; transition:font-size var(--iel-t);}
.reader-head.shrunk{top:6px; padding:2px 12px 2px 2px; background:rgba(255,255,255,.55);}
.reader-head.shrunk .r-title{font-size:12.5px;}
.reader-head.shrunk .r-title .tcn{font-size:10.5px; margin-left:5px;}
.reader-head.shrunk .back{width:26px; height:26px; font-size:14px; position:relative;}
.reader-head.shrunk .back::after{content:""; position:absolute; inset:-7px;}
.back{pointer-events:auto; border:1px solid var(--iel-line); background:#fff; border-radius:50%; width:30px; height:30px; padding:0; font-size:15px; line-height:1; color:var(--iel-ink2); flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; transition:width var(--iel-t), height var(--iel-t), font-size var(--iel-t);}
.back::after{content:""; position:absolute; inset:-5px; border-radius:50%;}
.back:hover{border-color:var(--iel-accent); color:var(--iel-accent-deep); background:#fff;}
.nav-arrow{pointer-events:auto; border:none; background:transparent; border-radius:999px; height:26px; padding:0 12px; font-size:12px; line-height:1; color:var(--iel-accent-deep); flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer; white-space:nowrap; position:relative; transition:background var(--iel-t-fast), color var(--iel-t-fast);}
.nav-arrow::after{content:""; position:absolute; inset:-8px 0; border-radius:999px;}
.nav-arrow:hover:not(:disabled){background:var(--iel-accent-soft);}
.nav-arrow:disabled{opacity:.35; cursor:default;}
/* 收缩态按钮视觉 26px，::after 向外扩 7px 热区（40px 命中），布局不增高 */
.reader-head.shrunk .nav-arrow{padding:0; width:26px; height:26px; font-size:0; position:relative;}
.reader-head.shrunk .nav-arrow::after{content:""; position:absolute; inset:-7px;}
.reader-head.shrunk .nav-arrow::before{font-size:15px;}
.reader-head.shrunk #prevBtn::before{content:"‹";}
.reader-head.shrunk #nextBtn::before{content:"›";}
.r-title{font-size:15.5px; font-weight:700; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;}
.r-title .tcn{font-size:12px; font-weight:400; color:var(--iel-ink2); margin-left:7px;}
.r-title .r-pos{font-size:11px; font-weight:600; color:var(--iel-accent-deep); background:var(--iel-accent-soft); border-radius:999px; padding:1px 7px; margin-left:8px; vertical-align:1px; font-variant-numeric:tabular-nums;}
.reader-head.shrunk .r-pos{font-size:10px; padding:1px 5px; margin-left:6px;}
.r-nav{display:flex; gap:8px; flex:none; pointer-events:auto;}
body.reading main{padding-top:64px;}
.r-badges{position:relative; display:flex; align-items:center; gap:8px; flex-wrap:nowrap; margin-bottom:14px;}
.r-badge{display:inline-block; font-size:12px; padding:2px 10px;}
.r-badges .fav-badge{margin-left:auto; flex:none; position:relative;}
.r-badges .fav-badge::after{content:""; position:absolute; inset:-10px 0; border-radius:999px;}
.ch-sum{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:0 4px 12px; font-size:12.5px; color:var(--iel-mute); font-variant-numeric:tabular-nums;}
.ch-sum b{font-size:15px; font-weight:650; color:var(--iel-ink1); letter-spacing:.2px;}
.ch-sum .cs-n{color:var(--iel-accent-deep); font-weight:600;}
.tr-help{width:24px; height:24px; border-radius:50%; border:1px solid var(--iel-line); background:#fff; color:var(--iel-ink2); font-size:12px; font-weight:600; line-height:1; cursor:pointer; flex:none; position:relative; transition:border-color var(--iel-t-fast), color var(--iel-t-fast), background var(--iel-t-fast);}
.tr-help::after{content:""; position:absolute; inset:-8px; border-radius:50%;}   /* 22→24px 视觉 + 8px 热区 = 40px 命中 */
.tr-help:hover{border-color:var(--iel-accent); color:var(--iel-accent-deep); background:var(--iel-tint);}
.tr-help.on{background:var(--iel-accent-soft); border-color:var(--iel-accent); color:var(--iel-accent-deep);}
.tr-bubble{position:absolute; top:calc(100% + 10px); right:0; width:min(330px, calc(100vw - 40px)); background:var(--iel-glass-strong); -webkit-backdrop-filter:var(--iel-blur); backdrop-filter:var(--iel-blur); border:1px solid var(--iel-accent-line); border-radius:var(--iel-radius-sm); padding:10px 14px; font-size:12.5px; line-height:1.75; color:var(--iel-ink2); box-shadow:var(--iel-shadow); opacity:0; visibility:hidden; transform:translateY(-4px); transition:opacity var(--iel-t-fast), transform var(--iel-t-fast), visibility var(--iel-t-fast); z-index:60;}
.tr-bubble::before{content:""; position:absolute; top:-5px; right:9px; width:8px; height:8px; background:var(--iel-glass-strong); border-left:1px solid var(--iel-accent-line); border-top:1px solid var(--iel-accent-line); transform:rotate(45deg);}
.tr-bubble.show{opacity:1; visibility:visible; transform:translateY(0);}

/* ============================================================
   7. 朗读控制条（单行布局，禁止换行）
   ============================================================ */
.audiobar{position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:60; width:min(860px, calc(100% - 28px)); display:flex; align-items:center; gap:7px; flex-wrap:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.54));
  -webkit-backdrop-filter:blur(28px) saturate(200%); backdrop-filter:blur(28px) saturate(200%);
  border:1px solid rgba(255,255,255,.9); border-radius:var(--iel-radius); padding:10px 12px; margin-bottom:0;
  box-shadow:0 18px 44px rgba(30,90,70,.2), 0 2px 8px rgba(30,90,70,.08), inset 0 1px 0 rgba(255,255,255,.96), inset 0 -1px 0 rgba(255,255,255,.4);}
.audiobar .ab{padding:8px 14px; min-width:68px; font-size:13px; display:inline-flex; align-items:center; justify-content:center; gap:5px; box-shadow:var(--iel-grad-shadow), inset 0 1px 0 rgba(255,255,255,.38);}
.audiobar .ic{font-size:12px; line-height:1; flex:none; display:block;}
.audiobar .ab.ghost{padding:7px 14px; font-size:13px;}
.abar-sel{cursor:pointer; min-width:0; flex:0 1 auto; text-overflow:ellipsis;}
/* 播放器条内部控件：实白底 + 清晰描边，在玻璃底板上高对比可辨 */
.audiobar .ab.ghost,.audiobar .abar-sel{background:#fff; border:1px solid var(--iel-accent-line); box-shadow:0 2px 8px rgba(30,90,70,.1), inset 0 1px 0 rgba(255,255,255,.9); color:var(--iel-accent-deep);}
.audiobar .ab.ghost:hover{background:var(--iel-accent-soft); border-color:var(--iel-accent);}
.audiobar .navbtn{background:#fff; border:1px solid var(--iel-line); color:var(--iel-ink2); box-shadow:0 2px 8px rgba(30,90,70,.08);}
.audiobar .navbtn:hover:not(:disabled){background:var(--iel-accent-soft); border-color:var(--iel-accent); color:var(--iel-accent-deep);}
#voiceSel{max-width:168px;}
.navbtn{border:none; background:var(--iel-chip); color:var(--iel-ink3); border-radius:999px; padding:8px 11px; font-size:12px; line-height:1; cursor:pointer; white-space:nowrap; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; gap:4px; transition:background var(--iel-t-fast), color var(--iel-t-fast);}
.navbtn:hover:not(:disabled){background:var(--iel-chip-hover); color:var(--iel-accent-deep);}
.prog{display:flex; align-items:center; gap:7px; flex:1 1 100px; min-width:60px;}
.prog input[type=range]{-webkit-appearance:none; appearance:none; width:100%; min-width:36px; height:40px; background:transparent; cursor:pointer; --iel-fill:0%;}   /* 高度=触达热区（轨道仍居中 5px，视觉不变） */
.prog input[type=range]::-webkit-slider-runnable-track{height:5px; border-radius:3px; background:linear-gradient(to right, var(--iel-accent) var(--iel-fill), var(--iel-track) var(--iel-fill));}
.prog input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:15px; height:15px; border-radius:50%; background:#fff; border:2.5px solid var(--iel-accent); margin-top:-5px; box-shadow:0 1px 5px rgba(16,180,135,.35);}
.prog input[type=range]::-moz-range-track{height:5px; border-radius:3px; background:var(--iel-track);}
.prog input[type=range]::-moz-range-progress{height:5px; border-radius:3px; background:var(--iel-accent);}
.prog input[type=range]::-moz-range-thumb{width:13px; height:13px; border-radius:50%; background:#fff; border:2.5px solid var(--iel-accent);}
.prog-lab{font-size:11.5px; color:var(--iel-ink2); white-space:nowrap; font-variant-numeric:tabular-nums; flex-shrink:0;}

/* ============================================================
   8. 正文与生词标记
   ============================================================ */
.story-en{padding-left:26px;}
.story-en p{font-family:var(--iel-font-serif); font-size:18.5px; line-height:2.05; margin-bottom:22px; text-align:justify;}
.tw{color:var(--iel-tw); font-weight:600; border-bottom:2px solid rgba(13,157,116,.35); cursor:pointer; border-radius:2px; padding:0 1px;}
.tw:hover{background:rgba(13,157,116,.1);}
.tw.flash,.ow.flash{animation:flash 1.6s ease-out 2;}
@keyframes flash{0%,60%{background:#ffe9a8; box-shadow:0 0 0 3px #ffe9a8;}100%{background:transparent;}}
.ow{cursor:pointer; border-radius:2px;}
.ow:hover{background:rgba(110,110,110,.12); box-shadow:0 1.5px 0 rgba(110,110,110,.45);}
.fav-mark::after{content:"★"; font-size:.5em; color:var(--iel-gold); vertical-align:.6em; margin-left:1px; opacity:.9;}
#storyEn.no-fav .fav-mark::after{content:none;}
.fav-badge{cursor:pointer; border:none; font-family:inherit;}
.fav-badge:hover{filter:brightness(.95);}
.sen{cursor:pointer; border-radius:4px; position:relative;}
.sen:hover{background:rgba(16,180,135,.06);}
.sen.speaking{background:linear-gradient(transparent 62%, var(--iel-mark) 62%); border-radius:3px;}
/* 悬停句子时浮现“译”按钮（JS initSenHover 判定命中句）。
   按钮由 placeAllSenTrigs 吸附到正文左侧按钮槽（不与上一句文字重叠），
   左侧 -26px 仅为 JS 定位前的兜底值。触屏设备隐藏按钮，点句子直接切换译文。 */
.sen-trig{position:absolute; left:-26px; top:0; width:22px; height:22px; border:1px solid var(--iel-accent-line); background:var(--iel-glass-strong); color:var(--iel-accent-deep); font-size:11.5px; line-height:1; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; pointer-events:none; transition:opacity var(--iel-t-fast); z-index:2; -webkit-tap-highlight-color:transparent;}
.sen-trig:hover, .sen-trig:focus-visible, .sen-trig.hovering, .sen-trig.shown{opacity:1; pointer-events:auto;}
.sen-trig:hover{background:var(--iel-accent-soft);}
.sen-trig.shown{background:var(--iel-accent-soft); border-color:var(--iel-accent);}
@media (hover:none){ .sen-trig{display:none;} }
/* 手机端句尾“译”圆钮：仅在“点句译文”模式中显示（默认完全隐藏，零干扰）；桌面隐藏 */
@media (hover:hover){ .sen-chip, .tr-msw{display:none;} }
.sen-chip{display:none; align-items:center; justify-content:center; vertical-align:middle; margin-left:6px; width:22px; height:22px; padding:0; border-radius:50%; border:1px solid var(--iel-accent-line); background:rgba(255,255,255,.55); color:var(--iel-accent-deep); font-size:10.5px; line-height:1; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
.sen-chip:active{background:var(--iel-accent-soft);}
.sen-chip.on{background:var(--iel-accent); border-color:var(--iel-accent); color:#fff;}
#app.tr-mode .sen-chip{display:inline-flex;}
/* 触屏“点句译文”开关（iOS 拨杆样式）：置于“显示全部译文”左侧；桌面隐藏（桌面用句旁 hover“译”按钮） */
.tr-msw{display:inline-flex; align-items:center; gap:7px; flex:none; border:1px solid var(--iel-mark-line); background:#fff; border-radius:999px; padding:5px 12px 5px 5px; font-size:12.5px; font-weight:500; color:var(--iel-accent-deep); cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; position:relative; transition:background var(--iel-t-fast), border-color var(--iel-t-fast);}
.tr-msw::after{content:""; position:absolute; inset:-7px 0; border-radius:999px;}
.tr-msw .knob{width:28px; height:17px; border-radius:999px; background:rgba(31,45,38,.18); position:relative; flex:none; transition:background .25s;}
.tr-msw .knob::after{content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(31,45,38,.28); transition:left .25s;}
.tr-msw.on{border-color:var(--iel-accent); background:var(--iel-accent-soft);}
.tr-msw.on .knob{background:var(--iel-accent);}
.tr-msw.on .knob::after{left:13px;}
/* 竖标签智能显隐：仅滚动停止 / 朗读暂停 / 正文有操作时浮现，避免常驻干扰阅读 */
.wq-tab.auto-off{opacity:0; pointer-events:none;}
/* 触屏点句反馈：绿色一闪，确认点击已命中句子 */
@keyframes senflash{from{background:rgba(16,180,135,.16);}to{background:transparent;}}
.sen.flash{animation:senflash .55s ease-out;}

/* ============================================================
   9. 译文与测验
   ============================================================ */
/* 逐句译文：默认隐藏，点击所在英文句后展开于该句下方（span 置于段内，show 时以块级断行） */
.tr-all{flex:none; border:1px solid var(--iel-mark-line); background:#fff; color:var(--iel-accent-deep); border-radius:999px; padding:5px 13px; font-size:12.5px; font-weight:500; cursor:pointer; position:relative; transition:background var(--iel-t-fast), border-color var(--iel-t-fast);}
.tr-all::after{content:""; position:absolute; inset:-7px 0; border-radius:999px;}
.tr-all:hover{background:var(--iel-tint-hover); border-color:var(--iel-accent);}
.sen-tr{display:none;}
.sen-tr.show{display:block; margin:5px 0 9px; padding:9px 14px 8px; background:var(--iel-tint); border-left:3px solid var(--iel-mark-line); border-radius:0 var(--iel-radius-sm) var(--iel-radius-sm) 0; font-size:14.5px; line-height:1.85; color:var(--iel-ink3); animation:trIn .2s ease;}
@keyframes trIn{from{opacity:0; transform:translateY(-3px);} to{opacity:1; transform:none;}}
.sen-tr .anno{color:var(--iel-tw); font-weight:600; font-size:.92em;}
.tr-play{display:inline-flex; align-items:center; gap:4px; margin-top:6px; border:none; background:transparent; color:var(--iel-accent); font-size:12px; font-weight:500; padding:3px 6px; border-radius:6px; cursor:pointer;}
.tr-play:hover{background:rgba(16,180,135,.09);}
.tr-play .ic{font-size:10px; line-height:1;}

.quiz-sec{margin-top:8px;}
.quiz-sec h3{font-size:17px; margin-bottom:4px;}
.q-count{color:var(--iel-ink2); font-size:13px; margin-bottom:16px;}
.q-item{border:1px solid var(--iel-glass-line); border-radius:var(--iel-radius); padding:16px 18px; margin-bottom:14px; background:var(--iel-glass);}
.q-item.ok{border-color:var(--iel-ok-line); background:var(--iel-ok-bg);}
.q-item.bad{border-color:var(--iel-bad-line); background:var(--iel-bad-bg);}
.q-word{display:inline-block; font-size:12px; padding:2px 10px; margin-bottom:8px;}
.q-text{font-size:15px; font-family:var(--iel-font-serif); margin-bottom:12px; line-height:1.7;}
.q-opts label{display:flex; gap:10px; align-items:flex-start; padding:9px 12px; border:1px solid var(--iel-line); border-radius:var(--iel-radius-xs); margin-bottom:8px; cursor:pointer; font-size:14.5px; line-height:1.55; background:#fff; transition:border-color var(--iel-t-fast), background var(--iel-t-fast);}
.q-opts label:hover{border-color:var(--iel-accent); background:var(--iel-tint-hover);}
.q-opts input{margin-top:4px; accent-color:var(--iel-accent);}
.q-opts label.picked{border-color:var(--iel-accent); background:var(--iel-accent-soft);}
.q-opts label.right{border-color:var(--iel-lv3); background:#ecfaf3;}
.q-opts label.wrong{border-color:var(--iel-lv0); background:#fdf1ee;}
.q-ex{display:none; background:rgba(255,255,255,.94); border:1px solid var(--iel-accent-line); border-radius:var(--iel-radius-xs); padding:12px 14px; font-size:13.5px; line-height:1.8; color:var(--iel-ink3); margin-top:10px;}
.q-ex b{color:var(--iel-lv3);}
.q-ex.show{display:block;}
.q-mark{font-weight:700; margin-left:auto; flex:none;}
.q-mark.r{color:var(--iel-lv3);} .q-mark.w{color:var(--iel-lv0);}
.q-submit{display:block; width:100%; padding:14px; font-size:15px; margin-top:6px;}
.q-result{background:var(--iel-glass-strong); border:1px solid var(--iel-accent-line); border-radius:var(--iel-radius); padding:16px 18px; margin-bottom:16px; font-size:14.5px;}
.q-result .big{font-size:19px; font-weight:700; color:var(--iel-accent-deep); font-variant-numeric:tabular-nums;}
.q-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
.q-actions button{padding:10px 18px; font-size:14px;}

/* ============================================================
   10. 单词弹窗
   ============================================================ */
#wpop{position:fixed; z-index:200; width:340px; max-width:calc(100vw - 24px); background:var(--iel-glass-strong); border:1px solid var(--iel-glass-line); border-radius:var(--iel-radius-lg); box-shadow:var(--iel-shadow-lg); padding:16px 18px 14px; display:none;}
#wpop.show{display:block;}
.wp-x{position:absolute; top:8px; right:10px; border:none; background:none; font-size:18px; color:var(--iel-ink-faint); padding:4px;}
.wp-x::after{content:""; position:absolute; inset:-11px;}   /* 关闭钮热区 40px（视觉 19×29 不变） */
.wp-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding-right:26px;}
.wp-word{font-size:23px; font-weight:700; letter-spacing:.2px; font-family:var(--iel-font-serif); color:var(--iel-coral);}
.wp-badge{font-size:11px; padding:2px 9px;}
.wp-badge.sup{background:var(--iel-gold-bg); color:var(--iel-gold-deep);}
.wp-fav{margin-left:auto; margin-right:16px; align-self:center; border:none; background:none; cursor:pointer; width:34px; height:34px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; font-size:20px; color:var(--iel-ink-faint); flex:none; -webkit-tap-highlight-color:transparent; position:relative; transition:background var(--iel-t-fast), color var(--iel-t-fast);}
.wp-fav::after{content:""; position:absolute; inset:-4px; border-radius:12px;}   /* 34→42px 热区 */
.wp-fav-slot{display:flex; justify-content:flex-end; padding:0 14px 12px;}
.wp-fav-slot:empty{display:none;}
.wp-fav-slot .wp-fav{margin-right:0;}
.wp-fav:hover{background:var(--iel-accent-soft); color:var(--iel-accent-deep);}
.wp-fav.on{color:var(--iel-gold);}
.wp-fav.on:hover{color:var(--iel-gold-deep);}
.wp-ph{color:var(--iel-ink2); font-size:14px; margin:3px 0 8px; font-family:var(--iel-font-serif);}
.wp-def{font-size:14.5px; line-height:1.75; border-top:1px dashed var(--iel-line); padding-top:9px;}
.wp-def .dl{display:block;}
.wp-def .dl.ctx{color:var(--iel-accent-deep);}
.wp-def .dl .hit{color:var(--iel-accent-deep); font-weight:700;}
.wp-ex .ex-tag{display:inline-block; font-size:10.5px; font-weight:600; font-style:normal; background:var(--iel-accent-soft); color:var(--iel-accent-deep); border-radius:999px; padding:1px 8px; margin-bottom:4px;}
.ph-uk,.ph-us{margin-right:4px; white-space:nowrap;}
.ph-tag{font-size:11px; margin-right:3px; color:var(--iel-ink-faint); font-style:normal;}
.ph-uk.on,.ph-us.on{color:var(--iel-ink); font-weight:600;}
.ph-uk.on .ph-tag,.ph-us.on .ph-tag{color:var(--iel-accent-deep);}
/* 热区 = 音标 + 🔊 整体（按钮包裹音标文本与图标） */
.ph-spk{border:none; background:none; cursor:pointer; padding:2px 7px 2px 3px; margin-right:12px; font-size:inherit; line-height:1.5; color:var(--iel-accent-deep); border-radius:7px; display:inline-flex; align-items:baseline; gap:3px; -webkit-tap-highlight-color:transparent; position:relative;}
.ph-spk::after{content:""; position:absolute; inset:-9px 0; border-radius:7px;}   /* 纵向热区补足 40px */
.ph-spk:hover{background:var(--iel-accent-soft);}
.ph-spk .ph-uk,.ph-spk .ph-us{margin-right:0;}
.ph-spk .ph-ico{font-style:normal; font-size:.82em; line-height:1;}
.wp-ph .ph-spk:last-child{margin-right:0;}
.rv-ph{color:var(--iel-ink2); font-size:15px;}
.wp-ex{margin-top:9px; background:rgba(255,255,255,.92); border-radius:var(--iel-radius-xs); padding:9px 12px; font-size:13px; line-height:1.65; color:var(--iel-ink3);}
.wp-ex .en{font-family:var(--iel-font-serif); font-style:italic;}
.wp-stats{margin-top:10px; font-size:12.5px; color:var(--iel-ink2); border-top:1px dashed var(--iel-line); padding-top:8px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.wp-links{margin-top:8px; font-size:12.5px; word-break:break-all; display:flex; flex-wrap:wrap; gap:2px 0; align-items:center;}
.wp-links a{color:var(--iel-tw); text-decoration:none; margin-right:10px; display:inline-block; padding:3px 0; position:relative;}
.wp-links a::after{content:""; position:absolute; inset:-9px 0;}   /* 行内链接纵向热区 40px */
.wp-links a:hover{text-decoration:underline;}
.wp-links .occ-g{margin-right:8px; display:inline-flex; align-items:center; flex-wrap:wrap; padding:2px 0; gap:0;}
.wp-links .occ-g a{margin-right:0; padding:1px 0;}
.wp-links a.occ{margin-left:-6px; padding:1px 2px; color:var(--iel-accent-deep); font-size:12px; text-decoration:none;}
.wp-links a.occ:hover{background:var(--iel-accent-soft); border-radius:4px; text-decoration:none;}
.wp-lv{font-weight:700;}
#scrim{position:fixed; inset:0; z-index:150; display:none;}
#scrim.show{display:block;}

/* ============================================================
   11. 学习统计
   ============================================================ */
.ov-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:6px;}
.ov-cell{background:var(--iel-glass); border:1px solid var(--iel-glass-line); border-radius:var(--iel-radius); padding:12px 14px;}
/* 核心指标格：占据视觉焦点（大数字 + 主题底 + 跨两列），次要指标保持原规格 */
.ov-cell.hi{grid-column:span 2; background:linear-gradient(135deg,rgba(224,245,236,.92),rgba(248,253,251,.75)); border-color:var(--iel-accent-line); box-shadow:0 2px 10px rgba(16,180,135,.08);}
.ov-cell .n{font-size:22px; font-weight:700; color:var(--iel-accent-deep); font-variant-numeric:tabular-nums;}
.ov-cell.hi .n{font-size:30px; line-height:1.25;}
.ov-cell .t{font-size:12px; color:var(--iel-ink2); margin-top:2px;}
.ov-cell.hi .t{color:var(--iel-ink3); font-size:12.5px;}
.lv-legend{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 4px;}
.lv-chip{font-size:11.5px; border-radius:999px; padding:2px 10px; border:1px solid; cursor:pointer; background:#fff; user-select:none; opacity:.85; transition:opacity var(--iel-t-fast), transform var(--iel-t-fast);}
.lv-chip:hover{opacity:1;}
.lv-chip.on{color:#fff !important; opacity:1;}
.stat-controls{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; align-items:center;}
.stat-controls input[type=search]{flex:1; min-width:160px;}
.w-row{display:flex; align-items:center; gap:12px; padding:10px 8px; border-bottom:1px dashed var(--iel-line); cursor:pointer; border-radius:var(--iel-radius-xs); transition:background var(--iel-t-fast);}
.w-row:hover{background:var(--iel-tint);}
.w-row .w{font-weight:600; font-size:15px; width:130px; flex:none; overflow:hidden; text-overflow:ellipsis;}
.w-row .w small{display:block; font-weight:400; color:var(--iel-mute); font-size:11px; font-family:var(--iel-font-serif);}
.w-bar{flex:1; height:7px; background:var(--iel-line2); border-radius:99px; overflow:hidden; min-width:60px;}
.w-bar i{display:block; height:100%; border-radius:99px;}
.w-lv{flex:none; width:74px; text-align:center; font-size:11.5px; border-radius:6px; padding:2.5px 0; color:#fff; font-weight:600;}
.w-mini{flex:none; width:120px; font-size:11.5px; color:var(--iel-ink2); text-align:right; line-height:1.5;}
.w-mini b{color:var(--iel-ink);}
.load-more{display:block; margin:16px auto 0; border:1px solid var(--iel-line); background:#fff; border-radius:999px; padding:9px 26px; color:var(--iel-ink2); font-size:13px;}
.danger-zone{margin-top:22px; border-top:1px dashed var(--iel-line); padding-top:16px; text-align:right;}
.danger-zone button{border:1px solid var(--iel-coral-line); background:var(--iel-coral-bg); color:var(--iel-coral-deep); border-radius:999px; padding:10px 16px; font-size:13px;}
.backup-zone{display:flex; gap:10px; margin-top:22px; border-top:1px dashed var(--iel-line); padding-top:16px; justify-content:flex-end; flex-wrap:wrap;}
.backup-zone button{padding:10px 16px; font-size:13px;}
.acc-form{display:flex; flex-direction:column; gap:8px; margin-top:14px; max-width:360px;}
.acc-form input{border:1px solid var(--iel-line); background:#fff; color:var(--iel-ink); border-radius:999px; padding:8px 14px; font-size:13px; font-family:inherit; min-height:40px;}
.acc-form input:focus{outline:none; border-color:var(--iel-accent);}
.acc-acts{display:flex; gap:10px; flex-wrap:wrap;}
.acc-acts button{padding:8px 16px; font-size:13px; border-radius:999px; cursor:pointer; font-family:inherit;}

/* ============================================================
   12. 间隔复习
   ============================================================ */
.tab-badge{display:inline-block; min-width:17px; padding:0 5px; margin-left:6px; border-radius:9px; background:var(--iel-lv0); color:#fff; font-size:10.5px; line-height:17px; text-align:center; font-weight:600; vertical-align:1px;}
.rv-tools{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.rv-tools .rv-btn{margin:0;}
.rv-due{font-size:12.5px; color:var(--iel-ink2);}
.rv-btn{padding:10px 24px; font-size:14.5px;}
.rv-btn.ghost{padding:7px 14px; font-size:13px;}
.rv-know{background:#fff; color:var(--iel-accent-deep); border:1.5px solid var(--iel-accent-line); box-shadow:none; font-size:15px; padding:12px 26px; transition:background var(--iel-t-fast);}
.rv-know:hover{background:var(--iel-tint);}
.rv-dont{background:#fff; color:var(--iel-warn); border:1.5px solid var(--iel-warn-line); box-shadow:none; font-size:15px; padding:12px 26px; transition:background var(--iel-t-fast);}
.rv-dont:hover{background:var(--iel-warn-bg);}
.rv-prog{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:13px; color:var(--iel-ink2); font-variant-numeric:tabular-nums;}
.rv-exit{border:none; background:transparent; color:var(--iel-ink2); font-size:12.5px; cursor:pointer; padding:4px 8px; border-radius:6px;}
.rv-exit:hover{background:var(--iel-chip); color:var(--iel-ink);}
.rv-bar{height:5px; background:var(--iel-line2); border-radius:3px; overflow:hidden; margin-bottom:6px;}
.rv-bar i{display:block; height:100%; background:var(--iel-grad); transition:width .3s; border-radius:3px;}
.rv-card{min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:26px 14px;}
.rv-word{font-family:var(--iel-font-serif); font-size:42px; font-weight:700; line-height:1.2; color:var(--iel-coral);}
.rv-def{font-size:15.5px; line-height:1.7; background:var(--iel-glass); border-radius:var(--iel-radius-sm); padding:13px 20px; max-width:520px; display:none;}
.rv-def.show{display:block;}
.rv-src{font-size:12px; color:var(--iel-mute); margin-top:6px;}
.rv-acts{display:flex; gap:14px; margin-top:8px;}
.rv-hint{font-size:11.5px; color:var(--iel-mute); margin-top:12px;}

/* ============================================================
   13. 目标词速查面板
   ============================================================ */
/* 速查竖标签：近全透玻璃（3% 白底 + 1.5px 微模糊）；宽≤25px 不压字形 */
.wq-tab{position:fixed; right:0; top:130px; z-index:110; border:1px solid rgba(93,190,157,.35); border-right:none; background:rgba(255,255,255,.03); -webkit-backdrop-filter:blur(1.5px) saturate(120%); backdrop-filter:blur(1.5px) saturate(120%); border-radius:var(--iel-radius-sm) 0 0 var(--iel-radius-sm); padding:14px 6px; font-size:11.5px; color:var(--iel-accent-deep); font-weight:600; box-shadow:0 4px 16px rgba(30,90,70,.10); writing-mode:vertical-rl; letter-spacing:2.5px; cursor:pointer; transition:right .28s ease, opacity .28s ease;}
.wq-tab:hover{color:var(--iel-accent);}
.wq-tab::after{content:""; position:absolute; inset:0 -7px;}   /* 仅横向热区：27px 宽 → 41px 命中，纵向不遮挡正文 */
.wq-panel{position:fixed; right:14px; top:74px; bottom:18px; width:340px; max-width:calc(100vw - 28px); z-index:115; background:var(--iel-glass-strong); border:1px solid var(--iel-glass-line); border-radius:var(--iel-radius); box-shadow:var(--iel-shadow-lg); display:flex; flex-direction:column; transform:translateX(calc(100% + 30px)); transition:transform .28s ease, visibility 0s linear .28s; visibility:hidden;}
.wq-panel.open{transform:none; visibility:visible; transition:transform .28s ease;}
.wq-head{display:flex; align-items:center; gap:8px; padding:12px 12px 6px;}
.wq-head b{font-size:14px; flex:none;}
.wq-head .wq-n{font-size:11.5px; color:var(--iel-ink2); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.wq-close{border:none; background:none; font-size:16px; color:var(--iel-ink-faint); cursor:pointer; padding:4px 8px; flex:none; margin:-2px -4px 0 0; border-radius:8px; position:relative;}
.wq-close::after{content:""; position:absolute; inset:-7px; border-radius:12px;}
.wq-close:hover{color:var(--iel-ink); background:var(--iel-tint);}
.wq-searchrow{display:flex; align-items:center; gap:8px; margin:2px 12px 8px; flex:none;}
.wq-search{flex:1; min-width:0; background:rgba(255,255,255,.92);}
.wq-cnt{flex:none; font-size:11px; color:var(--iel-mute); font-variant-numeric:tabular-nums; min-width:30px; text-align:right;}
.wq-keys{display:flex; align-items:center; gap:4px; margin:0 12px 8px; padding:6px 9px; flex:none; font-size:11px; color:var(--iel-mute); background:rgba(16,180,135,.05); border-radius:8px;}
.wq-keys kbd{display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 4px; border-radius:4.5px; border:1px solid var(--iel-glass-line); background:linear-gradient(180deg,#fff,#f3f8f4); box-shadow:0 1px 0 rgba(31,45,38,.10), inset 0 1px 0 #fff; font-family:inherit; font-size:10px; line-height:1; color:var(--iel-ink3);}
.wq-keys i{font-style:normal; color:var(--iel-ink-faint); margin:0 1px;}
.wq-keys span{margin-left:1px;}
.wq-list{flex:1; overflow-y:auto; overflow-x:hidden; padding:0 12px 12px; scrollbar-width:thin; scrollbar-color:#d5e3db transparent;}
.wq-list::-webkit-scrollbar{width:5px;}
.wq-list::-webkit-scrollbar-thumb{background:#d5e3db; border-radius:99px;}
.wq-list::-webkit-scrollbar-thumb:hover{background:#bfd8cb;}
.wq-empty{display:none; text-align:center; color:var(--iel-ink-faint); font-size:12.5px; padding:30px 0 20px;}
.wq-empty.show{display:block;}
/* 单词行：透明列表行 + 故事列表同款虚线分割；悬浮/选中统一 1px 绿描边 */
.wq-item{position:relative; border-radius:var(--iel-radius-xs); padding:10px 6px; background:transparent; border:1px solid transparent; transition:background var(--iel-t-fast), border-color var(--iel-t-fast), box-shadow var(--iel-t-fast); -webkit-tap-highlight-color:transparent; cursor:pointer;}
.wq-item:not(:last-child)::after{content:""; position:absolute; left:6px; right:6px; bottom:0; border-bottom:1px dashed var(--iel-line); pointer-events:none;}
.wq-item:hover::after,.wq-item.sel::after{display:none;}
.wq-item:hover,.wq-item.sel{background:#fff; border-color:var(--iel-accent); box-shadow:0 1px 6px rgba(16,180,135,.14);}
.wq-item.sel{background:var(--iel-tint-hover);}
.wq-top{display:flex; align-items:flex-start; gap:4px;}
.wq-item .wq-w{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; row-gap:2px; flex:1; min-width:0;}
.wq-item .wq-w b{font-size:15px; font-family:var(--iel-font-serif); color:var(--iel-tw); flex:none;}
.wq-item .wq-ph{font-size:11px; color:var(--iel-ink2); font-family:var(--iel-font-serif); white-space:nowrap; flex:0 1 auto; min-width:0; max-width:100%;}
/* 定位钮：padding 撑热区 + 负外边距拉至行缘，图标与左侧行内边距对齐 */
.wq-loc{flex:none; width:auto; height:auto; padding:6px; margin:-6px -6px 0 0; border:none; background:none; color:var(--iel-ink-faint); border-radius:8px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent; position:relative;}
.wq-loc::after{content:""; position:absolute; inset:-3px 0; border-radius:10px;}
.wq-loc i{font-size:15px; line-height:1; display:block;}
.wq-loc:hover{color:var(--iel-accent); background:var(--iel-accent-soft);}
.wq-loc:active{color:var(--iel-accent-deep);}
/* 热区 = 音标 + 🔊 整体（按钮包裹音标文本与图标）；纵向 hit-slop 补足 40px 触达 */
.wq-spk{border:none; background:none; cursor:pointer; font-size:inherit; padding:2px 6px 2px 2px; flex:none; color:var(--iel-accent-deep); border-radius:7px; display:inline-flex; align-items:baseline; gap:3px; -webkit-tap-highlight-color:transparent; position:relative;}
.wq-spk::after{content:""; position:absolute; inset:-5px 0; border-radius:7px;}
.wq-spk:hover{background:var(--iel-accent-soft);}
.wq-item .wq-spk{padding:3px 7px 3px 3px;}
.wq-spk .ph-ico{font-style:normal; line-height:1;}
.wq-ph .ph-tag{font-size:10px;}
/* 卡片主体：完整义项 + 例句常显（词量少，无需展开交互） */
.wq-body{margin-top:3px;}
.wq-line{font-size:12.5px; color:var(--iel-ink3); line-height:1.6; padding:2px 0 2px 11px; position:relative;}
.wq-line+.wq-line{border-top:1px dashed var(--iel-line2);}
.wq-line::before{content:""; position:absolute; left:1px; top:.78em; width:4px; height:4px; border-radius:50%; background:var(--iel-accent-line);}
.wq-ex{margin-top:7px; padding:8px 10px; background:var(--iel-tint); border-radius:var(--iel-radius-xs); font-size:12px; line-height:1.65;}
.wq-ex .en{color:var(--iel-ink3); font-family:var(--iel-font-serif);}
.wq-ex .cn{color:var(--iel-mute); margin-top:3px;}

/* ============================================================
   14. 生词本
   ============================================================ */
.f-row{display:flex; gap:14px; align-items:flex-start; padding:13px 6px; border-bottom:1px dashed var(--iel-line);}
.f-row .fw{flex:none; width:120px;}
.f-row .fw .w{font-weight:700; font-size:15.5px;}
.f-row .fw .p{font-size:11.5px; color:var(--iel-mute); font-family:var(--iel-font-serif);}
.f-row .fd{flex:1; font-size:13.5px; color:var(--iel-ink3); line-height:1.65; min-width:0;}
.f-row .fs{font-size:11.5px; color:var(--iel-tw); cursor:pointer; white-space:nowrap; margin-top:3px;}
.f-row .fx{flex:none; border:none; background:none; color:#d98a80; font-size:12.5px; padding:6px;}
/* 导出工具：低频操作，置于列表底部并整体降级（主操作是「开始复习」） */
.fav-tools{display:flex; gap:8px; margin-top:18px; padding-top:14px; border-top:1px dashed var(--iel-line); flex-wrap:wrap; align-items:center;}
.fav-tools::before{content:"导出备份"; font-size:11.5px; color:var(--iel-mute); margin-right:2px;}
.fav-tools button{padding:7px 14px; font-size:12.5px;}

/* ============================================================
   15. 全局提示与响应式
   ============================================================ */
#toast{position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(20px); background:rgba(43,58,52,.92); color:#fff; padding:10px 22px; border-radius:999px; font-size:13.5px; opacity:0; transition:var(--iel-t); z-index:300; pointer-events:none; white-space:nowrap;}
/* 数据加载屏（部署版 fetch 数据期间显示；单文件版同步渲染不闪现） */
.boot{min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:40px 20px; text-align:center;}
.boot-logo{font-size:44px; filter:grayscale(.1);}
.boot-txt{font-size:15px; color:var(--iel-ink2); display:flex; align-items:center; gap:8px;}
.boot-sub{font-size:12.5px; color:var(--iel-mute);}
.boot-spin{width:14px; height:14px; border:2px solid var(--iel-line); border-top-color:var(--iel-accent); border-radius:50%; animation:bootspin .8s linear infinite;}
@keyframes bootspin{to{transform:rotate(360deg)}}
.boot-err{font-size:14px; color:#c0392b; line-height:1.8;}
.boot-err button{margin-top:10px; padding:8px 22px; border:1px solid var(--iel-accent-line); background:#fff; color:var(--iel-accent-deep); border-radius:999px; font-size:13.5px; font-family:inherit; cursor:pointer;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* 平板/窄桌面：章节选择器收窄 */
@media (max-width:780px){
  .chsel select{max-width:150px;}
}

@media (max-width:640px){
  /* iOS/安卓不支持 background-attachment:fixed，改用固定层绘制渐变 */
  html{background:none;}
  body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      linear-gradient(180deg, rgba(93,190,157,.08) 0%, rgba(93,190,157,.03) 60%, rgba(93,190,157,0) 100%),
      linear-gradient(170deg,#f8fdfa 0%,#ffffff 40%,#ffffff 100%);
    background-size:100% 64px, 100% 100%; background-repeat:no-repeat;}

  /* 一级导航：移动端侧边栏变为底部导航（同款苹果玻璃：重模糊+发丝上描边） */
  #sidenav{top:auto; right:0; bottom:0; width:auto; flex-direction:row; padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));
    background:rgba(252,253,252,.8); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    border-right:none; border-top:.5px solid rgba(31,45,38,.09); box-shadow:none;}
  .sn-logo{display:none;}
  .sn-nav{flex-direction:row; flex:1; gap:2px;}
  .sn-nav button{flex:1; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; font-size:10.5px; border-radius:10px;}
  .sn-nav button .sn-ic{width:21px; font-size:21px;}
  /* 底部导航选中态：iOS 惯例——无背景块，图标填充 + accent 色文字（覆盖桌面绿渐变底） */
  .sn-nav button.on{background:transparent; color:var(--iel-accent-deep); font-weight:600; box-shadow:none;}
  .sn-nav button .tab-badge{position:absolute; top:2px; right:calc(50% - 24px); margin-left:0;}   /* 底部导航：到期角标贴图标右上 */
  #shell{margin-left:0;}
  body.reading #sidenav{transform:translateY(102%);}   /* 阅读页沉浸：隐藏底部导航 */

  /* 顶栏：章节筛选（左，自然宽）+ 口音钮（右）——与桌面同一条宽度规则，各页一致 */
  #topbar{padding:7px 12px;}
  .topbar-in{gap:8px;}
  .accent-btn{padding:5px 8px; font-size:11.5px;}
  #topbar.compact{padding:5px 12px;}
  .chsel select{max-width:56vw; min-width:0; text-overflow:ellipsis;}
  /* iOS 聚焦自动缩放只作用于文本输入框（input/textarea）；select 弹原生选择器不触发缩放，
     故仅 input 保持 16px，所有 select 降回常规字号——否则筛选控件显得巨大 */
  input,.stat-controls input[type=search],.wq-search{font-size:16px;}
  select,.chsel select,.abar-sel,.stat-controls select{font-size:13.5px; padding:5px 9px;}

  /* 布局：默认预留底部导航高度；阅读页（底部导航隐藏，有朗读条）单独加高 */
  main{padding:16px 12px calc(84px + env(safe-area-inset-bottom,0px));}
  /* 随身听悬浮球/入口胶囊：贴底部导航顶缘（snapFabToTabbar 以实际渲染高度覆盖兜底值） */
  #lsFab,#lsGo{bottom:calc(66px + env(safe-area-inset-bottom,0px));}
  #lsPanel .audiobar{bottom:calc(10px + env(safe-area-inset-bottom,0px));}
  .card{padding:14px; border-radius:14px;}

  /* 首页故事列表：中文副标题独立成行——长英文标题换行时不再把中文挤到行中错乱 */
  .story-item{gap:10px; padding:13px 2px;}
  .s-num{width:38px; height:38px; border-radius:12px; font-size:13px;}
  .s-title{font-size:14.5px; line-height:1.35;}
  .s-title .tcn{display:block; font-size:12px; margin:2px 0 0;}
  .s-meta{font-size:11.5px; gap:8px; margin-top:6px;}
  .s-go,.s-go.sub{padding:8px 12px; font-size:12.5px;}

  /* 悬浮标题条 */
  .reader-head{top:8px; gap:4px; padding:5px 10px 5px 5px;}
  .r-title{font-size:13.5px;}
  .r-title .tcn{font-size:10.5px; margin-left:5px;}
  .r-title .r-pos{font-size:10px; padding:1px 5px; margin-left:6px;}
  .nav-arrow{padding:0 8px; height:24px; font-size:11px;}
  body.reading main{padding-top:56px; padding-bottom:150px;}
  .r-badges{gap:8px; margin-bottom:10px;}
  .r-badge{font-size:11px; padding:2px 8px;}
  .tr-all{padding:4px 11px; font-size:11.5px;}
  .tr-bubble{width:calc(100vw - 32px); font-size:12px;}
  /* 超窄屏（≤350px）：徽章行整体收紧，保证一排放下 */
  @media (max-width:350px){
    .r-badges{gap:4px;}
    .r-badge{font-size:10px; padding:2px 6px;}
    .tr-msw{padding:4px 8px 4px 4px; font-size:10.5px;}
    .tr-all{padding:4px 8px; font-size:10.5px;}
  }

  /* 播放条：两行紧凑布局（第一行控制与进度，第二行语速/音色）；按钮为图标+文字竖排，一眼可辨 */
  .audiobar{flex-wrap:wrap; gap:6px; padding:8px 10px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); width:calc(100% - 24px);}
  #btnPlay{order:1;} #btnStop{order:2;} #btnPrev{order:3;} #btnNext{order:4;}
  .audiobar .ab,.audiobar .ab.ghost{flex:none; min-width:44px; height:46px; padding:3px 7px; font-size:14px; flex-direction:column; gap:2px;}
  .audiobar .ab .ic{font-size:14px;}
  .audiobar .navbtn .ic{font-size:13px;}
  .navbtn{flex:none; min-width:44px; height:46px; padding:3px 7px; font-size:13px; flex-direction:column; gap:2px;}
  .nb-l{display:block; font-size:10px; font-weight:500; line-height:1.2;}
  .prog{order:5; flex:1 1 auto; min-width:60px; gap:2px; flex-direction:column; justify-content:center;}
  .prog input[type=range]{height:40px;}   /* 移动端触达热区 ≥40px；轨道仍居中 5px 视觉不变 */
  .prog-lab{font-size:10px; line-height:1.2;}
  .prog input[type=range]::-webkit-slider-thumb{width:18px; height:18px; margin-top:-6.5px;}
  .prog input[type=range]::-moz-range-thumb{width:16px; height:16px;}
  #rateSel{order:6;} #voiceSel{order:7; max-width:none; flex:1.5 1 calc(50% - 4px);}
  .abar-sel{flex:1 1 calc(50% - 4px); min-width:110px; height:40px;}

  /* 正文与译文 */
  .story-en{padding-left:20px;}
  .story-en p{font-size:17px; line-height:1.95; text-align:left;}
  .sen-trig{left:-21px; width:19px; height:19px; font-size:10px;}
  .sen-tr.show{padding:8px 11px 7px; font-size:13.5px; line-height:1.75;}

  /* 测验 */
  .q-item{padding:12px;}
  .q-text{font-size:14px;}
  .q-opts label{padding:10px; font-size:14px;}
  .q-submit{padding:13px; font-size:14.5px;}

  /* 弹窗与速查面板（底部浮层避开播放条） */
  #wpop{left:12px !important; right:12px; width:auto; bottom:14px; top:auto !important; border-radius:var(--iel-radius-lg); padding:14px 14px 12px;}
  .wp-word{font-size:20px;}
  .wp-ph{font-size:13px;}
  .wp-def{font-size:14px;}
  .wq-panel{right:12px; left:12px; width:auto; top:auto; bottom:calc(122px + env(safe-area-inset-bottom,0px)); max-height:62vh;}
  /* 手机端竖标签再收窄（正文右缘留白 26px，按钮 ~22px 不触字） */
  .wq-tab{padding:12px 5px; font-size:11px; letter-spacing:2px;}
  .tr-msw{padding:4px 11px 4px 4px; font-size:11.5px;}
  .tr-msw .knob{width:25px; height:15px;}
  .tr-msw .knob::after{width:11px; height:11px;}
  .tr-msw.on .knob::after{left:12px;}
  .sen-chip{width:20px; height:20px; font-size:10px;}
  /* 手机端速查面板：更大的点按目标与字号 */
  .wq-head{padding:12px 12px 4px;}
  .wq-searchrow{margin:2px 12px 8px;}
  .wq-item{padding:11px 12px;}
  .wq-item .wq-w b{font-size:16px;}
  .wq-item .wq-ph{white-space:normal;}
  .wq-loc{padding:9px 12px; margin:-9px -12px 0 0;}
  .wq-loc i{font-size:17px;}
  .wq-spk{min-height:30px;}
  .wq-line{font-size:13px;}
  .wq-ex{font-size:12.5px;}
  .wq-list{padding:0 12px 10px;}

  /* 统计 / 生词本 / 复习：指标卡 3 列紧凑排布省纵向空间，整体掌握度通栏保持主指标权重 */
  .ov-grid{grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px;}
  .ov-cell{padding:9px 8px;}
  .ov-cell.hi{grid-column:1 / -1;}
  .ov-cell .n{font-size:19px;}
  .ov-cell.hi .n{font-size:26px;}
  .w-row .w{width:100px;}
  .w-mini{display:none;}
  .w-lv{width:64px;}
  .f-row .fw{width:96px;}
  .f-row .fd{font-size:13px;}
  .rv-word{font-size:34px;}
  .rv-def{padding:11px 14px; font-size:14.5px; max-width:none;}
  .rv-know,.rv-dont{padding:11px 20px; font-size:14px;}

   ——截断处落在主脚本中段时页面只剩导航、主内容空白且末尾自检执行不到。
   前部挂 load 监听：主脚本未完整执行（无 __APP_TAIL__ 标记）时先自动换参重拉（sessionStorage
   计数，最多 2 次防死循环），重试仍失败才弹红色警告，避免"静默坏掉"。 */
window.addEventListener("load",function(){
  if(window.__APP_TAIL__){ try{sessionStorage.removeItem("_appRetry");}catch(e){} return; }
  var n=0; try{ n=parseInt(sessionStorage.getItem("_appRetry")||"0",10)||0; }catch(e){}
  if(n<2){
    try{ sessionStorage.setItem("_appRetry", String(n+1)); }catch(e){}
    var sep = location.search.indexOf("?")>=0 ? "&" : "?";
    setTimeout(function(){ location.replace(location.pathname+location.search+sep+"_r="+Date.now()+location.hash); }, 300);
    return;
  }
  var b=document.createElement("div");
  b.textContent="⚠ 页面加载不完整（网络不稳），请刷新重试；若反复出现，请切换网络后再刷新";
  b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:#e74c3c;color:#fff;font:14px/1.6 -apple-system,sans-serif;text-align:center;padding:10px 16px;box-sizing:border-box";
  (document.body||document.documentElement).appendChild(b);
});
</script>

const DATA_VER = "5e1868d8c9";
const CHAPTERS = ["1 自然地理","2 植物研究","3 动物保护","4 太空探索","5 学校教育","6 科技发明","7 文化历史","8 语言演化","9 娱乐活动","10 物品材料","11 时尚潮流","12 饮食健康","13 建筑场所","14 交通旅行","15 国家政府","16 社会经济","17 法律法规","18 沙场争锋","19 社会角色","20 行为动作","21 身心健康","22 时间日期"];

/* —— 数据加载（部署版）：fetch JSON + Cache API 内容版本缓存 —— */

   ① 单文件 15 秒超时——被限速/干扰的连接会无限挂起且永不报错，必须主动掐断；
   ② Cloudflare 线路失败后自动改走 GitHub Pages 镜像（其响应带 access-control-allow-origin:*，跨域可取），

   ③ 全部失败 → 加载屏给出「打开备用线路」按钮，并自动跳转一次（URL 带 _sw=1 防两线路互跳死循环）。 */
const DATA_TIMEOUT=15000;
const _locHost=(typeof location!=="undefined"&&location&&location.hostname)||"";
const DATA_MIRROR=(_locHost==="ielts-vocab.bond")?"https://zp900830.github.io/ielts-vocab/":"";
const DATA_ALT=(_locHost==="ielts-vocab.bond")?"https://zp900830.github.io/ielts-vocab/"
  :(/github\.io$/.test(_locHost)?"https://ielts-vocab.bond/":"");
async function fetchOne(url){
  const ctl=new AbortController();
  const tm=setTimeout(()=>ctl.abort(),DATA_TIMEOUT);
  try{
    const r=await fetch(url,{signal:ctl.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    throw (e&&e.name==="AbortError") ? new Error("网络超时（"+Math.round(DATA_TIMEOUT/1000)+" 秒无响应）") : e;
  }finally{ clearTimeout(tm); }
}
async function fetchCached(path,onDone){
  const ver=String(DATA_VER);
  let c=null;
  try{
    c=await caches.open("iel-data");
    const hit=await c.match(path);
    if(hit&&hit.headers.get("x-ver")===ver){ onDone&&onDone(); return await hit.json(); }
  }catch(e){}   // Cache API 不可用（隐私模式等）→ 直接网络
  const urls=[path+"?v="+DATA_VER].concat(DATA_MIRROR?[DATA_MIRROR+path]:[]);
  let lastErr=null;
  for(let i=0;i<urls.length;i++){
    try{
      const data=await fetchOne(urls[i]);
      if(c){ try{ await c.put(path, new Response(JSON.stringify(data), {headers:{"x-ver":ver,"content-type":"application/json"}})); }catch(e){} }
      onDone&&onDone();
      return data;
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error("网络不可达");
}

}

const IRREG={"don't":"do not","isn't":"be","doesn't":"do","that's":"that","o'clock":"clock","was":"be","were":"be","is":"be","are":"be","been":"be","being":"be","said":"say","began":"begin","came":"come","ran":"run","grew":"grow","fell":"fall","held":"hold","stood":"stand","took":"take","went":"go","made":"make","knew":"know","wrote":"write","spoke":"speak","rose":"rise","drove":"drive","flew":"fly","gave":"give","hung":"hang","slid":"slide","wept":"weep","hid":"hide","lit":"light","met":"meet","told":"tell","kept":"keep","felt":"feel","left":"leave","fed":"feed","blew":"blow","drank":"drink","ate":"eat","sat":"sit","saw":"see","brought":"bring","bought":"buy","taught":"teach","caught":"catch","built":"build","lost":"lose","sent":"send","spent":"spend","understood":"understand","drew":"draw","drawn":"draw","known":"know","worn":"wear","wore":"wear","chose":"choose","chosen":"choose","froze":"freeze","frozen":"freeze","broke":"break","broken":"break","found":"find","laid":"lay","led":"lead","lay":"lie","lain":"lie","am":"be","does":"do","done":"do","gone":"go","got":"get","became":"become","heard":"hear","paid":"pay","sold":"sell","men":"man","women":"woman","mice":"mouse","wives":"wife","teeth":"tooth","feet":"foot","fought":"fight","dug":"dig","sang":"sing","sung":"sing","rang":"ring","rung":"ring","spoken":"speak","stolen":"steal","torn":"tear","woven":"weave","sewn":"sew","driven":"drive","beaten":"beat","burnt":"burn","forgotten":"forget","forgiven":"forgive","meant":"mean","lent":"lend","threw":"throw","bore":"bear","won":"win","dying":"die","lying":"lie","eaten":"eat","slept":"sleep","undone":"undo","repaid":"repay","can't":"can","you'll":"you","shook":"shake","stuck":"stick","struck":"strike","bound":"bind","ground":"grind","bent":"bend","bled":"bleed","copied":"copy","carried":"carry","tried":"try","emptied":"empty","married":"marry","studied":"study","worried":"worry","buried":"bury","applied":"apply","replied":"reply","supplied":"supply","hurried":"hurry"};

function lemmaCandidates(w){
  const out=[w];
  if(w.endsWith("'s")||w.endsWith("’s")) out.push(w.slice(0,-2));
  if(w.endsWith("ies")&&w.length>4) out.push(w.slice(0,-3)+"y");
  /* 屈折还原：阈值放宽到 ≥4/≥5（原 >4/>5 把 owed、goes、owing 这类恰为 4/5 字母的常用屈折形式整个漏掉）；
     真实短词（feed/need/king 等）不受影响——resolveWord 先做 DICT 精确命中，候选仅兜底。
     候选顺序=长词干优先（先试去掉尾字母的完整词干），避免 using→us、united→unit、user→us 截过头误命中 */
  if(w.endsWith("es")&&w.length>=4){ out.push(w.slice(0,-1)); out.push(w.slice(0,-2)); }
  if(w.endsWith("s")&&w.length>3) out.push(w.slice(0,-1));
  if(w.endsWith("ing")&&w.length>=5){ out.push(w.slice(0,-3)+"e"); out.push(w.slice(0,-3)); if(w.length>6&&w[w.length-4]===w[w.length-5]) out.push(w.slice(0,-4)); }
  if(w.endsWith("ed")&&w.length>=4){ out.push(w.slice(0,-1)); out.push(w.slice(0,-2)); if(w.length>5&&w[w.length-3]===w[w.length-4]) out.push(w.slice(0,-3)); }
  if(w.endsWith("er")&&w.length>=4){ out.push(w.slice(0,-1)); out.push(w.slice(0,-2)); }
  if(w.endsWith("est")&&w.length>=5){ out.push(w.slice(0,-2)); out.push(w.slice(0,-3)); }
  if(w.endsWith("ly")&&w.length>4) out.push(w.slice(0,-2));
  const hy=w.indexOf("-");
  if(hy>0){ const parts=w.split("-"); parts.forEach(p=>{ if(p.length>2) out.push(p); }); }
  return out;
}
const _rwCache=new Map();   // resolveWord 结果缓存：updateFavMarks 等会按词表批量调用，避免重复屈折还原运算
function resolveWord(w){
  w=w.toLowerCase().replace(/’/g,"'").replace(/'+$/,"");
  if(_rwCache.has(w)) return _rwCache.get(w);
  const r=_resolveWord(w);
  _rwCache.set(w,r);
  return r;
}
function _resolveWord(w){
  if(DICT[w]) return w;
  if(IRREG[w]){ const b=IRREG[w]; if(b==="do not"){ if(DICT["do"]) return "do"; } else if(DICT[b]) return b; }
  const cands=lemmaCandidates(w);
  for(let i=1;i<cands.length;i++){ if(DICT[cands[i]]) return cands[i]; }
  if(IRREG[w]) return IRREG[w];
  return null;
}

    if(typeof updateFavBadge==="function") updateFavBadge();
  },
  /* 登录后：先查角色（审批状态）——待审批视同游客（重渲染以套用锁定）；正常账号拉取云端 + 上报活跃 */
  async afterLogin(){
    await this.fetchRole();
    this.touch();
    CLOUD_TTS.checkStatus().then(()=>{ try{ audio.loadVoices(); }catch(e){} });   // 云端语音可用性就绪后重载音色
    if(this.role==="pending"){
      if(typeof switchView==="function"&&typeof VIEW!=="undefined") switchView(VIEW);   // 角色影响首页锁定态，需重渲染
      toast("账号待管理员审批，通过后即可解锁全部功能与云端同步");
      return;
    }
    this.pull();
  },
  async fetchRole(){
    this.role=null;
    if(!this.user) return;
    try{
      const c=await this.client();
      const {data}=await c.from("profiles").select("role").eq("user_id",this.user.id).maybeSingle();
      this.role=(data&&data.role)||"user";
    }catch(e){}
    /* 待审批期间每 60s 轮询一次：管理员通过审批后本端自动解锁，无需重新登录 */
    clearTimeout(this._roleT);
    if(this.role==="pending"){
      this._roleT=setTimeout(async()=>{
        const was=this.role;
        await this.fetchRole();
        if(this.role!=="pending"&&was==="pending"){
          toast("审批已通过，全部功能已解锁");
          this.pull();
          if(typeof switchView==="function"&&typeof VIEW!=="undefined") switchView(VIEW);
        }
      },60*1000);
    }
  },
  /* 上报活跃时间：登录时 + 每 15 分钟一次（security definer 函数，仅更新自己的行） */
  _touchT:null,
  touch(){
    if(!this.user) return;
    clearTimeout(this._touchT);
    this._touchT=setTimeout(()=>this.touch(),15*60*1000);
    this.client().then(c=>c.rpc("touch_profile")).catch(()=>{});
  },
  /* 拉取云端并与本地合并：云端新 → 覆盖本地；本地新或云端空 → 推送本地 */
  async pull(){
    if(!this.user) return;
    try{
      const c=await this.client();
      const {data,error}=await c.from("learning_data").select("data,updated_at").eq("user_id",this.user.id).maybeSingle();
      if(error) throw error;
      this.lastSync=Date.now(); this._errShown=false;
      if(data&&data.data){
        const rts=data.updated_at?Date.parse(data.updated_at):0, lts=S._m||0;
        if(rts>lts){
          S=Object.assign(freshS(),data.data);
          try{ localStorage.setItem(userKey(),JSON.stringify(S)); }catch(e){}
          if(typeof switchView==="function"&&typeof VIEW!=="undefined") switchView(VIEW);
          if(typeof updateFavBadge==="function") updateFavBadge();
          toast("已从云端同步最新学习数据");
        } else if(lts>rts){ this.push(); }
      } else { this.push(); }   // 云端无数据（新账号或首次同步）→ 上传本地
    }catch(e){ this._toastErr(e,"云端数据拉取失败"); }
  },
  async push(){
    if(!this.user||this._pushing||this.role==="pending") return;
    this._pushing=true;
    try{
      const c=await this.client();
      const {error}=await c.from("learning_data").upsert({user_id:this.user.id, data:S, updated_at:new Date().toISOString()});
      if(error) throw error;
      this.lastSync=Date.now(); this._errShown=false;
    }catch(e){ this._toastErr(e,"云端同步失败（数据已保存在本机）"); }
    finally{ this._pushing=false; }
  },
  schedulePush(){
    if(!this.user) return;
    clearTimeout(this._pushT);
    this._pushT=setTimeout(()=>this.push(),4000);
  },
  async signUp(email,pw){
    const c=await this.client();
    const {data,error}=await c.auth.signUp({email,password:pw});
    if(error) throw error;
    if(data&&data.session){ await this.fetchRole(); return true; }   // 注册即登录（平台未开邮箱确认）
    return false;   // false = 平台开启了邮箱确认，需点确认链接
  },
  async signIn(email,pw){
    const c=await this.client();
    const {error}=await c.auth.signInWithPassword({email,password:pw});
    if(error) throw error;
  },
  async signOut(){
    try{ const c=await this.client(); await c.auth.signOut(); }catch(e){}
    this.setUser(null);
  },
  _toastErr(e,msg){
    if(this._errShown) return;
    this._errShown=true;
    toast(msg+"："+((e&&e.message)||e));
  }
};

const LEVELS=[{name:"陌生",color:"var(--iel-lv0)"},{name:"眼熟",color:"var(--iel-lv1)"},{name:"基本掌握",color:"var(--iel-lv2)"},{name:"牢固",color:"var(--iel-lv3)"}];
const LEVEL_COLORS=["#d9534f","#e08b3a","#4a90d9","#3fa66a"];
function mastery(w){
  const st=S.stats[w]; if(!st) return null;
  const a=st.c+st.w;
  if(!a){ if(st.l>0) return {score:Math.max(0,35-st.l*7), tested:false}; return null; }
  const acc=st.c/a;
  const conf=Math.min(25,(a-1)*12);           // 多次测验提升置信度
  let score=acc*60+conf+Math.max(0,15-st.l*3); // 点查越多越减分
  return {score:Math.round(Math.max(0,Math.min(100,score))), tested:true, acc};
}
function levelIdx(score){ return score>=85?3:score>=65?2:score>=40?1:0; }

function wqPhHtml(d){
  const tag=(t)=>`<i class="ph-tag">${t}</i>`;
  const spk=(a,inner)=>`<button class="wq-spk" data-acc="${a}" title="${a==="US"?"美":"英"}式发音">${inner||""}<i class="ph-ico ri-volume-up-line" aria-hidden="true"></i></button>`;
  const uk=d?(d.phUK||d.ph||""):"", us=d?(d.phUS||d.ph||""):"";
  if(!uk&&!us) return `<span class="wq-ph">${spk("GB",tag("英"))} ${spk("US",tag("美"))}</span>`;
  return `<span class="wq-ph">${spk("GB",tag("英")+"/"+esc(uk)+"/")} ${spk("US",tag("美")+"/"+esc(us)+"/")}</span>`;
}

const WQ_LOC_SVG='<i class="ri-focus-3-line" aria-hidden="true"></i>';

function renderWordPanel(s, markedWords){

  const tab=document.getElementById("wqTab");
  const words=markedWords&&markedWords.length?markedWords:[...new Set((s.text.match(/\{\{([^}|]+)(?:\|[^}]+)?\}\}/g)||[]).map(m=>m.replace(/\{\{([^}|]+).*/,"$1").toLowerCase()))];

    <div class="wq-searchrow"><input class="wq-search" id="wqSearch" placeholder="筛选单词 / 释义…" autocomplete="off"><span class="wq-cnt" id="wqCnt"></span></div>

      const d=DICT[w]||{};
      const lines=d.book?d.def.split("\n").map(x=>x.trim()).filter(Boolean):[];
      const supDef=((d.pos||"")+" "+(d.cn||"")).trim();
      const body=d.book
        ?lines.map(l=>`<div class="wq-line">${esc(l)}</div>`).join("")
          +(d.ex?`<div class="wq-ex"><div class="en">${esc(d.ex)}</div><div class="cn">${esc(d.excn||"")}</div></div>`:"")
        :`<div class="wq-line">${esc(supDef||"—")}</div>`;
      return `<div class="wq-item" data-w="${esc(w)}">
        <div class="wq-top"><div class="wq-w"><b>${esc(w)}</b>${wqPhHtml(d)}</div>
        <button class="wq-loc" title="在正文中定位" aria-label="在正文中定位">${WQ_LOC_SVG}</button></div>
        <div class="wq-body">${body}</div></div>`;
    }).join("")}</div>
    <div class="wq-empty" id="wqEmpty">没有匹配「<span id="wqEq"></span>」的单词</div>`;
  const setOpen=(on,keep)=>{ panel.classList.toggle("open",on); tab.classList.toggle("shift",on); if(!keep){ S.wqOpen=on; save(); } };
  tab.onclick=()=>setOpen(!panel.classList.contains("open"));
  document.getElementById("wqClose").onclick=()=>setOpen(false);
  if(S.wqOpen===true) setOpen(true,true);
  const cnt=document.getElementById("wqCnt"), empty=document.getElementById("wqEmpty");
  document.getElementById("wqSearch").oninput=(e)=>{
    const q=e.target.value.trim().toLowerCase();
    let n=0;
    panel.querySelectorAll(".wq-item").forEach(it=>{
      const hit=!q||it.dataset.w.includes(q)||it.textContent.toLowerCase().includes(q);
      it.style.display=hit?"":"none"; if(hit) n++;
    });
    cnt.textContent=q?n+"/"+words.length:"";
    empty.classList.toggle("show",!!q&&!n);
    if(q) document.getElementById("wqEq").textContent=e.target.value.trim();
  };
  document.getElementById("wqList").onclick=(e)=>{
    const item=e.target.closest(".wq-item"); if(!item) return;
    const spk=e.target.closest(".wq-spk");
    if(spk){ speakWord(item.dataset.w, spk.dataset.acc||S.accent); return; }
    const loc=e.target.closest(".wq-loc");
    if(loc){
      panel.querySelectorAll(".wq-item.sel").forEach(x=>x.classList.remove("sel"));
      item.classList.add("sel");
      if(TOUCH) setOpen(false);   // 手机端收起面板，露出定位后的句子
      locateWordInStory(item.dataset.w);
      return;
    }
    panel.querySelectorAll(".wq-item.sel").forEach(x=>x.classList.remove("sel"));
    item.classList.add("sel");
    speakWordCard(item.dataset.w);   // 点击单词卡任意空白处：默认口音读单词 + 例句
  };

  if(CLOUD_TTS.available()&&!audio.playing&&!LISTEN.playing){
    const voice=cloudVoiceFor(S.accent||"GB");
    words.slice(0,4).forEach(w=>CLOUD_TTS.synth(w,voice,0).catch(()=>{}));
  }
}

function locateWordInStory(w){
  const el=app.querySelector(`.tw[data-l="${CSS.escape(w)}"]`);
  if(!el){ toast("该词未出现在本篇正文中"); return; }
  el.scrollIntoView({block:"center",behavior:"smooth"});
  el.classList.add("flash");
  setTimeout(()=>el.classList.remove("flash"),3400);
}
/* 速查面板 ↑/↓ 键盘导航（全局快捷键分发，见文末 keydown） */
function wqNav(step){
  const panel=document.getElementById("wqPanel"); if(!panel) return;
  const list=document.getElementById("wqList");
  const vis=[...panel.querySelectorAll(".wq-item")].filter(it=>it.style.display!=="none");
  if(!vis.length) return;
  let i=vis.findIndex(it=>it.classList.contains("sel"));
  i=i<0?(step>0?0:vis.length-1):Math.min(vis.length-1,Math.max(0,i+step));
  panel.querySelectorAll(".wq-item.sel").forEach(x=>x.classList.remove("sel"));
  vis[i].classList.add("sel");
  /* 用 scrollBy 精确把选中卡滚到列表视口垂直居中（scrollIntoView 会牵动整页滚动） */
  if(list){ const lr=list.getBoundingClientRect(), ir=vis[i].getBoundingClientRect();
    list.scrollBy({top: ir.top-lr.top-(lr.height-ir.height)/2, behavior:"smooth"}); }
}
function wqSpeakSel(){

  if(it) speakWordCard(it.dataset.w);
}

function splitSentences(text){
  const res=[]; let start=0;
  const abbr=/^(Mr|Mrs|Ms|Dr|St|Mt|Prof|Capt|No|vs|etc|approx|Jr|Sr)$/;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==="."||ch==="!"||ch==="?"){
      let j=i+1;
      while(j<text.length&&/["”'’)\]]/.test(text[j])) j++;
      const before=text.slice(Math.max(0,i-6),i+1);
      const m=before.match(/([A-Za-z]+)\.$/);
      if(m&&abbr.test(m[1])) continue;
      if(j>=text.length||/\s/.test(text[j])){
        let k=j; while(k<text.length&&/\s/.test(text[k])) k++;
        if(k>=text.length||/[A-Z0-9"“'‘]/.test(text[k])){
          const sen=text.slice(start,j).trim(); if(sen) res.push(sen);
          start=k; i=k-1;
        }
      }
    }
  }
  const tail=text.slice(start).trim(); if(tail) res.push(tail);
  return res;
}

}
function renderStoryText(text){
  let si=0;
  return text.split(/\n\n+/).map(par=>{
    const sens=splitSentences(par);
    const sHtml=sens.map(sen=>{
      const tr=TR_SENS[si]||"";
      const h=`<span class="sen" data-si="${si}">${tr?`<button class="sen-trig" data-si="${si}" title="显示/收起本句译文" aria-label="显示或收起本句译文">译</button>`:""}${renderInner(sen)}${tr?`<button class="sen-chip" data-si="${si}" title="显示/收起本句译文" aria-label="显示或收起本句译文">译</button>`:""}</span>`
        +(tr?`<span class="sen-tr" data-for="${si}">${renderTrSentence(tr)}<button class="tr-play" data-si="${si}" title="朗读此句（读完自动停）"><i class="ic ri-play-fill" aria-hidden="true"></i>朗读此句</button></span>`:"");
      si++; return h;
    }).join(" ");
    return `<p>${sHtml}</p>`;
  }).join("");
}
/* 多行句子悬停：CSS :hover 对跨行行内元素不可靠，改由 JS 判定。
   优先级：① 鼠标在“译”按钮上 → 按钮所属句（不会被上一句抢占）
          ② 鼠标在某句文字/子元素上 → 该句
          ③ 鼠标在正文区 → 按行矩形命中（±4px 容差，含行尾空白）
          ④ 鼠标在左侧按钮槽 → 按首行高度匹配句子（沿槽上下滑动即选句）
   无命中时延迟 500ms 收起，鼠标路过空隙不中断。 */
function placeAllSenTrigs(){
  const box=document.getElementById("storyEn"); if(!box) return;
  const br=box.getBoundingClientRect();
  const pairs=[];
  box.querySelectorAll(".sen").forEach(el=>{ const t=el.querySelector(".sen-trig"); if(t) pairs.push([t, el.getBoundingClientRect().left]); });
  pairs.forEach(p=>{ p[0].style.left=(br.left+2-p[1])+"px"; });
  initSenHover.invalidate&&initSenHover.invalidate();   // 布局重排过（开关译文/换故事/resize），句子矩形缓存失效
}
function placeSenTrig(t){
  const sen=t.closest(".sen"), box=document.getElementById("storyEn");
  if(!sen||!box) return;
  t.style.left=(box.getBoundingClientRect().left+2-sen.getBoundingClientRect().left)+"px";
}
function initSenHover(){
  const box=document.getElementById("storyEn"); if(!box||TOUCH) return;
  const pad=parseFloat(getComputedStyle(box).paddingLeft)||26;
  let cur=null, hideT=null, cache=null;
  initSenHover.invalidate=()=>{ cache=null; };
  const trigOf=el=>el.querySelector(".sen-trig");
  /* 句子行矩形缓存（页面坐标系，滚动不失效）：mousemove 命中判定只做算术比较，
     原实现每次鼠标移动都遍历全部句子并 getClientRects 强制布局读取——长文篇目下造成严重布局抖动（卡顿主因） */
  const build=()=>{
    cache=[]; const sy=window.scrollY;
    box.querySelectorAll(".sen").forEach(el=>{
      if(!el.querySelector(".sen-trig")) return;
      const lines=[];
      for(const r of el.getClientRects()) lines.push({t:r.top+sy, b:r.bottom+sy, l:r.left, r:r.right+8});
      if(lines.length) cache.push({el, lines});
    });
  };
  const show=el=>{ if(hideT){clearTimeout(hideT); hideT=null;}
    if(cur===el) return;
    if(cur){ const t=trigOf(cur); if(t) t.classList.remove("hovering"); }
    cur=el; const t=trigOf(el); if(t){ t.classList.add("hovering"); placeSenTrig(t); } };
  const hide=()=>{ if(!cur) return; const t=trigOf(cur); if(t) t.classList.remove("hovering"); cur=null; };
  const sched=()=>{ if(hideT) clearTimeout(hideT); hideT=setTimeout(hide,500); };
  box.addEventListener("mousemove",e=>{
    const tr=e.target.closest(".sen-trig");
    if(tr){ show(tr.closest(".sen")); return; }
    const s=e.target.closest(".sen");
    if(s){ if(s.querySelector(".sen-trig")) show(s); else sched(); return; }
    if(!cache) build();
    const py=e.clientY+window.scrollY;
    const br=box.getBoundingClientRect();
    const inGutter=e.clientX<br.left+pad && e.clientX>br.left-40 && e.clientY>=br.top && e.clientY<=br.bottom;
    let hit=null;
    outer:
    for(const c of cache){
      const lines=c.lines;
      for(let li=0;li<lines.length;li++){
        const ln=lines[li];
        if(ln.t-4>py) break outer;   // 句子按文档序排列，后续都在鼠标下方，提前结束
        if(inGutter){ if(li===0 && py>=ln.t-4 && py<=ln.b+4){ hit=c.el; break outer; } }
        else if(py>=ln.t-4 && py<=ln.b+4 && e.clientX>=ln.l && e.clientX<=ln.r){ hit=c.el; break outer; }
      }
    }
    if(hit) show(hit); else sched();
  });
  box.addEventListener("mouseleave",sched);
  if(!initSenHover._rz){ initSenHover._rz=1;
    window.addEventListener("resize",placeAllSenTrigs);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>initSenHover.invalidate());   // 字体加载后行高变化，缓存失效
  }
}
function renderInner(t){
  let html="";
  const parts=t.split(/(\{\{[^}]+\}\})/);
  for(let i=0;i<parts.length;i++){
    const part=parts[i];
    const m=part.match(/^\{\{([^}|]+)(?:\|([^}]+))?\}\}$/);
    if(m){ let surface=m[2]||m[1];
      const nxt=parts[i+1]||"";
      const suf=nxt.match(/^[a-z]+/);
      if(suf){ surface+=suf[0]; parts[i+1]=nxt.slice(suf[0].length); }
      html+=`<span class="tw" data-l="${esc(m[1].toLowerCase())}">${esc(surface)}</span>`;
    } else html+=wrapPlain(part);
  }
  return html;
}
function wrapPlain(t){
  let out=""; const re=/[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ'’-]*/g; let last=0, m;
  while((m=re.exec(t))){
    out+=esc(t.slice(last,m.index));
    out+=`<span class="ow" data-w="${esc(m[0].toLowerCase())}">${esc(m[0])}</span>`;
    last=m.index+m[0].length;
  }
  out+=esc(t.slice(last));
  return out;
}
/* 中文按句切分：句末标点（。！？）后切，紧跟的右引号并入该句 */
function splitCnUnits(text){
  const res=[]; let cur="";
  for(let i=0;i<text.length;i++){
    const ch=text[i]; cur+=ch;
    if(ch==="。"||ch==="！"||ch==="？"){
      if(i+1<text.length&&(text[i+1]==="”"||text[i+1]==="』")){ cur+=text[i+1]; i++; }
      const s=cur.trim(); if(s) res.push(s); cur="";
    }
  }
  if(cur.trim()) res.push(cur.trim());
  return res;
}
/* 中英逐句对齐：段落一一对应（已校验 135/135）；段内句数相等则 1:1，
   中文多句则按比例合并分给英文句，中文少句则就近复用——保证每句都有译文且零丢失 */
function mapTrSens(enText,cnTr){
  const enPars=enText.split(/\n\n+/), cnPars=cnTr.split(/\n\n+/);
  const out=[]; let si=0;
  for(let pi=0;pi<enPars.length;pi++){
    const enSens=splitSentences(enPars[pi]);
    const cnUnits=pi<cnPars.length?splitCnUnits(cnPars[pi]):[];
    const N=enSens.length, M=cnUnits.length;
    for(let k=0;k<N;k++){
      let txt="";
      if(M>0){
        if(N===M) txt=cnUnits[k];
        else if(M>N){
          const a=Math.floor(k*M/N), b=Math.max(Math.floor((k+1)*M/N), a+1);
          txt=cnUnits.slice(a,b).join("");
        } else txt=cnUnits[Math.floor(k*M/N)];
      }
      out[si++]=txt;
    }
  }
  return out;
}
function renderTrSentence(t){
  return esc(t).replace(/[（(]([A-Za-z][A-Za-z'’-]*)[）)]/g,mm=>`<span class="anno">${mm}</span>`);
}

/* 开/关某句译文：同步译文卡片、桌面悬浮钮、手机句尾圆钮三处状态 */
function setTrOpen(si,on){
  const tr=app.querySelector(`.sen-tr[data-for="${si}"]`); if(!tr) return false;
  tr.classList.toggle("show",on);
  const trig=app.querySelector(`.sen-trig[data-si="${si}"]`);
  if(trig) trig.classList.toggle("shown",on);
  const chip=app.querySelector(`.sen-chip[data-si="${si}"]`);
  if(chip){ chip.classList.toggle("on",on); chip.textContent=on?"✕":"译"; }
  initSenHover.invalidate&&initSenHover.invalidate();   // 译文展开/收起改变下方布局，句子矩形缓存失效
  return true;
}

/* 侧边竖标签智能显隐：滚动停止 / 朗读暂停或停止 / 正文有操作时才浮现 */
let TAB_OFF=false, _tabT=null;
function showTabs(on){
  if(TAB_OFF===!on) return;
  TAB_OFF=!on;
  document.querySelectorAll(".wq-tab").forEach(b=>b.classList.toggle("auto-off",!on));
}
function tabsIdleShow(delay){
  if(!document.getElementById("wqTab")) return;
  showTabs(false);
  clearTimeout(_tabT);
  _tabT=setTimeout(()=>{ if(!audio.playing&&VIEW==="reader") showTabs(true); },delay);
}

  S.trMode=on; save();   // 记住用户偏好（首次触摸设备默认开启，用户切换后尊重选择）

  }else{
