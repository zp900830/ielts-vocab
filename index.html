/* 词点击（事件委托）：词弹窗 / 朗读此句 / “译”按钮切换译文 */
app.addEventListener("click",e=>{
  if(VIEW==="reader"&&e.target.closest&&e.target.closest("#storyEn,#wpop,#quizSec")) showTabs(true);   // 正文有操作 → 竖标签浮现
  const tw=e.target.closest(".tw");
  if(tw){ showPop(tw.dataset.l,{target:true, el:tw}); return; }
  const ow=e.target.closest(".ow");
  if(ow){ const base=resolveWord(ow.dataset.w);
    if(!base){ toast("此词暂无离线释义（可能是专有名词）"); return; }
    const senEl=ow.closest(".sen");
    const si=senEl?parseInt(senEl.dataset.si,10):-1;
    showPop(base,{target:false, el:ow, surface:ow.textContent, si:isNaN(si)?-1:si});
    return; }
  if(VIEW==="reader"){
    const tp=e.target.closest(".tr-play");
    if(tp&&audio.ok()){
      const si=parseInt(tp.dataset.si,10)||0;
      if(!audio.ready()) audio.prepare();
      if(audio.ready()){ audio.seek(si); audio.single=true; if(!audio.playing) audio.play(); }   // 单句朗读：读完自动停
      return;
    }
    const chip=e.target.closest(".sen-chip");
    if(chip){
      const tr=app.querySelector(`.sen-tr[data-for="${chip.dataset.si}"]`);
      if(tr) setTrOpen(chip.dataset.si,!tr.classList.contains("show"));
      return;
    }
    const trCard=e.target.closest(".sen-tr.show");
    if(trCard){
      const sel=window.getSelection&&window.getSelection();
      if(!sel||!sel.toString()) setTrOpen(trCard.dataset.for,false);
      return;
    }
    const trig=e.target.closest(".sen-trig");
    if(trig){
      const tr=app.querySelector(`.sen-tr[data-for="${trig.dataset.si}"]`);
      if(tr) setTrOpen(trig.dataset.si,!tr.classList.contains("show"));
      placeAllSenTrigs();
      return;
    }
    const sen=e.target.closest(".sen");
    if(sen&&!e.target.closest(".tw,.ow")&&!TOUCH&&audio.ok()){
      const si=parseInt(sen.dataset.si,10)||0;
      if(!audio.ready()) audio.prepare();
      if(audio.ready()){ audio.seek(si); audio.single=true; if(!audio.playing) audio.play(); }   // 单句朗读：读完自动停
    }
  }
});

/* ---- 非目标词语境消歧：用所在句的官方译文挑出当下义项（tap→轻敲 而非 利用） ---- */
function rankDefLines(def,tr){
  const lines=def.split("\n").filter(x=>x.trim());
  if(!tr||lines.length<2) return {lines,hit:-1};
  const scored=lines.map(l=>{
    const cn=l.replace(/^[a-z]+\.\s*/i,"");
    const parts=[];
    cn.split(/[;；，,、]/).forEach(s=>{ s=s.trim(); if(s.length>1){ parts.push(s); if(/的$/.test(s)) parts.push(s.slice(0,-1)); } });
    let score=0;
    parts.forEach(p=>{ if(tr.indexOf(p)>=0) score+=p.length; });
    if(!score){   // 词组全不中时退化为汉字重合度（“轻敲”↔“轻轻一敲”共享 轻/敲）
      const chars=[...new Set(cn.match(/[\u4e00-\u9fff]/g)||[])];
      const n=chars.filter(c=>tr.indexOf(c)>=0).length;
      if(n>=2) score=n*0.4;
    }
    return {l,score};
  });
  const top=scored.reduce((a,b)=>b.score>a.score?b:a,{score:0});
  if(top.score<=0) return {lines,hit:-1};
  const order=scored.map((s,i)=>i).sort((a,b)=>scored[b].score-scored[a].score||a-b);
  return {lines:order.map(i=>scored[i].l), hit:order[0]};
}
/* 命中义项内的具体词组加高亮（如“轻敲”），返回 HTML 或 null */
function hlSense(l,tr){
  const parts=[];
  l.replace(/^[a-z]+\.\s*/i,"").split(/[;；，,、]/).forEach(s=>{ s=s.trim(); if(s.length>1){ parts.push(s); if(/的$/.test(s)) parts.push(s.slice(0,-1)); } });
  const hits=[...new Set(parts.filter(p=>tr.indexOf(p)>=0))].sort((a,b)=>b.length-a.length);
  if(!hits.length) return null;
  let segs=[[l,false]];
  hits.forEach(p=>{
    for(let i=0;i<segs.length;i++){
      if(segs[i][1]) continue;
      const k=segs[i][0].indexOf(p);
      if(k<0) continue;
      segs.splice(i,1,[segs[i][0].slice(0,k),false],[p,true],[segs[i][0].slice(k+p.length),false]);
      i+=2;
    }
  });
  return segs.map(([s,h])=>h?`<span class="hit">${esc(s)}</span>`:esc(s)).join("");
}
/* 点词所在句（与 renderStoryText 同一套切分，按 data-si 对齐），用于展示“本句”例句 */
function storySenBySi(si){
  if(!CUR_STORY||VIEW!=="reader"||si==null||si<0) return null;
  let n=0, out=null;
  CUR_STORY.text.split(/\n\n+/).forEach(par=>{ splitSentences(par).forEach(sen=>{ if(n===si) out=sen; n++; }); });
  return out;
}
function ctxExHtml(si){

}

function wordVoiceFor(acc){
  const want=acc||S.accent||"GB";
  try{
    const re=new RegExp("^en[-_]"+want+"$","i");
    const pool=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang)&&re.test(v.lang));
    if(!pool.length) return null;
    const good=pool.filter(v=>audio.voiceTier(v)>=2);
    return (good.length?good:pool).sort((a,b)=>audio.voiceTier(b)-audio.voiceTier(a))[0];
  }catch(e){ return null; }
}
function speakWord(w,acc){
  const want=acc||S.accent||"GB";
  if(CLOUD_TTS.available()){
    CLOUD_TTS.synth(w,cloudVoiceFor(want),0).then(url=>{
      const au=new Audio();   // 独立元素，避免打断正在播放的故事音频
      au.src=url; au.play().catch(()=>speakWordLocal(w,want));   // iOS 自动播放策略拦截时回退本地
    }).catch(()=>speakWordLocal(w,want));
    return;
  }
  speakWordLocal(w,want);
}
/* 口音 → 云端音色：用户选的音色口音一致则沿用，否则换该口音的默认音色（修复英/美按钮同声） */
function cloudVoiceFor(want){
  const cur=audio.cloudVoiceId||CLOUD_TTS.DEFAULT;
  if((want==="US")===/^en-US/i.test(cur)) return cur;
  return want==="US" ? "en-US-AriaNeural" : "en-GB-SoniaNeural";
}
let WORD_SEQ=0;
/* 单词卡点击：先读单词（默认口音），读完接着朗读词典例句 */
function speakWordCard(w,acc){
  const want=acc||S.accent||"GB";
  const d=DICT[w];
  const ex=d&&d.ex?d.ex.replace(/\s+/g," ").trim():"";
  if(!CLOUD_TTS.available()||!ex){ speakWord(w,want); return; }
  const seq=++WORD_SEQ, voice=cloudVoiceFor(want);
  Promise.all([CLOUD_TTS.synth(w,voice,0),CLOUD_TTS.synth(ex,voice,0)])
    .then(([wu,eu])=>{
      if(seq!==WORD_SEQ) return;
      const a1=new Audio(wu);
      a1.onended=()=>{ if(seq!==WORD_SEQ) return; new Audio(eu).play().catch(()=>{}); };
      a1.play().catch(()=>speakWordLocal(w,want));
    })
    .catch(()=>speakWord(w,want));
}
function speakWordLocal(w,want){
  if(!audio.ok()&&!CLOUD_TTS.available()&&!CLOUD_TTS._checking){ toast("当前浏览器不支持语音朗读"); return; }
  if(!audio.ok()&&CLOUD_TTS._checking){ CLOUD_TTS._whenReady(()=>speakWordLocal(w,want)); return; }
  if(!audio.ok()&&CLOUD_TTS.available()){ CLOUD_TTS.synth(w,cloudVoiceFor(want),0).then(u=>{ new Audio(u).play().catch(()=>{}); }).catch(()=>{}); return; }
  const u=new SpeechSynthesisUtterance(w);
  const v=wordVoiceFor(want);
  if(v){ u.voice=v; u.lang=v.lang; }
  else{ u.lang=want==="US"?"en-US":"en-GB"; }
  u.rate=audio.rate||0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ================= 云端自然语音引擎（Azure Speech，服务端代理） =================
   密钥由管理员在管理后台配置、仅存服务端；客户端经 Edge Function（tts）代理合成，
   浏览器全程接触不到密钥。英式/美式男女声各 2 个，自然度远超系统 TTS。
   合成结果双级缓存（内存 blob + IndexedDB 持久化），同一句重复收听不再计费。
   请求经内部队列串行 + 150ms 间隔；失败自动重试一次。仅已审批登录用户可用。 */
const CLOUD_TTS={
  DEFAULT:"en-GB-SoniaNeural",
  VOICES:[
    {id:"en-GB-SoniaNeural",  name:"Sonia 女声",   region:"英式"},
    {id:"en-GB-LibbyNeural",  name:"Libby 女声",   region:"英式"},
    {id:"en-GB-RyanNeural",   name:"Ryan 男声",    region:"英式"},
    {id:"en-GB-ThomasNeural", name:"Thomas 男声",  region:"英式"},
    {id:"en-US-AriaNeural",   name:"Aria 女声",    region:"美式"},
    {id:"en-US-JennyNeural",  name:"Jenny 女声",   region:"美式"},
    {id:"en-US-GuyNeural",    name:"Guy 男声",     region:"美式"},
    {id:"en-US-AndrewNeural", name:"Andrew 男声",  region:"美式"}
  ],
  cache:new Map(),             // key(voice|rate|text) -> blob URL，避免重复合成
  _pend:new Map(),             // key -> 进行中的合成 Promise（并发去重）
  _q:[], _busy:false,          // 请求队列：串行 + 间隔，防限流
  _on:false,                   // 服务端已配置云端语音（登录后异步探测）
  _checking:false,             // checkStatus 进行中（朗读条显示加载态，不误报"不支持"）
  _onReady:null,               // checkStatus 完成后的回调队列
  /* 登录后探测服务端是否已配置语音（管理员在后台开启即全站可用） */
  async checkStatus(){
    this._on=false; this._checking=true;
    if(!SB.user){ this._checking=false; this._fireReady(); return; }
    try{
      const c=await SB.client();
      const {data:{session}}=await c.auth.getSession();
      if(!session) return;
      const r=await fetch(SB.DEF_URL+"/functions/v1/tts",{
        method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},
        body:JSON.stringify({action:"status"})
      });
      if(r.ok){ const d=await r.json(); this._on=!!d.configured; }
    }catch(e){}
    this._checking=false;
    this._fireReady();
  },
  _fireReady(){ const cbs=this._onReady; this._onReady=null; if(cbs) cbs.forEach(fn=>{ try{ fn(); }catch(e){} }); },
  _whenReady(fn){ if(!this._checking){ fn(); } else { (this._onReady=this._onReady||[]).push(fn); } },
  available(){ return this._on && !!SB.user && SB.role!=="pending"; },
  friendlyErr(m){
    m=String(m||"");
    if(/forbidden/i.test(m)) return "云端语音需账号审批通过后使用";
    if(/unauthorized|\b401\b/i.test(m)) return "登录后才能使用云端语音";
    if(/未配置|503/.test(m)) return "云端语音暂未开放（管理员未配置）";
    if(/\b403\b/i.test(m)) return "Azure 密钥无效或与区域不匹配，请联系管理员";
    if(/quota|\b429\b|rate.?limit/i.test(m)) return "请求过于频繁或配额用尽（免费层每月 50 万字符）";
    return m;
  },
  _cacheSet(key,url){
    if(this.cache.size>=120){
      const first=this.cache.keys().next().value;
      try{ URL.revokeObjectURL(this.cache.get(first)); }catch(e){}
      this.cache.delete(first);
    }
    this.cache.set(key,url);
  },
  /* IndexedDB 持久缓存：跨会话复用音频，重复收听零计费（file:// 下不可用时静默降级） */
  _dbp:null,
  _db(){
    if(!this._dbp){
      this._dbp=new Promise(res=>{
        try{
          const rq=indexedDB.open("iel-audio",1);
          rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore("clips"); }catch(e){} };
          rq.onsuccess=()=>res(rq.result||null);
          rq.onerror=()=>res(null);
          rq.onblocked=()=>res(null);
        }catch(e){ res(null); }
      });
    }
    return this._dbp;
  },
  _idbGet(key){
    return this._db().then(db=>{
      if(!db) return null;
      return new Promise(res=>{
        try{
          const rq=db.transaction("clips","readonly").objectStore("clips").get(key);
          rq.onsuccess=()=>res(rq.result||null);
          rq.onerror=()=>res(null);
        }catch(e){ res(null); }
      });
    });
  },
  _idbSet(key,blob){
    this._db().then(db=>{
      if(!db) return;
      try{ db.transaction("clips","readwrite").objectStore("clips").put(blob,key); }catch(e){}
    });
  },
  _enqueue(fn){
    return new Promise((res,rej)=>{ this._q.push({fn,res,rej}); this._drain(); });
  },
  _drain(){
    if(this._busy||!this._q.length) return;
    this._busy=true;
    const job=this._q.shift();
    Promise.resolve().then(job.fn).then(job.res,job.rej).finally(()=>{
      this._busy=false;
      setTimeout(()=>this._drain(),150);   // 请求间隔，避免平台限流
    });
  },
  _fetch(text,voiceId,speed){
    return this._enqueue(async()=>{
      const c=await SB.client();
      const {data:{session}}=await c.auth.getSession();
      if(!session) throw new Error("unauthorized：登录后才能使用云端语音");
      const r=await fetch(SB.DEF_URL+"/functions/v1/tts",{
        method:"POST",
        headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},
        body:JSON.stringify({text,voice:voiceId,rate:speed})
      });
      if(!r.ok){
        let msg="api "+r.status;
        try{ const t=await r.text(); const j=JSON.parse(t); if(j&&j.error) msg=j.error; }catch(e){}
        throw new Error(msg);
      }
      const blob=await r.blob();
      if(!blob||!blob.size) throw new Error("no audio");
      return blob;
    });
  },
  /* 合成一句话，返回可播放的 blob URL（内存 → IndexedDB → API，三层命中） */
  async synth(text,voiceId,ratePct){
    const key="r2|"+voiceId+"|"+ratePct+"|"+text;   // r2：服务端语速格式修正后作废旧缓存
    if(this.cache.has(key)) return this.cache.get(key);
    if(this._pend.has(key)) return this._pend.get(key);
    const speed=Math.min(2,Math.max(0.5,(100+ratePct)/100));
    const p=(async()=>{
      const hit=await this._idbGet(key);
      if(hit){ const u=URL.createObjectURL(hit); this._cacheSet(key,u); return u; }
      let blob;
      try{ blob=await this._fetch(text,voiceId,speed); }
      catch(e){ await new Promise(r=>setTimeout(r,600)); blob=await this._fetch(text,voiceId,speed); }   // 限流/网络抖动重试一次
      this._idbSet(key,blob);
      const u=URL.createObjectURL(blob);
      this._cacheSet(key,u);
      return u;
    })();
    this._pend.set(key,p);
    p.finally(()=>this._pend.delete(key)).catch(()=>{});
    return p;
  }
};

/* ================= 朗读（Web Speech API + 云端语音） ================= */
const audio={
  rate:S.rate||0.85, voice:null, voices:[], idx:0, sens:[], playing:false, paused:false, gen:0, storyId:null, ests:[],
  cloudVoiceId:null, _cloudAu:null, _cloudSrc:"", _cloudFailed:false, single:false,
  ok(){ return "speechSynthesis" in window; },
  voiceTier(v){
    const n=(v.name||"").trim();
    if(/premium|enhanced|natural|neural|siri|优化音质|高音质/i.test(n)) return 3;
    if(/^google\s/i.test(n)) return 2;
    if(/^(samantha|daniel|karen|moira|tessa|fiona|aaron|serena|kate|libby|sonia|ryan|ava|allison|nathan|zoe|maisie|martha|arthur|nicky|amelia|oliver|steph|freya|catherine|sara|lois|pallavi|hare)$/i.test(n)) return 2;
    if(/^(bad news|good news|bahh|bells|boing|bubbles|cellos|jester|junior|organ|ralph|superstar|trinoids|trinid|whisper|wobble|zarvox|albert|fred|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley|boris)$/i.test(n)) return 0;
    return 1;
  },
  loadVoices(cb){
    if(!this.ok()) return;
    let tries=0;
    const load=()=>{
      const raw=speechSynthesis.getVoices()||[];
      /* Edge 150 缺陷：在线音色名返回 "Microsoft undefined Online (Natural)"，需过滤并提示升级 */

  pause(){

  _fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); },

function voiceLabel(v){
  let n=v.name.replace(/^Microsoft\s+/i,"").replace(/\s*-\s*English.*$/i,"");
  const r=(v.lang.split(/[-_]/)[1]||"").toUpperCase();
  const region={GB:"英式",US:"美式",AU:"澳",IE:"爱",ZA:"南非",IN:"印",NZ:"新",CA:"加"}[r]||r;
  const t=audio.voiceTier(v);
  const tag=t===3?"★★★ 自然":t===2?"★★ 清晰":"★";
  return n+" · "+region+" · "+tag;
}
/* Edge 云端音色：名称含 "Online (Natural)"，由微软云端渲染、免费，仅在 Edge 浏览器中出现 */
function edgeCloudVoice(v){ return /Online \(Natural\)/i.test(v.name||""); }
/* 音色下拉框选项（朗读条与随身听共用）：☁ Azure → ⚡ Edge 免费 → 本机 */
function voiceOptionsHtml(cloudOpts){
  const sel=v=>(!audio.cloudVoiceId&&audio.voice&&v.name===audio.voice.name)?"selected":"";
  const edgeOpts=audio.voices.filter(edgeCloudVoice).map(v=>`<option value="${esc(v.name)}" ${sel(v)}>${esc(voiceLabel(v))}</option>`).join("");
  const localOpts=audio.voices.filter(v=>!edgeCloudVoice(v)).map(v=>`<option value="${esc(v.name)}" ${sel(v)}">${esc(voiceLabel(v))}</option>`).join("");
  let h=voiceHintOpt();
  if(cloudOpts) h+=`<optgroup label="☁ 云端自然语音（需联网）">${cloudOpts}</optgroup>`;
  if(edgeOpts) h+=`<optgroup label="⚡ Edge 云端语音（免费）">${edgeOpts}</optgroup>`;
  if(localOpts) h+=`<optgroup label="本机语音">${localOpts}</optgroup>`;
  return h;
}
const RATES=[0.5,0.6,0.75,0.85,1.0,1.1,1.25];
const RATE_LAB={"0.5":"0.5x 特慢","0.6":"0.6x 慢速","0.75":"0.75x 稍慢","0.85":"0.85x 适中","1":"1.0x 常速","1.1":"1.1x 稍快","1.25":"1.25x 快速"};
/* 播放条图标：Remix Icon（字体图标，避免 Unicode 媒体字符在移动端渲染成方框/emoji） */
const ICONS={
  play:'<i class="ic ri-play-fill" aria-hidden="true"></i>',
  pause:'<i class="ic ri-pause-fill" aria-hidden="true"></i>',

  prev:'<i class="ic ri-play-reverse-fill" aria-hidden="true"></i>'
};
ICONS.next=ICONS.play;
function stepAudio(d){
  const was=audio.ready();

}
/* 无顶级本地语音时，在音色下拉框顶部给出可见提示（手机无悬停，tooltip 看不到） */
function voiceHintOpt(){

  if(audio.voices.some(v=>audio.voiceTier(v)>=3)) return "";
  if(CLOUD_TTS.available()) return `<option disabled>💡 选 ☁ 云端语音即点即用；用 Edge 浏览器打开本页还有 ⚡ 免费自然语音</option>`;
  const ua=(typeof navigator!=="undefined"&&navigator.userAgent)||"";
  const ios=/iPhone|iPad|iPod/i.test(ua);
  const edgeTip=ios
    ?"用 Edge 浏览器打开本页可免费用 ⚡ 云端自然语音；或在 设置→辅助功能→朗读内容→声音 下载增强版语音"
    :"用 Edge 浏览器打开本页可免费用 ⚡ 云端自然语音（无需配置）";

function renderAudioBar(){
  const bar=document.getElementById("audiobar"); if(!bar) return;
  if(!audio.ok()&&!CLOUD_TTS.available()&&!CLOUD_TTS._checking){
    bar.innerHTML=`<span style="font-size:13px;color:var(--iel-mute)">本浏览器不支持本地语音；已登录且管理员配置云端语音后可用 ☁ 云端朗读</span>`; return; }

    bar.innerHTML=`<span style="font-size:13px;color:var(--iel-mute)"><span class="boot-spin" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>正在检测云端语音…</span>`;
    CLOUD_TTS._whenReady(()=>renderAudioBar()); return; }
  const cloudOn=CLOUD_TTS.available();
  const hasVoiceSel = audio.voices.length>1 || cloudOn;
  const near=RATES.reduce((a,b)=>Math.abs(b-audio.rate)<Math.abs(a-audio.rate)?b:a);

  const cloudOpts=cloudOn?CLOUD_TTS.VOICES.map(v=>`<option value="cloud:${v.id}" ${audio.cloudVoiceId===v.id?"selected":""}>☁ ${v.name} · ${v.region}</option>`).join(""):"";

  bar.innerHTML=`
    <button class="ab" id="btnPlay">${ICONS.play}<span class="nb-l">播放</span></button>
    <button class="ab ghost" id="btnStop" title="停止并回到第 1 句">${ICONS.stop}<span class="nb-l">停止</span></button>
    <div class="prog"><input type="range" id="progRange" min="0" max="1" value="0" step="1" disabled aria-label="朗读进度"><span class="prog-lab" id="progLab">尚未开始</span></div>
    <button class="navbtn" id="btnPrev" title="跳到上一句">${ICONS.prev}<span class="nb-l">上一句</span></button>
    <button class="navbtn" id="btnNext" title="跳到下一句"><span class="nb-l">下一句</span>${ICONS.next}</button>
    <select class="abar-sel" id="rateSel" aria-label="朗读语速" title="朗读语速">${RATES.map(r=>`<option value="${r}" ${r===audio.rate?"selected":""}>${RATE_LAB[String(r)]}</option>`).join("")}</select>
    ${hasVoiceSel?`<select class="abar-sel" id="voiceSel" title="音色选择（★★★ 最自然）：&#10;☁ 云端语音：到「我的 → 云端语音」配置密钥后，选 ☁ 开头的音色，免下载、即点即用（需联网）；&#10;⚡ Edge 云端语音：用 Edge 浏览器打开本页免费出现，含英式/美式多种自然音色；&#10;本机高品质语音：iPhone/iPad 在 设置→辅助功能→朗读内容→声音 下载增强版；macOS 在 系统设置→辅助功能 下载 Premium 语音。">${voiceOpts}</select>`:""}`;
  document.getElementById("btnPlay").onclick=()=>{ if(audio.playing){ audio.pause(); } else if(!audio.cloudVoiceId&&audio.ok()&&speechSynthesis.paused&&speechSynthesis.speaking){ speechSynthesis.resume(); audio.playing=true; audio.paused=false; audio._updateBar(); } else audio.play(); };

  };

  if(pr){
    pr.addEventListener("input",e=>{ const i=parseInt(e.target.value,10)||0;
      const mx=parseInt(pr.max,10)||1;
      pr.style.setProperty("--iel-fill",(i/mx*100)+"%");
      const pl=document.getElementById("progLab");
      pl.textContent=audio._progText(i); pl.title="预估时间 "+audio._timeText(i);

  }
  audio._updateBar();
  const vs=document.getElementById("voiceSel");
  if(vs) vs.onchange=()=>{
    const val=vs.value;
    if(val.indexOf("cloud:")===0){
      audio.cloudVoiceId=val.slice(6);
      audio._cloudFailed=false;
      audio.voice=null;

  };
}

}
function lsResumeText(){
  if(!S.listen||!S.listen.sid) return "通勤路上连播全部文章 · 锁屏播放 · 断点续听";
  const s=storyById(S.listen.sid);
  if(!s) return "通勤路上连播全部文章 · 锁屏播放 · 断点续听";
  return `上次听到 第${s.ch}章《${s.title}》第 ${(S.listen.sen||0)+1} 句`;
}
function lsQueueDesc(){
  const cfg=lsState().cfg, ch=S.chapter;
  const list=STORIES.filter(s=>ch==="all"||s.ch===ch);
  let extra;
  if(cfg.scope==="unread") extra=`未读 ${list.filter(s=>!S.read[s.id]).length} 篇`;
  else if(cfg.scope==="read") extra=`已读 ${list.filter(s=>S.read[s.id]).length} 篇`;
  else extra=`共 ${list.length} 篇`;
  return `${ch==="all"?"全部章节":"第"+ch+"章"} · ${extra} · ${cfg.order==="rand"?"随机":"顺序"}`;
}
const LISTEN={
  queue:[], qi:0, sens:[], trs:[], idx:0, story:null,
  playing:false, paused:false, gen:0, stage:"en",
  _au:null, _curU:null, _zh:null, _zhTried:false, _zhWarned:false,
  _timerEnd:0, _trShow:false, _wasHidden:false, _msBound:false,

  /* ---- 队列 ---- */
  buildQueue(){
    const cfg=lsState().cfg, ch=S.chapter;
    let list=STORIES.filter(s=>ch==="all"||s.ch===ch);
    if(cfg.scope==="unread") list=list.filter(s=>!S.read[s.id]);
    else if(cfg.scope==="read") list=list.filter(s=>S.read[s.id]);
    if(!list.length) list=STORIES.filter(s=>ch==="all"||s.ch===ch);   // 过滤后为空则退回全量，保证永远有得听
    if(cfg.order==="rand") shuffle(list);
    this.queue=list.map(s=>s.id);
    this.qi=0;
    if(S.listen.sid){ const i=this.queue.indexOf(S.listen.sid); if(i>=0) this.qi=i; }
  },
  _prepare(opts){
    if(!this.queue.length) this.buildQueue();
    if(!this.queue.length) return false;
    const s=storyById(this.queue[this.qi]);
    if(!s) return false;
    this.story=s;
    const plain=s.text.replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,(m,l,ss)=>ss||l);
    this.sens=[];
    plain.split(/\n\n+/).forEach(par=>this.sens.push(...splitSentences(par)));
    this.trs=mapTrSens(s.text,s.tr);
    const saved=(opts&&opts.resume&&S.listen.sid===s.id)?(S.listen.sen||0):0;
    this.idx=Math.max(0,Math.min(saved,Math.max(0,this.sens.length-1)));
    this.stage=lsState().cfg.report?"title":"en";
    this._savePos();
    this._msUpdate();
    return true;
  },
  _savePos(){
    if(!this.story) return;
    S.listen.sid=this.story.id; S.listen.sen=this.idx; save();
  },

  /* ---- 本机中文语音（译文播报用，云语音无中文） ---- */
  _zhVoice(){
    if(this._zh||this._zhTried) return this._zh;
    try{
      const all0=speechSynthesis.getVoices();
      if(!all0.length) return null;   // 语音列表未就绪：保留下次重试机会
      this._zhTried=true;
      const all=all0.filter(v=>/^zh[-_]/i.test(v.lang));
      if(!all.length) return null;
      this._zh=all.find(v=>/zh[-_]cn/i.test(v.lang)&&/ting|婷|普通话|yunxi|xiaoxiao/i.test(v.name))
             || all.find(v=>/zh[-_]cn/i.test(v.lang)) || all[0];
    }catch(e){ this._zhTried=true; }
    return this._zh;
  },

  /* ---- 播放控制 ---- */
  play(){
    const st=lsState();
    if(this.playing) return;
    if(!this._au){ this._au=new Audio(); this._au.src=LS_SILENT_WAV; const p=this._au.play(); if(p&&p.catch) p.catch(()=>{}); }   // iOS 手势期解锁
    if(st.cfg.timer>0) this._timerEnd=Date.now()+st.cfg.timer*60000;
    if(this.paused){
      this.paused=false; this.playing=true;
      this._step(); this._paint(); this._bar(); this._msUpdate(); this._fab();
      return;
    }
    if(!this.story){ if(!this._prepare({resume:true})) { toast("没有可播放的文章"); return; } this._paint(); }
    this.playing=true; this.paused=false;
    this._bar(); this._msUpdate(); this._fab();
    this._step();
  },
  pause(){
    if(!this.playing) return;
    this.gen++;
    this._haltAudio();
    this.playing=false; this.paused=true;
    this._paint(); this._bar(); this._msUpdate(); this._fab();
  },
  stop(msg){
    this.gen++;
    this._haltAudio();
    this.playing=false; this.paused=false;
    this._paint(); this._bar(); this._msUpdate(); this._fab();
    if(msg) toast(msg);
  },
  _fab(){ if(typeof updateFab==="function") updateFab(); },
  _haltAudio(){
    if(this._au){ try{ this._au.pause(); }catch(e){} }
    if("speechSynthesis" in window){ try{ speechSynthesis.cancel(); }catch(e){} }
  },
  seek(i){
    if(!this.story){ if(!this._prepare({resume:true})) return; this._paint(); }
    i=Math.max(0,Math.min(this.sens.length-1,parseInt(i,10)||0));
    const was=this.playing;
    this.gen++;
    this._haltAudio();
    this.idx=i; this.stage="en";
    this.playing=false; this._savePos();
    if(was){ this.playing=true; this._step(); }
    else { this._paint(); this._bar(); }
  },
  step(d){ this.seek(this.idx+d); },
  storyStep(d){
    if(!this.queue.length) this.buildQueue();
    if(this.queue.length<2&&d!==0) { toast("当前范围只有 1 篇"); return; }
    const was=this.playing||this.paused;
    this.gen++;
    this._haltAudio();
    this.qi=(this.qi+d+this.queue.length)%this.queue.length;
    this.story=null;
    this.playing=false; this.paused=false;
    this._prepare({resume:false});
    this._paint(); this._bar(); this._fab();
    if(was){ this.playing=true; this._step(); }
  },
  replayStory(){
    const was=this.playing||this.paused;
    this.gen++;
    this._haltAudio();
    this.idx=0; this.stage=lsState().cfg.report?"title":"en";
    this.playing=false; this.paused=false; this._savePos();
    this._paint(); this._bar(); this._fab();
    if(was){ this.playing=true; this._step(); }
  },
  changeCfg(k,v){
    const cfg=lsState().cfg;
    if(k==="pause") cfg[k]=parseFloat(v);
    else if(k==="report"||k==="timer") cfg[k]=parseInt(v,10);
    else cfg[k]=v;
    save();
    if(k==="scope"||k==="order"){
      this.gen++;
      this._haltAudio();
      this.story=null; this.playing=false; this.paused=false;
      this._prepare({resume:true});
      this._paint(); this._bar(); this._fab();
    }
    else if(k==="timer"){
      this._timerEnd=cfg.timer>0?Date.now()+cfg.timer*60000:0;
      toast(cfg.timer===0?"已取消定时":cfg.timer===-1?"将在播完本篇后停止":`定时 ${cfg.timer} 分钟`);
    }
    else if(k==="mode"&&cfg.mode==="enzh"){
      this._zhTried=false; this._zh=null;
      if(!this._zhVoice()&&!this._zhWarned){ this._zhWarned=true; toast("本机未检测到中文语音，译文将跳过（可在系统设置下载中文语音）"); }
      this._paint();
    }
    else if(k==="report"){
      if(!cfg.report&&this.stage==="title") this.stage="en";
      this._paint();
    }
  },

  /* ---- 状态机：title → (en → tr?)* → 篇尾 ---- */
  _after(ms,cb){
    if(ms<=0){ cb(); return; }
    const g=this.gen;
    setTimeout(()=>{ if(g===this.gen) cb(); },ms);
  },
  _peekNext(){
    if(this.stage==="title") return this.sens[this.idx]||null;
    return this.sens[this.idx+1]||null;   // 只预取英文句：译文走本机中文语音，无需云合成
  },
  _step(){
    const cfg=lsState().cfg, self=this, g=this.gen;
    if(!this.story){ if(!this._prepare({resume:true})) return this.stop(); }
    if(!this.playing||g!==this.gen) return;
    if(cfg.timer>0&&this._timerEnd&&Date.now()>=this._timerEnd){ this.stop("⏲ 定时停止，晚安"); return; }
    if(this.stage==="title"){
      this._paint(); this._bar();
      this._speakEn(this.story.title,()=>self._after(350,()=>{ if(g===self.gen){ self.stage="en"; self._step(); } }));
      return;
    }
    if(this.idx>=this.sens.length){ this._storyEnd(g); return; }
    const i=this.idx;
    this._paint(); this._bar(); this._savePos();
    const advance=()=>{
      if(g!==self.gen) return;
      let gap;
      if(self.stage==="en"&&cfg.mode==="enzh"&&self.trs[i]){ gap=180; self.stage="tr"; }
      else { gap=cfg.pause*1000; self.stage="en"; self.idx++; }
      self._after(gap,()=>{ if(g===self.gen) self._step(); });
    };
    if(this.stage==="tr"){
      const zh=this._zhVoice();
      if(zh) this._speakZh(this.trs[i],zh,advance);
      else{
        if(!this._zhWarned){ this._zhWarned=true; toast("本机无中文语音，译文已跳过"); }
        advance();
      }
    }
    else this._speakEn(this.sens[i],advance);
  },
  _storyEnd(g){
    const cfg=lsState().cfg, self=this;
    if(this.story){ S.listened[this.story.id]=true; save(); }
    if(cfg.timer===-1){ this.idx=0; this._savePos(); this.stop("⏲ 播完本篇，已停止"); return; }
    if(cfg.loop==="one"){
      this.idx=0; this.stage=cfg.report?"title":"en"; this._savePos();
      this._paint(); this._bar();
      this._after(600,()=>{ if(g===self.gen) self._step(); });
      return;
    }
    if(cfg.loop==="stop"){ this.idx=0; this._savePos(); this.stop("本篇播完，已停止"); return; }
    this.qi=(this.qi+1)%this.queue.length;
    this.story=null;
    this._prepare({resume:false});
    this._paint(); this._bar(); this._fab();
    this._after(600,()=>{ if(g===self.gen) self._step(); });
  },

  /* ---- 语音执行：云优先，失败降级本机 ---- */
  _speakEn(text,cb){
    const self=this, g=this.gen;
    if(audio.cloudVoiceId&&CLOUD_TTS.available()){
      const ratePct=Math.round((audio.rate-1)*100);
      CLOUD_TTS.synth(text,audio.cloudVoiceId,ratePct).then(url=>{
        if(g!==self.gen) return;
        self._cloudErrShown=false;
        const au=self._au||(self._au=new Audio());
        au.src=url;
        au.onended=()=>{ if(g===self.gen) cb(); };
        au.onerror=()=>{ if(g===self.gen) self._speakLocalEn(text,cb); };
        au.play().catch(()=>{ if(g===self.gen){ self.playing=false; self.paused=true; self._bar(); self._msUpdate(); self._fab(); toast("播放被系统中断，点击播放继续"); } });
        const nx=self._peekNext();
        if(nx) CLOUD_TTS.synth(nx,audio.cloudVoiceId,ratePct).catch(()=>{});   // 预取下一单元，消句间等待
      }).catch(e=>{
        if(g===self.gen){
          if(!self._cloudErrShown){ self._cloudErrShown=true; toast("云端语音失败："+CLOUD_TTS.friendlyErr(e&&e.message||e)+"，本句改用本机语音"); }
          self._speakLocalEn(text,cb);
        }
      });
      return;
    }
    this._speakLocalEn(text,cb);
  },
  _speakLocalEn(text,cb){
    if(!audio.ok()){ cb(); return; }
    const g=this.gen, self=this;
    const u=new SpeechSynthesisUtterance(text);
    u.lang=audio.voice&&/^en/i.test(audio.voice.lang)?audio.voice.lang:"en-GB";
    if(audio.voice) u.voice=audio.voice;
    u.rate=audio.rate;
    this._curU=u;
    u.onend=()=>{ if(g===self.gen) cb(); };
    u.onerror=()=>{ if(g===self.gen) cb(); };
    speechSynthesis.speak(u);
  },
  _speakZh(text,v,cb){
    const g=this.gen, self=this;
    const u=new SpeechSynthesisUtterance(text);
    u.voice=v; u.lang=v.lang; u.rate=Math.min(1,Math.max(0.7,audio.rate));
    this._curU=u;
    u.onend=()=>{ if(g===self.gen) cb(); };
    u.onerror=()=>{ if(g===self.gen) cb(); };
    speechSynthesis.speak(u);
  },

  /* ---- 头部状态胶囊同步（空闲=断点，播放中=实时进度） ---- */
  _sub(){
    const box=document.getElementById("lsSub"), txt=document.getElementById("lsSubTxt");
    if(!box||!txt) return;
    let t,live=false;
    if(this.story){
      const s=this.story, n=this.sens.length;
      const pos=this.stage==="title"?"篇名":`第 ${Math.min(this.idx+1,n)}/${n} 句`;
      t=`${this.playing?"正在播":this.paused?"已暂停":"待播"} · 第${s.ch}章《${s.title}》 · ${pos}`;
      live=this.playing;
    }else t=lsResumeText();
    txt.textContent=t;
    box.classList.toggle("live",!!live);
  },
  /* ---- Now Playing 卡片渲染 ---- */
  _paint(){
    if(!lsPanelVisible()) return;
    const el=document.getElementById("lsNow"); if(!el) return;
    const s=this.story;
    if(!s){
      const r=lsResumeInfo();
      el.innerHTML=r
        ?`<div class="ls-idle">
            <div class="ls-idle-disc">🎧</div>
            <div class="ls-idle-t">从上次的位置继续</div>
            <div class="ls-idle-resume">上次听到 第${r.ch}章《<b>${esc(r.title)}</b>》第 <b>${r.sen+1}</b> 句</div>
            <button class="ls-idle-go" id="lsIdleGo" title="从上次断点继续播放"><i class="ri-play-fill" aria-hidden="true"></i> 继续播放</button>
            <div class="ls-idle-meta">${lsQueueDesc()} · 锁屏后台连播 · 自动断点续听</div>
          </div>`
        :`<div class="ls-idle">
            <div class="ls-idle-disc">🎧</div>
            <div class="ls-idle-t">开始今天的听力</div>
            <div class="ls-idle-resume">连播当前章节的文章，通勤路上锁屏也能听</div>
            <button class="ls-idle-go" id="lsIdleGo" title="开始连播"><i class="ri-play-fill" aria-hidden="true"></i> 开始播放</button>
            <div class="ls-idle-meta">${lsQueueDesc()}</div>
          </div>`;
      const go=document.getElementById("lsIdleGo"); if(go) go.onclick=()=>LISTEN.play();
      const disc=document.querySelector("#lsNow .ls-idle-disc");
      if(disc){
        const ch=r?r.ch:(S.chapter!=="all"?parseInt(S.chapter,10):1);
        const c=coverOf(ch);
        disc.classList.toggle("img",!!c);
        disc.style.backgroundImage=c?`url("${c}")`:"";
      }
      this._sub();
      return;
    }
    const cfg=lsState().cfg;
    const i=this.idx, n=this.sens.length, N=this.queue.length;
    const stageLab=this.stage==="title"?"篇名":this.stage==="tr"?"译文":`第 ${i+1}/${n} 句`;
    const sen=this.stage==="title"?s.title:(this.sens[i]||"");
    const trTxt=this.stage==="title"?("《"+s.tcn+"》"):(this.trs[i]||"");
    const showTr=this.stage!=="en"||cfg.mode==="enzh"||this._trShow;
    const stateTxt=this.playing?" · 播放中":this.paused?" · 已暂停":"";
    el.innerHTML=`
      <div class="ls-pos">
        <button class="ls-snav" id="lsPrevS" title="上一篇"${N>1?"":" disabled"}>‹ 上一篇</button>
        <span>${N?`第 ${this.qi+1}/${N} 篇 · `:""}第${s.ch}章${S.listened[s.id]?" · <i class=\"ri-headphone-line\" aria-hidden=\"true\"></i> 已听":""}</span>
        <button class="ls-snav" id="lsNextS" title="下一篇"${N>1?"":" disabled"}>下一篇 ›</button>
      </div>
      <div class="ls-title">${esc(s.title)}</div>
      <div class="ls-tcn">${esc(s.tcn)}</div>
      <div class="ls-chip"><span>${stageLab}${stateTxt}</span><button id="lsReplay" title="从本篇开头重听"><i class="ri-refresh-line" aria-hidden="true"></i> 重听本篇</button></div>
      <div class="ls-sen-box" id="lsSenBox" title="点击显示 / 隐藏本句译文">
        <div class="ls-stage">${stageLab}${stateTxt}</div>
        <div class="ls-sen speaking">${esc(sen)}</div>
        ${showTr&&trTxt?`<div class="ls-tr">${renderTrSentence(trTxt)}</div>`:""}
      </div>`;
    const pv=document.getElementById("lsPrevS"), nx=document.getElementById("lsNextS");
    if(pv) pv.onclick=()=>this.storyStep(-1);
    if(nx) nx.onclick=()=>this.storyStep(1);
    const rp=document.getElementById("lsReplay"); if(rp) rp.onclick=()=>this.replayStory();
    const sb=document.getElementById("lsSenBox"); if(sb) sb.onclick=()=>{ this._trShow=!this._trShow; this._paint(); };
    this._sub();
  },
  /* ---- 播放条状态刷新（随身听浮窗内 #audiobar） ---- */
  _bar(){
    if(!lsPanelVisible()) return;
    const bp=document.getElementById("btnPlay");
    if(bp) bp.innerHTML=(this.playing?ICONS.pause:ICONS.play)+'<span class="nb-l">'+(this.playing?"暂停":"播放")+"</span>";
    const pr=document.getElementById("progRange"), lab=document.getElementById("progLab");
    if(!pr||!lab) return;
    const n=this.sens.length;
    const pv=document.getElementById("btnPrev"), nx=document.getElementById("btnNext");
    if(!this.story||!n){
      pr.disabled=true; pr.value=0; pr.style.setProperty("--iel-fill","0%"); lab.textContent="尚未开始";
      if(pv) pv.disabled=true; if(nx) nx.disabled=true;
      return;
    }
    pr.disabled=false; pr.max=n-1;
    if(document.activeElement!==pr) pr.value=this.idx;
    pr.style.setProperty("--iel-fill",(n>1?this.idx/(n-1)*100:0)+"%");
    lab.textContent=`第${this.idx+1}/${n}句`;
    if(pv) pv.disabled=this.idx<=0;
    if(nx) nx.disabled=this.idx>=n-1;
  },

  /* ---- Media Session：锁屏/控制中心显示与遥控 ---- */
  _msUpdate(){
    if(!("mediaSession" in navigator)) return;
    const s=this.story;
    if(s){
      try{
        navigator.mediaSession.metadata=new MediaMetadata({
          title:s.title,
          artist:`雅思随身听 · ${this.queue.length?`第${this.qi+1}/${this.queue.length}篇 · `:""}第${s.ch}章`,
          album:s.tcn
        });
      }catch(e){}
    }
    try{ navigator.mediaSession.playbackState=this.playing?"playing":"paused"; }catch(e){}
  },
  _msBind(){
    if(!("mediaSession" in navigator)||this._msBound) return;
    this._msBound=true;
    const ms=navigator.mediaSession, L=this;
    const H=(a,f)=>{ try{ ms.setActionHandler(a,f); }catch(e){} };
    H("play",()=>L.play());
    H("pause",()=>L.pause());
    H("previoustrack",()=>L.storyStep(-1));
    H("nexttrack",()=>L.storyStep(1));
    H("seekbackward",()=>L.step(-1));
    H("seekforward",()=>L.step(1));
  }
};

/* ---- 随身听：全屏播放器浮窗 + 右下角入口胶囊 + 播放中旋转悬浮球 ----
   浮窗关闭后播放不中断，由悬浮球（暂停/停止/点封面重开浮窗）继续控制 */
function lsPanelVisible(){
  const p=document.getElementById("lsPanel");
  return !!(p&&p.classList.contains("open"));
}
function ensureListenPanel(){
  let p=document.getElementById("lsPanel");
  if(p) return p;
  p=document.createElement("div");
  p.id="lsPanel";
  p.innerHTML=`<div class="ls-ph"><div class="ls-ph-t"><h2>🎧 随身听</h2>
      <div class="ls-sub" id="lsSub"><span class="dot"></span><span class="txt" id="lsSubTxt"></span></div></div>
    <button class="ls-close" id="lsClose" title="收起播放器（播放不中断，右下角悬浮球可继续控制）">↓ 收起播放器</button></div>
    <div class="ls-body" id="lsBody"></div>`;
  document.body.appendChild(p);
  document.getElementById("lsClose").onclick=()=>closeListenPanel();
  return p;
}
function openListenPanel(){
  if(isGuest()) return needLogin("登录后使用随身听连播");   // 游客/待审批拦截
  const p=ensureListenPanel();
  renderListen();
  p.classList.add("open");
  document.body.classList.add("ls-lock");
  LISTEN._paint();   // 面板可见后再渲染（_paint 依赖 lsPanelVisible）
  updateFab();
}
function closeListenPanel(){
  const p=document.getElementById("lsPanel");
  if(p) p.classList.remove("open");
  document.body.classList.remove("ls-lock");
  updateFab();
}
/* 右下角旋转封面悬浮球：浮窗关闭且处于播放/暂停态时显示
   圆形封面 = 当前文章章节号 + 标题首字母（唱片式旋转，播放快/暂停慢） */
function ensureFab(){
  let f=document.getElementById("lsFab");
  if(!f){
    f=document.createElement("div");
    f.id="lsFab";
    f.innerHTML=`<button class="fab-btn" id="fabPause" title="暂停 / 继续" aria-label="暂停或继续播放"></button>
    <button class="fab-btn" id="fabStop" title="停止播放" aria-label="停止播放">${ICONS.stop}</button>

let QUIZ=null;
function renderQuizSec(s){
  QUIZ={answers:new Array(s.quiz.length).fill(null), submitted:false};
  const sec=document.getElementById("quizSec");
  sec.innerHTML=`<h3><i class="ri-focus-3-line" aria-hidden="true"></i> 本篇测验</h3>
    <div class="q-count">共 ${s.quiz.length} 题 · 题干与选项均为英文（避免靠中文蒙答案），提交后显示中文详细解析，结果计入学习统计</div>
    <div id="qList"></div>
    <button class="q-submit" id="qSubmit" disabled>提交答案</button>`;
  const list=document.getElementById("qList");
  QUIZ.qs=s.quiz.map(q=>{
    const order=shuffle([0,1,2,3]);
    return {w:q.w, q:q.q, ex:q.ex, opts:order.map(i=>q.o[i]), ans:order.indexOf(q.a)};
  });
  list.innerHTML=QUIZ.qs.map((q,i)=>`
    <div class="q-item" id="qi${i}">
      <span class="q-word">${esc(q.w)}</span>
      <div class="q-text">${esc(q.q)}</div>
      <div class="q-opts">${q.opts.map((o,j)=>`<label id="qo${i}_${j}"><input type="radio" name="q${i}" value="${j}"><span><b>${"ABCD"[j]}.</b> ${esc(o)}</span><span class="q-mark"></span></label>`).join("")}</div>
      <div class="q-ex" id="qe${i}">${esc(q.ex)}</div>
    </div>`).join("");
  list.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",()=>{
    const i=parseInt(r.name.slice(1),10);
    QUIZ.answers[i]=parseInt(r.value,10);
    document.querySelectorAll(`#qi${i} label`).forEach(l=>l.classList.remove("picked"));
    document.getElementById(`qo${i}_${r.value}`).classList.add("picked");
    document.getElementById("qSubmit").disabled=QUIZ.answers.some(a=>a===null);
  }));
  document.getElementById("qSubmit").onclick=submitQuiz;
}
function submitQuiz(){
  if(QUIZ.submitted) return;
  const s=CUR_STORY; QUIZ.submitted=true;
  let right=0;
  document.querySelectorAll("#qList input").forEach(r=>r.disabled=true);
  QUIZ.qs.forEach((q,i)=>{
    const ok=QUIZ.answers[i]===q.ans;
    if(ok) right++;
    const st=statOf(q.w.toLowerCase());
    if(ok){ st.c++; st.lr=Date.now(); } else { st.w++; st.lw=Date.now(); }
    const item=document.getElementById(`qi${i}`);
    item.classList.add(ok?"ok":"bad");
    document.getElementById(`qo${i}_${q.ans}`).classList.add("right");
    if(!ok&&QUIZ.answers[i]!==null) document.getElementById(`qo${i}_${QUIZ.answers[i]}`).classList.add("wrong");
    const mk=document.querySelector(`#qo${i}_${q.ans} .q-mark`);
    if(mk) mk.innerHTML=ok?`<span class="q-mark r">✓ 答对</span>`:`<span class="q-mark w">✗ 你选了${"ABCD"[QUIZ.answers[i]??-1]||"-"}，正确答案是 ${"ABCD"[q.ans]}</span>`;
    document.getElementById(`qe${i}`).classList.add("show");
  });
  save();
  const qr=S.quiz[s.id]||{attempts:0,best:0,lastTs:0};
  qr.attempts++; qr.best=Math.max(qr.best,right); qr.lastTs=Date.now();
  S.quiz[s.id]=qr; save();
  const pct=Math.round(right/s.quiz.length*100);
  const msg=pct===100?"全对，非常棒！":pct>=75?"不错的成绩，错题解析值得再看一遍。":pct>=50?"有进步空间，建议结合解析回读原文。":"别灰心，点开统计面板看看哪些词需要重点复习。";
  const listEl=document.getElementById("qList");
  const res=document.createElement("div");
  res.className="q-result";
  res.innerHTML=`<span class="big">得分 ${right} / ${s.quiz.length}</span>（${pct}%）· 本次结果已计入学习统计<br>${msg}
    <div class="q-actions"><button class="pri" id="qRedo"><i class="ri-refresh-line" aria-hidden="true"></i> 重做本篇测验</button><button id="qNext">下一篇故事 →</button><button id="qStats"><i class="ri-bar-chart-line" aria-hidden="true"></i> 查看学习统计</button></div>`;
  listEl.parentNode.insertBefore(res,listEl);
  res.scrollIntoView({block:"start",behavior:"smooth"});
  document.getElementById("qSubmit").disabled=true;
  document.getElementById("qSubmit").textContent="已提交";
  document.getElementById("qRedo").onclick=()=>renderQuizSec(s);
  document.getElementById("qStats").onclick=()=>switchView("stats");
  const nextBtn=document.getElementById("qNext");
  const pool2=(S.chapter==="all")?STORIES:STORIES.filter(x=>x.ch===S.chapter);
  const idx=pool2.findIndex(x=>x.id===s.id);
  const next=pool2[idx+1];
  if(next){ nextBtn.onclick=()=>openStory(next.id); } else { nextBtn.disabled=true; nextBtn.textContent=S.chapter==="all"?"已是最后一篇":("第"+S.chapter+"章最后一篇"); }
}

    const numeric=/^\d+$/.test(x.dataset.lv);

  });
}
function renderStats(){
  const ch=S.chapter;
  const words=(ch==="all"? Object.keys(CH_WORDS).flatMap(n=>CH_WORDS[n]) : CH_WORDS[ch]||[]).slice();
  const rows=words.map(w=>{
    const mz=mastery(w); const st=S.stats[w]||{l:0,c:0,w:0,lr:0,lw:0};
    const lv=mz?levelIdx(mz.score):-1;
    return {w, mz, st, lv, ns:(WORD_STORIES[w]||[]).length};
  });
  const touched=rows.filter(r=>r.mz);
  const avg=touched.length?Math.round(touched.reduce((a,r)=>a+r.mz.score,0)/touched.length):0;
  const lvCount=[0,0,0,0]; rows.forEach(r=>{ if(r.lv>=0) lvCount[r.lv]++; });
  const untouched=rows.length-touched.length;
  const totAttempts=Object.values(S.quiz).reduce((a,q)=>a+q.attempts,0);

  let html=`<div class="card">
    <div class="ov-grid">

      <div class="ov-cell"><div class="n" style="color:${LEVEL_COLORS[1]}">${lvCount[1]}</div><div class="t">眼熟</div></div>
      <div class="ov-cell"><div class="n" style="color:${LEVEL_COLORS[0]}">${lvCount[0]}</div><div class="t">陌生</div></div>
      <div class="ov-cell"><div class="n">${totAttempts}</div><div class="t">测验总次数</div></div>
    </div>
    <div class="lv-legend">${LEVELS.map((l,i)=>`<span class="lv-chip" data-lv="${i}" style="color:${LEVEL_COLORS[i]};border-color:${LEVEL_COLORS[i]}">${l.name} ${lvCount[i]}</span>`).join("")}<span class="lv-chip ${STAT_FILTER.lv==="all"?"on":""}" data-lv="all" style="color:#8a8477;border-color:#c9c2b4">全部</span><span class="lv-chip" data-lv="-1" style="color:#8a8477;border-color:#c9c2b4">未测 ${untouched}</span></div>
    <div class="stat-controls">
      <input type="search" id="statSearch" placeholder="搜索单词…" value="${esc(STAT_FILTER.q)}">
      <select id="statSort">
        <option value="weak">排序：掌握度最弱优先</option>
        <option value="strong">排序：掌握度最好优先</option>
        <option value="wrong">排序：答错次数最多</option>
        <option value="lookup">排序：点查次数最多</option>
        <option value="alpha">排序：字母顺序</option>
      </select>
    </div>
    <div id="statList"></div>
    <button class="load-more" id="statMore" style="display:none">显示更多 ↓</button>

  app.innerHTML=html;

  let _stSearchT=null;
  document.getElementById("statSearch").oninput=e=>{ clearTimeout(_stSearchT); _stSearchT=setTimeout(()=>{ STAT_FILTER.q=e.target.value.trim().toLowerCase(); renderStatList(); },200); };
  document.getElementById("statSort").onchange=e=>{ STAT_FILTER.sort=e.target.value; renderStatList(); };
  window._statRows=rows;
  renderStatList();
}
function renderStatList(){
  const rows=window._statRows||[];
  let list=rows.filter(r=>{
    if(STAT_FILTER.lv==="all") return true;
    if(STAT_FILTER.lv==="-1") return !r.mz;
    return String(r.lv)===STAT_FILTER.lv;
  });
  if(STAT_FILTER.q) list=list.filter(r=>r.w.includes(STAT_FILTER.q));
  const sorters={
    weak:(a,b)=>((a.mz?a.mz.score:200)-(b.mz?b.mz.score:200)),
    strong:(a,b)=>((b.mz?b.mz.score:-1)-(a.mz?a.mz.score:-1)),
    wrong:(a,b)=>(b.st.w-a.st.w)||((a.mz?a.mz.score:200)-(b.mz?b.mz.score:200)),
    lookup:(a,b)=>(b.st.l-a.st.l)||((a.mz?a.mz.score:200)-(b.mz?b.mz.score:200)),
    alpha:(a,b)=>a.w.localeCompare(b.w)
  };
  list.sort(sorters[STAT_FILTER.sort]||sorters.weak);
  const CHUNK=120;
  const el=document.getElementById("statList");
  let shown=0;
  function paint(){
    const frag=document.createDocumentFragment();
    const end=Math.min(shown+CHUNK,list.length);
    for(let i=shown;i<end;i++){
      const r=list[i];
      const d=DICT[r.w];
      const row=document.createElement("div"); row.className="w-row"; row.dataset.w=r.w;
      const lvHtml=r.mz?`<span class="w-lv" style="background:${LEVEL_COLORS[r.lv]}">${LEVELS[r.lv].name}·${r.mz.score}</span>`:`<span class="w-lv" style="background:#c9c2b4">未测</span>`;
      const barHtml=r.mz?`<div class="w-bar"><i style="width:${r.mz.score}%;background:${LEVEL_COLORS[r.lv]}"></i></div>`:`<div class="w-bar"></div>`;
      const a=r.st.c+r.st.w;

/* ================= 间隔复习（艾宾浩斯） ================= */
const RV_INTERVALS=[5,30,720,1440,4320,10080,21600,43200]; /* 分钟：5分/30分/12时/1天/3天/7天/15天/30天 */
function favDueTs(f){ return f.due!==undefined? f.due : (f.t||0); }
function dueWords(){
  const now=Date.now();
  return Object.entries(S.fav).filter(([w,f])=>favDueTs(f)<=now).sort((a,b)=>favDueTs(a[1])-favDueTs(b[1]));
}
function migrateFav(){
  let m=false;
  Object.values(S.fav).forEach(f=>{ if(f.due===undefined){ f.due=f.t||Date.now(); f.rv=0; m=true; } });
  if(m) save();
}
function updateFavBadge(){
  const btn=document.querySelector('#snNav button[data-view="fav"]');
  if(!btn) return;
  const n=dueWords().length;
  let b=btn.querySelector(".tab-badge");
  if(n>0){ if(!b){ b=document.createElement("span"); b.className="tab-badge"; btn.appendChild(b); } b.textContent=n>99?"99+":n; }
  else if(b) b.remove();
}
function startReview(){
  const q=dueWords();
  if(!q.length){ toast("当前没有到期单词"); return; }
  REVIEW={queue:q.map(x=>x[0]), total:q.length, seen:0, done:0, again:0, revealed:false};
  renderReview();
}
function renderReview(){
  if(REVIEW) REVIEW._grading=false;   // 新卡片渲染完成，重置防重复标记
  const w=REVIEW.queue[0];
  if(w===undefined){ return finishReview(); }
  const f=S.fav[w]||{};
  const src=storyById(f.src);
  const pct=Math.min(100,Math.round(REVIEW.seen/REVIEW.total*100));
  app.innerHTML=`<h2 class="view-title">间隔复习</h2>
  <div class="card">
    <div class="rv-prog"><span>${REVIEW.seen} / ${REVIEW.total} · 认识 ${REVIEW.done} · 不认识 ${REVIEW.again}</span><button class="rv-exit" id="rvExit"><i class="ri-close-line" aria-hidden="true"></i> 退出复习</button></div>
    <div class="rv-bar"><i style="width:${pct}%"></i></div>
    <div class="rv-card">
      <div class="rv-word">${esc(w)}</div>
      ${phBothHtml(DICT[w]||{ph:f.ph||""}, "rv-ph")}
      <div class="rv-def" id="rvDef">${esc(f.def||"（无释义）")}${src?`<div class="rv-src">来源：${esc(src.title)} · ${esc(src.tcn)}</div>`:""}</div>
      <div class="rv-acts" id="rvActs" style="display:none">
        <button class="rv-btn rv-dont" id="rvNo"><i class="ri-emotion-sad-line" aria-hidden="true"></i> 不认识</button>
        <button class="rv-btn rv-know" id="rvYes"><i class="ri-emotion-laugh-line" aria-hidden="true"></i> 认识</button>
      </div>
      <button class="rv-btn ghost" id="rvReveal" style="margin-top:4px">显示释义（空格）</button>
      <div class="rv-hint">空格 = 翻转 · 翻转后 ← 不认识 / → 认识</div>
    </div>
  </div>`;
  document.getElementById("rvExit").onclick=()=>{ REVIEW=null; switchView("fav"); };
  document.getElementById("rvReveal").onclick=revealReview;
  document.getElementById("rvNo").onclick=()=>gradeReview(false);
  document.getElementById("rvYes").onclick=()=>gradeReview(true);
}
function revealReview(){
  if(!REVIEW||REVIEW.revealed) return;
  REVIEW.revealed=true;
  const d=document.getElementById("rvDef"); if(d) d.classList.add("show");
  const r=document.getElementById("rvReveal"); if(r) r.style.display="none";
  const a=document.getElementById("rvActs"); if(a) a.style.display="flex";
}
function gradeReview(know){
  if(!REVIEW||!REVIEW.revealed||REVIEW._grading) return;
  REVIEW._grading=true;   // 防重复点击（移动端快速双击会触发两次）
  const w=REVIEW.queue.shift();
  const f=S.fav[w];
  REVIEW.seen++;
  if(f){
    const now=Date.now();
    if(know){
      f.rv=(f.rv||0)+1;
      const iv=RV_INTERVALS[Math.min(f.rv,RV_INTERVALS.length)-1];
      f.due=now+iv*60000;
      REVIEW.done++;
    } else {
      f.rv=0; f.due=now+5*60000;
      REVIEW.again++;
      REVIEW.queue.push(w);
    }
    save();
  }
  REVIEW.revealed=false;
  updateFavBadge();
  renderReview();
}
function finishReview(){
  const r=REVIEW; REVIEW=null;
  updateFavBadge();
  app.innerHTML=`<h2 class="view-title">复习完成</h2><div class="card"><div class="rv-card">
    <div style="font-size:36px">🎉</div>
    <div style="font-size:17px;font-weight:600">本轮复习 ${r.total} 词：认识 ${r.done} · 不认识 ${r.again}</div>
    <div class="rv-def show">不认识的词将在 <b>5 分钟后</b>再次到期，届时可再来一轮巩固。认识的词按 5分钟 → 30分钟 → 12小时 → 1天 → 3天 → 7天 → 15天 → 30天 间隔自动排期。</div>
    <div class="rv-acts"><button class="rv-btn ghost" id="rvBack"><i class="ri-arrow-left-s-line" aria-hidden="true"></i> 返回生词本</button></div>
  </div></div>`;
  document.getElementById("rvBack").onclick=()=>switchView("fav");
}

function exportWords(type){
  const words=Object.entries(S.fav).sort((a,b)=>b[1].t-a[1].t);
  if(!words.length){ toast("生词本为空"); return; }
  let content="",mime="text/plain",ext="txt",name="雅思生词本";
  const d=new Date(); const ds=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  if(type==="csv"){
    const rows=[["单词","音标（"+(S.accent==="US"?"美式":"英式")+"）","释义","来源故事"]];
    words.forEach(([w,f])=>{ const s=storyById(f.src); rows.push([w,"/"+wordPh(w,f.ph)+"/",f.def||"",s?(s.title+" · "+s.tcn):""]); });
    content="\uFEFF"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
    mime="text/csv"; ext="csv";
  } else if(type==="txt"){
    content=words.map(([w,f])=>{ const s=storyById(f.src); return `${w}  /${wordPh(w,f.ph)}/  ${f.def||""}${s?"  [来源: "+s.title+"]":""}`; }).join("\r\n");
  } else {
    content=words.map(([w,f])=>`${w}\t/${wordPh(w,f.ph)}/\t${(f.def||"").replace(/\s+/g," ")}`).join("\r\n");
    name="雅思生词本_Anki";
  }
  const blob=new Blob([content],{type:mime+";charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${name}_${ds}.${ext}`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },400);
  toast("已导出 "+words.length+" 个单词");
}

  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800);
  toast("已导出备份文件，请妥善保存");
}
function importBackup(e){
  const f=e.target.files&&e.target.files[0];
  if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let j=null;
    try{ j=JSON.parse(rd.result); }catch(err){ toast("文件解析失败：不是有效的 JSON 文件"); return; }
    const d=j&&j.data? j.data : j;
    if(!d||typeof d!=="object"||Array.isArray(d)||!d.stats||!d.fav){
      toast("文件格式不正确：这不是本应用导出的备份");
      return;
    }
    if(!confirm("导入将覆盖当前全部学习数据（进度、生词本、测验记录、复习计划）。\n确定继续吗？")) return;
    S=Object.assign(freshS(), d);
    migrateFav();
    save();
    audio.rate=S.rate||audio.rate;
    updateFavBadge();
    toast("导入成功，学习数据已恢复");
    if(VIEW==="me") renderMe(); else if(VIEW==="stats") renderStats(); else if(VIEW==="fav"&&!REVIEW) renderFav();
  };
  rd.readAsText(f);
  e.target.value="";
}

/* ================= 键盘快捷键 ================= */
document.addEventListener("keydown",e=>{
  if(e.isComposing||e.altKey||e.metaKey||e.ctrlKey) return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select"||tag==="textarea") return;
  if(REVIEW){
    if(e.code==="Space"){ e.preventDefault(); if(!REVIEW.revealed) revealReview(); }
    else if(REVIEW.revealed&&e.key==="ArrowRight"){ e.preventDefault(); gradeReview(true); }
    else if(REVIEW.revealed&&e.key==="ArrowLeft"){ e.preventDefault(); gradeReview(false); }
    return;
  }
  if(lsPanelVisible()){
    if(e.key==="Escape"){ e.preventDefault(); closeListenPanel(); }
    else if(e.code==="Space"){ e.preventDefault(); const bp=document.getElementById("btnPlay"); if(bp) bp.click(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); LISTEN.step(-1); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); LISTEN.step(1); }
    return;
  }
  if(VIEW==="reader"){
    const wp=document.getElementById("wqPanel");
    if(wp&&wp.classList.contains("open")){
      if(e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); wqNav(e.key==="ArrowDown"?1:-1); return; }
      if(e.key==="Enter"){ e.preventDefault(); wqSpeakSel(); return; }
      if(e.key==="Escape"){ e.preventDefault(); const c=document.getElementById("wqClose"); if(c) c.click(); return; }
    }
  }
  if(VIEW!=="reader"||(!audio.ok()&&!audio.cloudVoiceId)) return;
  if(e.code==="Space"){ e.preventDefault(); const bp=document.getElementById("btnPlay"); if(bp) bp.click(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); stepAudio(-1); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); stepAudio(1); }
});

/* ================= 顶栏滚动收缩 =================
   滚入正文(页面上移) → 收紧顶栏上下 padding；回顶(页面下移) → 恢复。
   顶栏只剩章节筛选 + 口音钮（同一行），无位移动画需求 */
(function(){
  const tb=document.getElementById("topbar");
  if(!tb) return;
  let lastY=window.scrollY||0;
  window.addEventListener("scroll",()=>{
    const y=window.scrollY||0;
    if(VIEW!=="reader"&&VIEW!=="me"){
      if(y>lastY+3 && y>24) tb.classList.add("compact");
      else if(y<lastY-3 || y<=24) tb.classList.remove("compact");
    }
    lastY=y;
  },{passive:true});
})();

/* ================= 初始化 ================= */
migrateFav();
updateFavBadge();
(function(){
  const ab=document.getElementById("accentBtn");
  if(ab){
    ab.textContent=S.accent==="US"?"🇺🇸 美音":"🇬🇧 英音";
    ab.onclick=()=>{ const next=S.accent==="US"?"GB":"US"; setAccent(next); toast(next==="US"?"全局发音已切换为 🇺🇸 美式":"全局发音已切换为 🇬🇧 英式"); };
  }
})();
audio.loadVoices(renderAudioBarIfReader);
function renderAudioBarIfReader(){ if(VIEW==="reader") renderAudioBar(); }
lsState();
ensureFab();   // 预建右下角随身听入口胶囊（播放/暂停态让位给悬浮球）
LISTEN._msBind();
/* 锁屏/切后台被系统中断后，回前台自动从断点续播（用户手动暂停则不恢复） */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){
    if(LISTEN.playing) LISTEN._wasHidden=true;
  } else if(LISTEN._wasHidden){
    LISTEN._wasHidden=false;
    setTimeout(()=>{
      if(!LISTEN.story) return;
      if(LISTEN.paused) return;   // 用户主动暂停，不打扰
      if(!LISTEN.playing){ LISTEN.play(); }   // 链路被系统掐断：从当前句续播
      else{ LISTEN.gen++; LISTEN._step(); }   // 状态尚在但音频可能已被暂停：重发当前句
    },400);
  }
});
DATA_READY.then(()=>{
  if(!DATA_INLINE){ buildDict(); buildIndexes(); fillChapterSel(); }
  switchView("home");
  SB.init();   // 恢复上次登录会话（已配置云同步时），异步拉取云端数据
  resumeLastRead();   // 上次停在阅读页：自动回到原故事原位置（内部等待会话/角色落定，游客不越权）
}).catch(()=>{});   // 失败已在加载屏提示，不进应用
window.__APP_TAIL__=1;   // 主脚本完整执行到的末尾标记（供前部 load 自检）
</script>
