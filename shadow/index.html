imental]] corner.", "Warm spring gives [[favourable:favourable]] light for long [[productive:productive]] afternoons together.", "A simple rota proves [[effective:effective]] and keeps their watering [[efficient:efficient]] daily.", "They feel [[considerable:considerable]] pride, though the plot is not [[massive:massive]] yet."], ["The night sky gives [[immense:immense]] calm with [[maximal:maximal]] stars above town.", "With [[minimal:minimal]] noise and [[optimal:optimal]] darkness, Leo ends the happy evening."], ["On Saturday morning Leo joined a kind [[zoologist:zoologist]] and a friendly [[ecologist:ecologist]] at the gate.", "A cheerful [[botanist:botanist]] showed them a soft baby [[mammal:mammal]] sleeping in warm straw.", "They watched a playful [[primate:primate]] swing while learning about each strong [[vertebrate:vertebrate]] in care.", "Next they cleaned a slow [[reptile:reptile]] enclosure and a small green [[amphibian:amphibian]] pool nearby.", "Leo learned that a meat eating [[carnivore:carnivore]] needs different meals than a grass eating [[herbivore:herbivore]].", "Every little [[creature:creature]] at the station deserves quiet care and fresh [[wildlife:wildlife]] support daily."], ["They mapped local [[fauna:fauna]] with pictures and noted the tall [[flora:flora]] around the lake.", "Each rescued [[species:species]] was listed, and a happy [[flock:flock]] of ducks passed overhead.", "Leo spotted a calm [[herd:herd]] of deer drink while a busy [[swarm:swarm]] of bees moved past.", "A noisy [[throng:throng]] of visitors arrived, but a bigger weekend [[crowd:crowd]] came after lunch.", "A large tired [[beast:beast]] rested quietly, and even a rough [[brute:brute]] dog looked calm today.", "No [[cruel:cruel]] hands are allowed here, because kindness must [[originate:originate]] from every young heart."], ["They [[derive:derive]] pleasure from small tasks that [[stem:stem]] from love for living things.", "An old photo showed an [[ancestor:ancestor]] of the gibbon with its happy [[descendant:descendant]] beside it.", "The mother nursed her tiny [[offspring:offspring]] while a separate [[subgroup:subgroup]] played in the grass.", "Volunteers [[feed:fed]] the young birds and learned how experts [[breed:breed]] rare ducks safely.", "They never [[interbreed:interbreed]] close families and never [[hybridise:hybridise]] free ducks with farm ones.", "Rabbits could [[proliferate:proliferate]] fast, so vets check health to avoid painful [[sterility:sterility]] issues."], ["Spring [[courtship:courtship]] songs filled the air before tiny chicks began to [[hatch:hatch]] in boxes.", "A quiet duck began to [[brood:brood]] softly while trout started to [[spawn:spawn]] in the pool.", "A young bird looked almost [[mature:mature]] but still had a sharp little [[claw:claw]] cut.", "Leo cleaned a soft [[paw:paw]] with warm water and gently fixed a cracked [[beak:beak]] cover.", "They checked a torn [[fin:fin]] on a trout and a weak little [[wing:wing]] on a duck.", "A loose grey [[plume:plume]] fell softly, and Leo saved each tiny brown [[feather:feather]] for study."], ["A piglet raised its stiff [[bristle:bristle]] hairs, then slept in a snug warm [[curl:curl]].", "They counted each buzzing [[insect:insect]] near the flowers and moved a pink [[worm:worm]] off the path.", "They removed a destructive garden [[pest:pest]] by hand and washed off a tiny leaf [[parasite:parasite]] too.", "A small striped [[spider:spider]] hung in the corner while a loud green [[cricket:crickets]] sang outdoors.", "They helped an old tired [[seal:seal]] rest and lifted a heavy sleepy [[tortoise:tortoises]] into shade.", "A baby sea [[turtle:turtle]] swam in circles while a distant huge [[whale:whales]] sang low songs."], ["A jumping [[kangaroo:kangaroo]] ate fresh leaves while traders once stole white [[ivory:ivory]] for money.", "They polished a curved antelope [[horn:horn]] model and heard a far lonely [[wolf:wolves]] howl at night.", "A Komodo [[dragon:dragon]] slept behind glass while a quick red [[fox:foxes]] sniffed the morning air.", "Leo broke a square food [[cube:cubes]] into bits and gave one to a parched spotted [[calf:calf]].", "A wet newborn [[pup:pup]] shivered in towels while a soft white [[lamb:lamb]] drank warm milk.", "The quiet milk [[cattle:cattle]] stood in line while a strong brown [[ox:oxen]] pulled a dray."], ["A loud angry [[bull:bull]] stamped its feet while a calm grey [[buffalo:buffalo]] chewed long grass.", "Leo brushed a tall brown [[horse:horse]] gently and waved at a striped calm [[zebra:zebra]] nearby.", "A kind grey [[donkey:donkey]] carried light bags while Leo cleaned a worn skin [[saddle:saddle]] nearby.", "A fast grey [[falcon:falcon]] circled high above while a sharp eyed [[hawk:hawk]] waited in a tree.", "A stately bald [[eagle:eagle]] sat very still while a sleepy brown [[owl:owl]] blinked in the dark.", "A tiny hungry [[sparrow:sparrow]] pecked at seeds while a grey mild [[pigeon:pigeon]] drank clean water."], ["A black noisy [[crow:crow]] hopped near the railing while a white calm [[swan:swan]] floated on water.", "A white farm [[goose:goose]] honked for feed while a red stately [[cock:cock]] strutted in the yard.", "A tiny brown [[mouse:mouse]] hid under straw while a quick grey [[rat:rats]] ran behind the door.", "A red quick [[squirrel:squirrel]] climbed the oak while a shy brown [[hare:hare]] sat in clover.", "A green little [[frog:frog]] jumped near the gutter, showing calm watchful [[behaviour:behaviour]] each hour.", "Leo learned that a deep [[bite:bites]] could ache and a bee [[sting:sting]] could puff fast."], ["Dogs gave a short warning [[bark:bark]] at first, then a lion gave a low sleepy [[roar:roar]].", "Leo did not [[rub:rub]] his eyes in dust and did not [[creep:creep]] close to the fences.", "The children learned to [[crawl:crawl]] low under ropes and respect each natural [[habitat:habitats]] around them.", "They cleaned a small empty [[nest:nest]] in the bush and watched a humming wooden [[hive:hive]] from afar.", "Leo looked through a tiny glass [[cell:cells]] dish and scrubbed a rusty empty [[cage:cage]] door.", "They swept a warm dry [[stable:stable]] floor and stacked fresh hay in the red [[barn:barn]] loft."], ["They trimmed a low green [[hedge:hedge]] by the path and painted a white wooden [[barrier:barrier]] gate.", "A vet explained basic bird [[anatomy:anatomy]] charts and warned about a past poultry [[epidemic:epidemic]] year.", "They learned how one tiny [[gene:gene]] change could carry a weak hidden [[germ:germ]] inside bodies.", "The lab found harmless mouth [[bacteria:bacteria]] in samples and no dangerous winter [[virus:virus]] at all.", "Each invisible [[microbe:microbe]] was logged, and slow winter [[metabolism:metabolism]] kept many snakes still.", "They added high [[protein:protein]] beans to meals and extra orange [[vitamin:vitamin]] drops for parrots."], ["Sick glands may [[secrete:secrete]] thick fluid, while healthy kidneys [[excrete:excrete]] waste each day.", "A hungry chick will quickly [[devour:devour]] its meal, guided by sharp night [[instinct:instinct]].", "Leo made an [[intuitive:intuitive]] guess about thirst and sensed the true healing [[potential:potential]] of rest.", "The team praised his growing [[intelligence:intelligence]] and built a strong [[functional:functional]] perch from logs.", "Nurses stayed [[sensitive:sensitive]] to soft sounds and kept handling calm and [[flexible:flexible]] for shy birds.", "Bats use soft [[acoustic:acoustic]] echoes to move, while ducks need sharp [[optical:optical]] focus at dusk."], ["Many bats are busy and [[nocturnal:nocturnal]] at night, while toads stay sleepy and [[dormant:dormant]] by day.", "Winter [[hibernation:hibernation]] ends slowly, so helpers [[track:track]] weight charts with great care.", "They found no sickness [[trace:trace]] in water and took an [[alternate:alternate]] path back to base.", "A weak rabbit becomes easy [[prey:prey]] when a silent hungry [[predator:predators]] waits near.", "No small animal became a helpless [[victim:victim]] here, and no lonely [[captive:captives]] stayed sad long.", "Staff stayed calm and [[defensive:defensive]] around fences, and each newcomer must [[undergo:undergo]] safety induction."], ["Old wounds may still [[suffer:suffer]] in cold rain, so the frail elderly birds feel [[vulnerable:vulnerable]] today.", "They grow beans for daily [[subsistence:subsistence]] and never try to [[exterminate:exterminate]] local snakes at all.", "Leo learned to [[tame:tame]] fright with patience while the kind chief [[keeper:keeper]] praised his work.", "At sunset a [[gentle:gentle]] old [[shepherd:shepherd]] visited with his dog and thanked every tired helper warmly."]], "sentZh": [["林老师说，大气是薄薄的覆盖层，裹住供我们呼吸的氧气。", "她转动地球仪，展示覆盖地球大部分的水圈。", "海洋陆地下是多岩的岩石圈，正漂在炽热的地幔上缓缓移动。", "她举起一枚生锈的大铁钉说，铁钉遇湿气会形成氧化物——腐蚀。", "植物吸收二氧化碳，在温暖的学校温室里长得高高。"], ["她补充，水本身由氢和氧结合而成。", "利奥在旧墙图上找到了学校的经度和纬度。", "日落时他们站在高海拔的宿营地，看太阳落到地平线以下。", "去年地震给河畔小镇带来灾难和毁灭性伤害。", "受损的墙至今提醒着人们那场可怕的大灾祸。"], ["利奥只在石阶上掉过指南针，出过一次小意外。", "攀爬松动的峭壁会危及生命，也会危及整次出游。", "一场被厄尔尼诺加重的破坏性风暴刮倒了山间小路两旁的树。", "林老师说雨后彩虹是美丽而纯净的现象。", "小波捡起一颗发亮的鹅卵石，用红色小磁铁试了试。"], ["矿工曾在这里深挖富含矿物的矿石。", "老桥用白色大理石砌成，墩子立在坚硬的灰色花岗岩上。", "小波发现一块透明石英，在手电下闪闪发光。", "一阵阵风卷走他的帽子，随后柔和的微风让疲惫的小队凉快下来。", "林老师提醒，夏季季风会淹没低处的道路。"], ["天黑后强劲的大风摇晃帐篷，像一场小飓风。", "他们早就演练过龙卷风和沿海台风的躲避动作。", "镇子上方的老火山可能毫无预兆地喷发。", "小梅研究炽热的岩浆，写下关于热量流动的热力学报告。", "小队把帐篷迁到开阔地，轮流值夜。"], ["城里浓厚的烟雾和旧卡车的黑烟笼罩街道。", "清晨薄雾柔化了海湾，早班车才出发。", "地震警笛响起后，大家怕海啸，赶紧往高处跑。", "后来农民讲起漫长干旱干裂了田地。", "秋雨又引发洪水，棕色急流冲过木板桥下。"], ["次年四月他们翻越陡坡，雪崩随时可能横扫多岩地形。", "利奥速写寂静的白色大地景观，在大陆北缘延展。", "小梅探黑暗洞穴，利奥测量缓缓融化的冰川。", "没人高声说话，全队排成一列小心前行。", "他们早早扎营，围着小篝火烤干袜子。"], ["走下冰原，他们蹚过温暖沼泽，来到绿色河口三角洲。", "奶牛在宽广平原吃草，绵羊在风大的高原上吃草。", "疲惫的旅人在宁静隐蔽绿洲歇脚，有棕榈和凉水。", "林老师指着赤道讲，它把地球分成南北两个半球。", "白熊在冰冻的北极冰面上游荡。", "寒冷的南极在更远的南方。", "他们梦想有天到达北极点。"], ["一只饥饿的极地巨兽在附近徘徊，向导讲解倾斜的地轴。", "单薄的春季空气开始恶化，寒风会加重他们的冻伤。", "旧帐篷在严寒中退化很快，小队给帐篷加上厚暖内衬升级。", "海风日夜侵蚀着悬崖。", "受够冰雪的大家梦想穿过温暖的地中海回家。"], ["他们横渡波涛汹涌的灰色大西洋，奇怪的海鸟跟着船飞。", "浓雾中船长信赖卫星导航，直到驶入平静宽阔的海湾躲避。", "他们登上安静的金色海滩补充淡水。", "接着沿多岩海岸慢走，捡干浮木。", "夜里在繁星下的金色湖岸平静露营。", "他们早早收拾行装，在涨潮淹没脚印前离开。"], ["他们跃过狭长小溪，沿蜿蜒溪流穿越高松林。", "水清且浅，但向导警告别对安全做肤浅判断。", "他们在步道尽头租下一间干燥小公寓。", "石地板在疲惫光脚下意外地平滑。", "外墙依旧粗糙，覆满深色苔藓。", "屋后一条干燥沙土路爬向远山。"], ["破晓时他们沿坚硬石径出发，走向高耸的垂直峭壁。", "他们沿两道平行山脊之间，慢慢爬上陡峭山坡。", "近顶处走过深沟上的狭窄木桥。", "在那里遇到从遥远大洋洲来的快乐徒步者。", "相约以后一起去多风的南部半岛。", "下山前再查一次多变的天气。"], ["下山的路把他们直接带到一间小木棚。", "小站里他们在意外温和的午后学基础气象学。", "旧电暖气让房间暖和，吃着适量的晚餐。", "人人穿厚保暖外套抵御夜寒。", "把这里的冷和远方热带的湿热比较。", "一位研究员曾在寸草不生的干旱沙漠工作过。", "屋外小雨过后，傍晚土壤依然松软潮湿。"], ["深夜外衣被雨打得依然寒冷潮湿。", "湿衣服围着暖气烘烤，小房间变得闷热潮湿。", "清晨望见白色多雪山峰在苍白阳光下发光。", "薄霜盖住窗户和冻硬的靴子。", "突然大冰雹猛击屋顶，惊醒全站。", "中午落冰在微弱阳光下开始融化。"], ["在遥远的北方，另一个传说正在寒冷中展开。", "傍晚寒意又把他们逼回屋里，水洼还没结冰。", "老拉尔斯在结冰的北码头迎着严寒的风。", "冰水打湿手套，双手开始颤抖。", "厚抓绒大衣也挡不住全身发抖。", "他系牢小船，快步走向温暖的港灯。", "远处雷声滚过厚重的乌云。"], ["突然明亮闪电撕裂小船上方的天空。", "狂暴海浪把船抛向港墙。", "拉最后一根绳时倾盆大雨把他浇透。", "后来得知那晚降雨量破了村纪录。", "回家后他在墙上挂历上用红笔圈下这个日子。"], ["清晨米娜先往茶里撒糖，冲个澡再去攀登。", "户外已有二十五摄氏度，高温让积雪变软。", "收音机天气预报说雪峰附近会有凉风。", "中午她站在高处小路上，笑自己太心急。", "在那里她帮朋友把小探测器安装在巨石上。", "傍晚一起注视远方发光的峰峦。"], ["小肯熟悉附近每条山脉，带客人走狭窄山脊。", "他们下草坡，走进绵羊点点的宁静绿山谷。", "孩子们在阳光山坡上疾跑，肯正俯瞰整个村子。", "祖母挂起东方风格挂毯，说守土是不可推卸的任务。", "安娜研究湿地里不可逆的伤害，很不规律地取水样。", "这里倒废料极不合适，去年四月她在旧导管旁发现异常水藻。"], ["缓缓的河带着厚厚沉积物，松软淤泥在根系间沉下。", "暴雨后河岸松软泥泞，她把湿黏土捏成小示范砖。", "破晓，小萨姆擦净挡风玻璃尘土，开始乡村送货之行。", "首站安静农场，次站是等包裹孩子的绿荫郊区。", "接着是镇外尘土飞扬的工厂区。", "午饭后继续开往孤寂道路尽头的偏远棚屋。"], ["两座仓库紧邻老车站，但无密封箱他拒运有毒货。", "玛雅查河流污染，发现锈导管漏出一种油性污染物。", "废料可能污染水井，周末全班参加地质远足。", "沿松林边缘草地取样，玛雅把搪瓷盘掉在石头上。", "洪水把尖锐碎片冲上小路，旧桥墙裂缝在变长。", "她拍下照片，当天发给县政厅。"], ["利奥拍下宁静湖面壮丽的日出。", "后来参观古代国王建的宏伟宫殿。", "向导讲有趣传说时，辽阔峡谷壮丽无比。", "接着一阵大风把寂静荒野上空从蓝吹成黑。", "拂晓穿过多刺灌木丛生的炎热干旱沙漠。", "看到倒下的树，他发誓再不为利毁林。"], ["我们村曾在颗粒无收的广袤荒原边挣扎。", "后来在河岸发现深厚肥沃的土。", "每年春天播种金色大麦前都细心施肥。", "高大的太阳能板如今驱动水泵提河水。", "夜里爷爷借淡淡月光盘算收割。", "清晨早起，看金色日出漫过大麦田。"], ["劳作后聚在一起欣赏宁静日落。", "去年秋天还一起看了奇怪的日偏食。", "黄昏全村走在回家路上，天空像柔和的天堂。", "有人低语山谷恰似一座绿色乐园。", "缕缕洁白水汽从温暖汤锅升起。", "正午暑热让浅水洼在烈日下迅速蒸发。"], ["炎热午后凉风开心地穿巷循环。", "去年夏天一场因水的小争吵差点酿成严重争斗。", "幸好古老石头水库存够大家的水。", "次日清晨孩子们结伴徒步去远处轰鸣的瀑布。", "围着广场阳光下的古老石喷泉欢笑。", "清晨新鲜露珠还盖着路边草皮。"], ["爷爷亲切地给每个疲惫干渴的孩子倒热茶。", "雨水将缓缓经窄渠排入低田。", "旧粮仓旁松动水龙头整夜滴水不停。", "无预警的话，洪水轻易淹没低洼道路。", "突然强劲山风把树叶吹过院子。", "小陶爬陡峭石阶开始大口喘气。"], ["清凉泉水突然从苔石裂缝涌出。", "进入高大古松的幽静茂密森林。", "正午阳光的灼热程度很快迫人休息。", "老师带队集中徒步认识本土植物。", "害羞的小鹿突然从浓绿灌木后出现。", "孩子们看到阳光掠过清溪的一道亮光。"], ["枯叶轻轻顺流漂向平静宽阔的大河。", "爷爷说今年森林状况大有好转。", "但水形势仍让家家担忧。", "他告诉孩子们，爱大自然就是守护每个生灵。", "大家更爱清澈天然湖，不爱瓷砖池。", "新广场用人造花节约宝贵的水。"], ["那里的帐篷多用耐磨合成布，大雨不怕。", "王叔每周五仍给旧吉普车买昂贵的汽油。", "烧脏气体让空气满是呛烟。", "他盼便宜清洁汽油早日替代。", "但专家说本地石油储量撑不了太久。", "于是村民集会投票：先护林、先节水。"], ["利奥邀请米娅和萨姆到小游廊上，聊聊星系和广阔的宇宙。", "他说宇宙在这里感觉很近，星际故事总让夏夜令人兴奋。", "星星慢慢出来之前，他们把地面地图和星空图并排摆好。", "利奥喜欢天文学的真实知识，米娅则笑话网上模糊的占星帖子。", "萨姆戴着硬纸宇航员帽，指向东方一颗明亮的彗星。", "爷爷昨天寄来一小块陨石和一张环形坑的照片。"], ["他们擦掉旧壁架上的灰尘，发现了烧硬纸条留下的灰烬。", "打扫时，一大块彩绘木头从他们的航天器模型上掉了下来。", "他们修好玩具飞船，并在舱门旁系了一个小探测器。", "利奥在尾部加了一个新舱，用空气演示简单的推进原理。", "萨姆轻按气球，演示气压和基本的翱翔动力学。", "气球快速运动，空气大声地从红色小排气口冲出。"], ["明亮的尾迹在渐暗的蓝天上画出一道柔和的弧线。", "他们的游廊探索就像一次前往遥远寒冷世界的真正探险。", "他们表演大胆的飞掠，假装扶栏就是天文台的穹顶。", "透过小望远镜，月亮成了大家眼中银色的奇观。", "利奥描出月亮的轨道，指给他们看暗淡的黄道线在哪里。", "他用学生尺比较了镜面的直径和半径。"], ["清晨到来，他们测试盆土的物质，学习它的基本构成。", "店里的混合土有一种奇怪的化合物，里面还埋着玩具化石。", "米娅取了一小份土样，仔细给最好的叶子标本贴上标签。", "每粒微粒都存着水，每个分子都帮助嫩芽生长。", "利奥说，在咸水混合液里，每个原子都会交换离子。", "萨姆读到，叶子里一个电子的位移就是微小的量子跃迁。"], ["他们缓缓倒入清澈的液体，看流质在托盘里散开。", "干燥的固体基质没有妥善照料和温暖就合成不了养分。", "他们记录每朵云的形状，正午还查看了光的光谱。", "利奥量好每个箱子的尺寸，把浇水频率记在卡片上。", "一根弯铁丝充当他们的风信号，像细天线一样抖动。", "他们修好灯的电路，看折射把烧杯里的线条弯曲。"], ["他们挡住强烈的紫外线，完全避开旧的放射性仪表。", "两个花盆有明显的记号，每张标签上都有一道可辨认的细纹。", "一只看不见的蜗牛让两个空罐子滑稽地相撞。", "他们把软南瓜挪开，扔掉每一块破损的碎片。", "没有灾难性的暴风雨，昨天正午只有压倒性的酷热。", "米娅短暂地绝望了一下，随即拼命采取措施给托盘降温。"], ["学会光合作用如何喂养绿苗后，一切不再让人绝望。", "夜里叶子呼吸，用新鲜空气换走微量的二氧化物。", "新的植被爬满栏杆，椅子旁还有一株小香草。", "一株安静的多年生植物熬过冬天，点燃了他们对植物学书的热爱。", "他们的游廊生态长成有蜜蜂蚯蚓的小生态系统。", "他们选了环保花盆，一起读简单的园艺指南。"], ["每个小生物都遵循遗传学规律，长成不同的颜色和大小。", "今年春天，一次奇怪的突变让花瓣斑点有了可喜的变化。", "他们喜欢不断增加的多样性，小心地在近缘品种间尝试杂交。", "好植物繁殖快，又慢慢进化以适应游廊的空气。", "春天温度起伏，他们就回收旧箱子作遮蔽物。", "他们培养耐心的习惯，每隔一个周末就播种新的一畦。"], ["最后他们一起收获，只采摘厨师需要的量。", "每箱产量都不错，他们还在一角饲养蚯蚓。", "这里没有可耕地，他们就用叉子翻耕大盆。", "利奥拿小铲，萨姆稳稳地拉着轻耙。", "他们把洗好的盆整齐摞好，天天翻动肥沃的堆肥堆。", "米娅把枝条扎成整齐的一捆，再包一束新鲜的送邻居。"], ["最美的剪枝插满蓝花瓶，柔柔地接着晨光。", "短日照青菜和耐阴蕨共享阴凉的北角。", "他们刷掉一处真菌斑，擦去盘子边的灰霉。", "黄花粉落在桌上，新豆子正在苔藓里发芽。", "每粒留下的种子似乎在三个温暖的春晨后抽芽。", "每个紧实的蓓蕾到周五都可能开成粉色的花。"], ["每朵新花都为他们的夜谈添一缕甜香。", "芳香的小叶在温暖的玻璃墙边慢慢成熟。", "他们在热风吹蔫花瓣前摘下每颗红果。", "落下的碎屑很快分解，不然湿茎就会在角落腐烂。", "他们清理缓慢腐朽的东西，把不新鲜的碎屑递给小鸟。", "他们的展示架模仿潮湿的雨林角落，像个小丛林展区。"], ["茶园和风中大麦田的照片打动了他们。", "旧木箱和一张小炭笔涂鸦点亮他们的工作墙。", "一张林业海报展示如何安全修剪拥挤的枝条。", "他们画了粗树干和一根粗壮的大枝，给爬树的猫玩。", "浅浅的根团在薄干草盖下直到天亮。", "他们在嫩苗周围铺干稻草，把一株高芦苇绑直。"], ["利奥趁早拔掉每根尖刺茎和蔓延的杂草。", "新鲜的草屑勾起去年六月宽阔草甸散步的回忆。", "他们修剪小草坪的边缘，旁边是一株年轻的橄榄苗。", "一株盆景松静静立在蜿蜒的藤架旁。", "一张紫罗兰色标签按日期标出荷兰郁金香那一畦。", "压碎的薄荷清香扑鼻，珊瑚礁书摊开在一旁。"], ["绿藻包住烧杯，忙碌的酶在里面分解废物。", "温暖充当催化剂，帮嫩芽松开紧裹的外衣。", "他们记录户外的机车排放，让宽叶吸收湿气。", "空气流通很重要，每盆绝不能超过两株苗。", "每种养分缓慢吸收，嫩茎就长得稳。", "干净的周围环境每周都支撑着土壤下的天然防御机制。"], ["新遮阳网抵消强光，正午保护着幼小的苗。", "他们把落花瓣存起来做手工，一起学习保护环境的规则。", "他们学习救援队如何拦住丛林大火、扑灭零星火星。", "他们讨厌会毁掉河边鸟巢的乱扔垃圾的破坏。", "如果工人拆掉旧侧墙，弱苗很快就会死掉。", "他们从不违反公园规定，也不用化学品伤害共享菜地。"], ["他们读蜜蜂灭绝的故事，仔细画下每次到访的规律。", "每个小成果都算数，善意的行为会带来真正的影响。", "他们的墙表把季节性任务和一小块试验角排在一起。", "温暖的春天给他们有利的光，度过漫长而多产的午后。", "简单的轮值表很有效，让每天浇水都很高效。", "他们感到相当自豪，虽然小菜地还不算大。"], ["夜空带来巨大的宁静，小镇上空星星达到最多。", "噪音最小、黑暗正好，利奥结束了快乐的夜晚。"], ["周六早晨里奥在大门口加入一位和善的动物学家和一位友好的生态学家。", "一位开朗的植物学家给他们看了一只睡在暖草里的柔软哺乳动物宝宝。", "他们看一只爱玩的灵长类荡秋千并学习每只强壮的脊椎动物的照护。", "接着他们清洗行动缓慢的爬行动物饲养箱和旁边小绿两栖动物水池。", "里奥学到食肉动物和食草动物需要的食物很不一样。", "救助站的每个小生物都值得安静照护和每天新鲜的野生生物支持。"], ["他们用图片记录当地动物群并记下湖边高大的植物群。", "每个获救物种都被登记一只快乐的鸭群从头顶飞过。", "里奥望见平静的鹿群喝水一只忙碌的蜜蜂群经过。", "一群吵闹的参观者到了午饭后更大的周末人群又来了。", "一只疲惫的大兽安静休息连一只粗鲁的猛犬今天也很安静。", "这里不允许残酷的手因为善良必须源自每颗年轻的心。"], ["他们从源于热爱生命的小任务中获得愉悦。", "老照片里长臂猿的祖先和它快乐的后代站在一起。", "妈妈照顾小小的后代另一个小群在草地上玩。", "志愿者给幼鸟喂食并学习专家如何安全繁殖稀有鸭子。", "他们从不让近亲异种交配也从不让散养鸭和农场鸭杂交。", "兔子可能会快速繁殖所以兽医检查健康避免痛苦的不育问题。"], ["求偶的歌声充满春天小鸡开始在箱子里孵出。", "一只安静的鸭子开始静卧，鳟鱼开始在水池产卵。", "一只幼鸟快成熟了但小利爪还有伤口。", "里奥用温水清洗柔软的爪子并固定开裂的鸟喙护罩。", "他们检查鳟鱼身上撕裂的鳍和鸭子身上无力的小翅膀。", "一根松软的灰色羽轴落下里奥收好每根棕色小羽毛做研究。"], ["小猪竖起硬刚毛然后蜷成暖暖一团睡觉。", "他们数花边的嗡嗡昆虫并把粉色蠕虫移到路边。", "他们用手捉走毁坏性的园林害虫并洗掉小叶上的寄生虫。", "角落里小条纹蜘蛛垂着，户外绿色大蟋蟀在叫。", "他们扶疲惫的老海豹休息把沉重的瞌睡陆龟抬到阴凉处。", "海龟宝宝绕圈游泳远处巨大的鲸低声歌唱。"], ["跳跃的袋鼠吃鲜叶而商人曾为钱偷白色象牙。", "他们擦拭弯曲的羚羊角模型听到远处孤独的狼群夜里嚎叫。", "科莫多龙在玻璃后睡觉红色敏捷的狐狸嗅着晨空。", "里奥把方形食物块掰碎分给干渴的斑点牛犊。", "湿漉漉的新生幼犬在毛巾里发抖柔软的小白羊羔喝温奶。", "安静的奶牛排队站立强壮的棕色公牛拉着板车。"], ["大声愤怒的公牛跺脚平静的灰水牛嚼长草。", "里奥轻刷高大棕马并向附近条纹温顺斑马挥手。", "和善的灰驴驮着轻包里奥在旁边擦旧皮马鞍。", "灰色敏捷的隼在高空盘旋目光锐利的鹰在树上等待。", "威严的白头鹰安静坐着瞌睡的棕色猫头鹰在黑暗中眨眼。", "饥饿的小麻雀啄种子灰色温顺的鸽子喝清水。"], ["黑色吵闹的乌鸦在扶栏边跳白色安静的天鹅浮在水面。", "白色农场鹅为饲料叫红色威严的公鸡在院里走。", "棕色小老鼠藏在草下灰色敏捷的老鼠跑到门后。", "红色敏捷的松鼠爬橡树害羞的棕色野兔坐在三叶草里。", "绿色小青蛙跳到排水沟边每小时都表现平静警觉的行为。", "里奥学到深咬会痛蜜蜂蜇会快速肿起。"], ["狗先发出短促警告吠叫接着狮子发出低沉困倦的吼叫。", "里奥不在灰尘里揉眼睛也不靠近围栏潜行。", "孩子们学会低姿爬过绳索并尊重周围每个自然栖息地。", "他们清理灌木里空小巢并远远看嗡嗡的木蜂箱。", "里奥透过小玻璃细胞培养皿看并擦生锈的空笼门。", "他们打扫温暖干燥的马厩地板并在红色谷仓阁楼堆干草。"], ["他们修剪路边低绿树篱并粉刷白色木栅栏门。", "兽医讲解基础鸟类解剖图并提醒过去家禽流行病那一年。", "他们学到一个微小基因变化会在体内携带弱小隐藏病菌。", "实验室发现样本里有无害口腔细菌冬天没有危险病毒。", "每个看不见的微生物都被记录缓慢的冬天代谢让很多蛇安静。", "他们在餐里加高蛋白豆子并给鹦鹉加橙色维生素滴剂。"], ["病腺体会分泌浓液健康肾脏每天排泄废物。", "饥饿的雏鸟会凭敏锐的夜晚本能快速吞食食物。", "里奥凭直觉猜到口渴并感受到休息真正的治愈潜力。", "团队夸他智力增长并用圆木搭了结实实用的栖木。", "护士对轻声保持敏感对胆小鸟儿保持平静灵活的接触。", "蝙蝠用柔和声学回声移动鸭子黄昏需要敏锐视觉聚焦。"], ["许多蝙蝠夜里忙碌夜行蟾蜍白天瞌睡休眠。", "冬天蛰伏慢慢结束帮工细心追踪体重表。", "他们在水里没发现疾病痕迹走备用小路回基地。", "弱兔在安静饥饿捕食者等待时会变成容易捕捉的猎物。", "这里没有小动物成为无助受害者也没有孤独圈养动物久难过。", "员工在围栏边保持警戒平静每个新人必须接受安全入门培训。"], ["旧伤在冷雨里还会作痛虚弱老鸟今天觉得脆弱。", "他们种豆子维持每天生计从不灭杀当地蛇。", "里奥学会耐心驯服惊恐和善的首席饲养员夸他做得好。", "日落时温和的老牧羊人带狗来看望感谢每位疲惫帮工。"]], "paraZh": ["林老师用鸡蛋讲地球圈层：大气、水圈、岩石圈与地幔。", "查经纬、看日落，回忆地震大灾，立下安全规矩。", "厄尔尼诺与受伤森林、温室、彩虹，小波捡石测磁。", "采石场识矿石，阵风微风过后，季风将至。", "风暴火山轮番预警，小梅记下岩浆热数据。", "烟雾城镇、海啸警报、干旱洪水，小队装上地震仪。", "翻雪山、穿地形，进山洞测冰川。", "下到沼泽三角洲，再从平原高原一路想到南北极。", "极地熊与倾斜地轴，天气恶化，升级帐篷。", "横渡大西洋进海湾，金滩海岸露营，趁涨潮前撤离。", "沿溪流进山谷，浅水处不受表象迷惑，石屋落脚。", "日出登峭壁，过窄桥遇大洋洲旅人，相约半岛再看天气。", "气象站温和午后，暖气配适量晚餐，谈热带与干旱。", "午夜潮湿，清晨雪霜，冰雹转融化。", "傍晚寒夜，码头严寒渔夫颤抖，雷声滚来。", "雷电风暴夜暴雨破纪录，红圈记日子。", "米娜清晨备登山，高温、预报指引登顶。", "肯带客走山脊进山谷；湿地取样识污染。", "沉积淤泥制砖；送货路线一路向远。", "仓库拒运有毒品；小玛雅查河污，桥缝拍照上报。", "峡谷日出宫殿传说，荒野沙漠立誓护林。", "荒原边发现肥沃河岸，施肥装太阳能，看日出。", "赏日落观日食，黄昏天堂山谷，水汽蒸发。", "争水水库平息；瀑布喷泉露珠，李爷爷倒茶。", "倒茶排水滴水防洪，登山喘气。", "泉涌密林休整，集训遇鹿见溪光。", "落叶漂流，森林好转水仍忧，用新人造物。", "拖拉机油烟盼替代，石油难久恃，投票护林节水。", "三个社团伙伴夜晚聚在阳台，从星系聊到陨石，开启观星之夜。", "他们擦拭修补飞船模型，用气球演示飞行原理。", "他们用望远镜赏月观星，辨认轨道并记录尺寸。", "清晨他们化身小科学家，研究盆土、取样观察微粒。", "他们摆弄水灯铁丝，观察流动、光影与信号。", "小意外不断：蜗牛相撞、南瓜挪位、酷热来袭，他们冷静应对。", "他们学到光合作用，阳台变成生机勃勃的小生态。", "他们观察遗传变异，坚持播种培育新苗。", "他们一起收获、分工劳作，把成果分享给邻居。", "花草发芽 "他正确加出每个小数，和室友核对了最终总数。", "两个学习小组将合并，一起解开一道难的长数字方程。"], ["林和梅期末周日程相同，尽管有微小变化。", "数学老师教他们减去旧分，在十二月前加倍努力。", "他们用严格的日限额存下剩余午餐钱。", "深夜宿舍里只有风这个变量让人觉得奇怪。", "面对多个硬截止日期，咖啡销量似乎翻了两番。", "深夜山姆在白板上画了大致清晰的学习图表。"], ["他在关键日期旁填了一个大矩阵和红色矩形。", "安娜加了一个蓝色小三角和黑色粗对角线取乐。", "他们玩了一轮快游戏，在每个完成任务上贴幸运圆点。", "下课后梅买了软泡沫球和冰蛋筒。", "夜雨轻敲明亮窗户，水壶低鸣。", "直到分数变成冰冷小数，没人知道疲惫的程度。"], ["大比例新生担心物理挂科率太高。", "林用很少的玩笑解释了简单的学习配比。", "山姆在小台秤上称希望，放上一盎司甜茶。", "图书馆空气闷热稠密，如同九十华氏度。", "水银灯光微弱，需要换上强劲新电池。", "松动的旧伏特插座似乎向冷书桌辐射热量。"], ["新台灯发出柔白光，透过干净透明灯罩。", "疲惫声音在空旷大厅回荡，清新夜臭氧飘入。", "睡眠如沉重引力拉扯，但友情减少了心理摩擦。", "他们古怪的社团团长从不挤占任何人的座位。", "热汤助压力慢慢融化，长久忧虑悄悄溶解。", "旧车会在户外生锈，而新想法在年轻头脑发酵。"], ["山姆把黑咖啡稀释，免得晨间酸味惊醒自己。", "地下室空气刺鼻，旧收音机只有静电噪音。", "冷桌看似惰性，却自带宁静宜学习。", "梅把整洁公式和每个小部件抄到亮卡上。", "他们帮安娜编写短口号，把玩笑和暖心鼓励混合。", "轻笑声飘过狭长走廊，灯光温暖稳定。"], ["林更信基础学习理论，而非深夜经验性紧张小贴士。", "山姆想要实用的睡眠计划，不要严苛教条。", "良好的自律和清晰墙上时间表让夜晚稳定。", "忙碌秋季课程以一场校园生活晚间研讨会收尾。", "热闹在线论坛分享了春季社团新教学大纲。", "新生复习了基础数学技能和极简单词表。"], ["深谈带来深刻慰藉，迎接最终必修数学复习。", "一门基础编程先修课开放，没有严苛选拔限制。", "梅选了有趣音乐选修课，平衡沉重书面作业。", "他们熬夜修改笔记，向学长请教清晰指导。", "林学会快速略读长页，再仔细审查关键例题。", "安娜帮他们背诵新词，山姆试着口述短句。"], ["大考前他们在宿舍共做一次平静练习测试。", "经过长组展示练习，早间小测变得轻松。", "老师警告绝不抄袭，坚持打印诚实原创作业。", "学长展示了短论文和规范范文作指引。", "没人写长博士论文，但都认真改好每章标题。", "从一开始梅就快速抓住每课大意。"], ["每人分享诚实观点，并介绍一种有用方法。", "他们留了一本有用参考书，学会正确引用来源。", "好问题能引出新想法和墙上完美引言。", "山姆学会抽取关键句，每天写简短清晰摘要。", "梅写了晨间简要总结，但不轻易假设轻松获胜。", "雪开始静静落在午夜寂静屋顶上。"], ["老师绝不预设作弊，也不会空猜惨败未经核实。", "林和朋友提出大胆新假设，立下安静简单的公设。", "新生爱猜测分数，却无人能真正预测结果。", "敏锐眼睛能感知细微变化，早早察觉压力上升。", "安娜能辨别疲惫微笑，并清醒意识时间流逝。", "学长认为深夜努力有用，视稳定睡眠同等重要。"], ["短纸条常暗示隐忧，需要冷静深思熟虑的夜谈。", "林代表宿舍队，坚持公平冷静投票。", "虽累他们选择坚持，直到完全理解每条规则。", "导师助他们快速诊断弱点，推断更好学径。", "山姆能从提示推断答案，每晚用有趣的食物类比。", "春风携花香穿过敞开庭院门。"], ["他们注意到计划间鲜明对比，但暖友情重叠互助。", "疲惫朋友轻声分歧时，未出现激烈矛盾。", "学习习惯或有差异，多元声音让团队更强。", "梅爱每个微妙声音细节和温和归纳推理游戏。", "有一次山姆做题证实了自己稳定进步。", "导师清晰演示步骤，用色彩生动说明想法。"], ["平静自信开始显现，朋友们发誓化解旧恐惧。", "社团做了短趣调查和诚实小研究，主题小吃习惯。", "新成员停步观察学长，礼貌询问加入步骤。", "每位访客留下一条简短询问，认真填好长问卷。", "他们一起盼望完成公平目标，取得稳定期末成绩。", "长队排成整齐队列，负责人和气地批准每个愿望。"], ["老师给予温暖诚实表扬，学生深深感激善意支持。", "每日诚实反馈让他们不再低估缓慢稳定发展。", "他们学会不高估天赋，珍视温暖社团情谊。", "热闹社团招新会上梅赢得勤奋晚间杂务小奖学金。", "熬过许多不眠协作夜，通过期末像甜蜜共享回报。", "每位新成员交了低额社团费，收到暖心欢迎礼。"], ["周一早上莉莉在大厅里给我们讲文明和复兴。", "她的旧地图展示了史诗故事和远方的新思想。", "我们保持每个传统并微笑着遵守习俗。", "汤姆讲了很久以前的封建制度和奴隶制的折磨。", "老师说每个道德选择都需要清澈的善心。", "一位远方部落的好心人给孩子们分享土著歌曲。"], ["每个居民都热爱小镇，每个本地微笑都温暖。", "奇异的水果蛋糕让长桌边的每个外国人惊讶。", "因为智者人类学家用茶欢迎大家，没人感到陌生。", "她的人道工作让我们的遗产为孩子们安然无恙。", "我们将继承老歌，把每件古董杯放在壁炉架上。", "莉莉热爱考古学，帮我们在山边挖掘泥土。"], ["周二我们看到博物馆大厅和明亮的陶碗。", "老手雕刻石头，帮我们用花装饰罐子。", "我们了解一种宗教，一起参加了安静的晨间仪式。", "好的礼仪让每间神圣的房间为朋友们明亮安静。", "受崇敬的墙和神圣的钟声让我们平静开心。", "好心的教皇和小主教在高门边微笑。"], ["年轻传教士在湖边遇见老牧师。", "我们读了旧圣经，然后一起走到白色教堂。", "高大教堂钟声响起，小合唱团唱起甜美歌曲。", "安静的僧侣给我们看满是树木的古庙院子。", "红宝塔之外，我们听到很久以前大帝国的故事。", "帝国的金光透过墙上每个朝代的故事闪耀。"], ["古老的年表讲了善待孩子的皇帝。", "勇敢的王子在花边对小公主微笑。", "带着威严的老贵族穿着明亮长袍走来。", "好心的领主在朋友们面前感谢勇敢的骑士。", "坚强的守护者分享甜茶和淡淡的思乡之情。", "每个想家的孩子遇见好心名人又笑了。"], ["高地位挡不住温暖轶事逗我们笑。", "意外耽误了出游，但难过的事没破坏这一天。", "小店在这里兴旺，给小镇带来长久繁荣。", "每次挫折教我们以平静勇敢面对逆境。", "她工整的字把每个旧象形字抄在白纸上。", "薄楔子抵住门，孩子们系了红绳结玩。"], ["周三语言屋用有趣的语言学和语义游戏开场。", "我们和安娜学了简单句法和甜美语音。", "汤姆帮我们发准新词，整早保持平稳语调。", "每个屈折变化改变声音，每种方言都温暖新鲜。", "每句轻柔的话语给我们开口说的勇气。", "我们学了口头故事，拍手打着每个音节。"], ["每个小音素对上白板上明亮的元音。", "我们把每个辅音工整写在高字母表边。", "古老表意字微笑着站在我们不断生长的词汇墙边。", "厚词典用简单注解解释每个新习语。", "我们大声读每个短语，细心连接每个从句。", "每个亲切表达用简单明亮的方式显示过去时。"], ["我们加了红色前缀和蓝色后缀造新词。", "每个缩写对上表里亲切的同义词。", "我们在故事里为每个名词找柔和反义词。", "一个单数苹果和两个圆复数梨在桌上。", "每个代词代替名字，每个形容词让它明亮。", "我们把快副词放在长介词边，很用心。"], ["小连词用始终如一的爱连接我们的故事。", "长故事好像复杂，但我们一起整理笔记。", "我们读了一个新版本，再用简单词改述。", "安娜帮我们阐释老故事并微笑着讲述。", "明灯照亮房间，我们一起解读旧卡片。", "她柔和的口才帮我们和朋友交流温暖想法。"], ["周四中午有长讨论和快头脑风暴。", "亲切的评论帮我们不提高声音协商计划。", "没有争执留下，因为清晰媒介传递善意消息。", "周五纸张感到印刷匆忙，年轻记者在旁微笑。", "公正批评家用温暖的话表扬勇敢评论员。", "威严的倡导者在明亮房间感谢清晰播音员。"], ["好心通讯员在大树边遇见机灵信使。", "疲惫编辑帮打字员午饭前赶完页面。", "每张传单和明亮小叶传单飞过房间。", "喧闹宣传退去，朋友们选择发表真实善良故事。", "我们帮忙传播好消息，微笑着预见晴天。", "我们期待愉悦，期待周五相聚的亲切朋友。"], ["我们等候微笑，每个甜蜜消遣填满暖夜。", "歌声款待孩子，忙碌后带来轻柔娱乐。", "故事逗乐朋友，善意闲话远离我们。", "低级谣言打不破我们互助的温暖共识。", "周六带着明亮节日气氛和甜蜜盛宴醒来。", "我们的短节目午饭前需要一次快彩排。"], ["孩子们爱模仿小鸟和亲切老师哈哈笑。", "小马戏开场前我们模拟雨声。", "简单魔术打开了大树边的好笑戏剧。", "响亮的夜音乐会为所有人演奏柔和交响。", "小乐团在白衣新芭蕾舞者边鞠躬。", "温柔歌剧比夜里响亮喜剧笑话更暖心。"], ["柔和悲剧泪干，明亮动画照亮房间。", "短片闪过，长电影逗我们笑。", "没有限制级演出，年轻艺术家让花活起来。", "智者工匠帮平静画家搬明亮画板。", "每个新角色用温暖柔光点亮新场景。", "我们打扫小舞台，在明亮画廊挂画。"], ["每个小展览在简单线条里展现平静愉悦的美。", "我们在湖边帮忙收集贝壳挑选石头。", "孩子们可选做画，再用手机拍花。", "每张微笑肖像挂在明亮鸟画边。", "石头雕塑立着，莉莉开始画云。", "我们看她描绘小鸟，再用简单词描述天空。"], ["老手雕木，孩子们笑着即兴唱歌。", "周日歌曲温柔音乐，拂晓有古典弦乐。", "甜爵士混着湖边响亮摇滚节拍。", "酷嘻哈舞步加入明亮云下柔和流行歌曲。", "温暖歌词飘满空气，小乐队在旁演奏。", "羞涩独唱在日出时盖过甜美旋律。"], ["快节奏配着低沉圆润音调，很愉悦。", "我们哼温暖曲调，慢慢转旧黑唱片。", "黑钢琴立在棕色旧小提琴边。", "深大提琴叹息，长吉他清甜鸣响。", "小口琴正午和金色小号一起歌唱。", "小鼓敲响，银笛在院子上空鸣叫。"], ["我们的友好比赛比盛大锦标赛更亲切。", "每个奥运梦感谢举着亮旗的好心赞助人。", "温柔赞助人用热茶给疲惫运动员加油。", "年轻冠军在院子里向开心观众挥手。", "每个好心志愿者穿干净亮衣很出名。", "知名老师把活力游戏带到洒满阳光的院子。"], ["热烈的欢呼充满宽阔阳光的体育场一整个下午。", "小体育馆早上用绳子和垫子做训练。", "轻锻炼早饭前在柔和室内空气中叫醒我们。", "新鲜户外空气让树边每个可移动孩子开心。", "慢动作让我们在湖边温柔晨瑜伽前平静。", "我们看毯子不蔓延，帮朋友伸展手臂笑。"], ["重劳损退去，快象棋让心平静。", "轻羽毛球比正午长高尔夫散步更轻松。", "长台球杆靠在房间亮足球边。", "快网球飞近拂晓高排球网。", "新曲棍球杆靠在门边白圆球门框边。", "旧木棒和轻球拍放在长椅上。"], ["我们看他轻轻踢，听到木上轻敲。", "他试着翻煎饼，再把碎屑投给小鸟。", "莉莉学轻轻扔，再把花瓣抛向空中。", "孩子们看雪橇滑下，小小滑倒也没有。", "白云好像滑行，孩子们在软垫上翻滚。", "小孩慢慢学滑雪，再跟朋友滑冰。"], ["绿车带来骑行之乐，凉夜去池里跳水。", "叶子好像漂流，孩子们在花边跳起。", "小青蛙高跃，勇敢孩子跳入软泡沫池。", "暖风吹起，小羊在栏边蹦跳。", "软球轻轻弹，正午在条纹帐篷边。", "我们在离周日野餐布不远处搭小营火。"], ["今早友好跑步时没人想猎鸟。", "疲惫跑者跑完长马拉松，慢行人朋友挥手。", "我们保持稳步伐，细心数每小步。", "湖边短途游比孩子们长海轮游更好。", "每次开心旅行都在家以甜蜜假日梦结束。", "我们看朋友上坡远足，午饭前慢跑回来。"], ["我们迈大步伐穿过高树唱低歌。", "我们在洒满阳光的路上不久留不掉队。", "我们帮奶奶爬山，再一起拉篮子。", "壮手臂拖木头，酸痛的后背在炉边弯腰。"]], "paraZh": ["新生带着求学目标入学，结识师友并适应节奏。", "迎新活动有趣，他调整作息并找到动力。", "室友互助，他在学习和运动中进步。", "他融入集体，在活动中建立自信。", "他认真上课，认识了多位老师。", "他备赛演讲，聆听嘉宾分享。", "作为新生，他熟悉校园并完成注册。", "他安顿住宿，开始实验和作业。", "他爱上阅读，坚持记录生活。", "他整理资料，学会查阅检索。", "他规划课程，确定主辅修方向。", "他体验多门学科，度过充实一周。", "他攻克数学，为期末打好基础。", "新生期末周林梅结伴复习定计划。", "山姆画图分工雨夜坚持学习。", "物理焦虑中互助称量希望。", "灯下取暖社团领袖带来安慰。", "咖啡提神抄写公式互相鼓励。", "确立制度迎接忙碌秋课收尾。", "查漏补缺练背诵迎接大考。", "诚信应考抓住每课要点。", "整理引用搭建知识框架。", "大胆假设细心观察保持清醒。", "坚持理解互助解惑迎接春天。", "对比包容中确认进步。", "自信解开心结社团招新忙。", "表彰成长珍惜情谊迎接新员。", "周一博物馆开场讲文明与待客。", "小镇居民热情，匠心守护遗产。", "周二展厅仪式与礼仪之美。", "信仰建筑与古帝国故事。", "帝王将相与乡愁名人。", "市集起伏与文字小游戏。", "周三语言角开场练语音。", "字母词汇与词典短句。", "造词与词性小练习。", "复述讲述与灯下解读。", "周四讨论协商与媒体人物。", "纸页传单与真诚发表。", "周五晚休闲与周六盛宴预告。", "周六午后马戏戏剧音乐会。", "夜晚影像与画室舞台。", "展览收集与画像描绘。", "周日清晨多种歌曲风格。", "湖边乐器合奏。" wn [[loaf:loaf]] at noon.", "Mom baked a round apple [[pie:pie]] and boiled thin long [[pasta:pasta]] for kids."], ["Grandma twirled long [[spaghetti:spaghetti]] strands, chilling sweet milk [[pudding:pudding]] for dessert.", "Mingming crunched a square [[biscuit:biscuit]] and spread red strawberry [[jam:jam]] thickly.", "They churned cold [[ice cream:ice cream]] bowls, adding fragrant pale [[vanilla:vanilla]] drops.", "Mom passed strong yellow [[mustard:mustard]] and a tiny green [[wasabi:wasabi]] dab carefully.", "Uncle Wang crushed black [[pepper:pepper]] corns, slicing pale yellow [[ginger:ginger]] root thinly.", "Mingming minced white [[garlic:garlic]] cloves and long green [[scallion:scallion]] stalks for soup."], ["They sprinkled clear rice [[vinegar:vinegar]] drops, pinching white [[salt:salt]] crystals lightly.", "Grandma loved the mild fruit [[flavour:flavour]], not the sharp [[sour:sour]] taste from unripe plums.", "Mingming spat out the [[bitter:bitter]] skin, reaching instead for mild [[spicy:spicy]] warm soup.", "Guests called the stew [[delicious:delicious]] and the warm buns [[yummy:yummy]] beyond words.", "The hot noodles tasted [[tasty:tasty]], perfect for [[thirsty:thirsty]] workers after long labor.", "Mom ground red [[spice:spice]] powder, simmering thick tomato [[sauce:sauce]] slowly."], ["Mingming squeezed red [[ketchup:ketchup]] lines, while roses gave natural [[perfume:perfume]] nearby.", "Grandma counted each fresh [[ingredient:ingredient]], adding a herbal health [[supplement:supplement]] for elders.", "Warm soup helps elders [[digest:digest]] well, so mom chose to [[bake:bake]] soft cakes instead.", "Uncle Wang helped [[fry:fry]] golden potato shreds, then watched grandma [[roast:roast]] chestnuts slowly.", "They served crisp morning [[toast:toast]], warning kids not to [[suck:suck]] hot soup quickly.", "Mingming learned to [[swallow:swallow]] calmly, refusing to [[lick:lick]] fingers at the table."], ["He promised not to [[chew:chew]] loudly, blowing cool air on mint [[gum:gum]] after meals.", "Mom told him to [[soak:soak]] dry mushrooms, then briefly [[dip:dip]] greens in boiling water.", "Grandma taught Mingming to [[squeeze:squeeze]] oranges and gently [[stir:stir]] honey into tea.", "At last mom began to [[grind:grind]] sesame seeds, filling the yard with nutty fragrance."], ["They hung paper lamps with thin [[suspension:suspension]] cords, tying each knot with an iron [[hook:hook]].", "Mingming pulled the wooden [[lever:lever]], steadying the tall bamboo [[scaffold:scaffold]] for uncle.", "New pipes improved village [[infrastructure:infrastructure]], and a shining new [[apparatus:apparatus]] arrived.", "When the old fan showed [[malfunction:malfunction]], neighbors started a lively [[debate:debate]] about repairs.", "Grandma asked uncle to [[fix:fix]] wires and carefully [[mend:mend]] torn tablecloths till morning.", "Mom chose to [[modify:modify]] the menu, asking Mingming to [[trim:trim]] wilted flowers neatly."], ["Uncle Wang began to [[weld:weld]] chair legs, while Mingming held the sharp [[saw:saw]] steady.", "They tightened each loose [[screw:screw]], refusing to [[drill:drill]] extra holes in old walls.", "Grandma fetched clear water with a straight [[plumb:plumb]] line, dreaming of a stone [[viaduct:viaduct]] hometown.", "They used a small earth [[dam:dam]] model, learning how workers [[assemble:assemble]] bridges together.", "Workers came to [[install:install]] bright lamps and [[furnish:furnish]] corners with flowers and stools.", "Mingming admired the neat [[placement:placement]] of bowls and the clever table [[layout:layout]]."], ["Guests entered through the red [[entrance:entrance]], guided past the side [[entry:entry]] by Mingming.", "Children played [[outside:outside]] the doorway, then ran [[outward:outward]] toward music and chuckles.", "They washed hands before touching [[exterior:exterior]] rails, keeping [[external:external]] dust away from food.", "Grandma led tours through [[inner:inner]] rooms, showing the renewed [[interior:interior]] with pride.", "Warm light flowed [[inward:inward]], filling every [[internal:internal]] corner with chuckles and songs.", "A tall yellow [[crane:crane]] lifted new lamps onto the roof at dawn."]], "sentZh": [["晨光洒满我的小店，每件旧物和二手商品都藏着一段过去。", "女孩带来旅行时买的旧纪念品，还有奶奶留下的泥塑工艺品。", "我先检查未加工的木料和简陋的接头，再定下每一步轻柔的修补计划。", "暖和的外套是冬天必需品，所以我今天先织补她那件撕破的节日盛装。", "我打开修补工具箱，慢慢拿起每一件小小的镀铬用具。", "人们叫这些东西路边的垃圾，但我把它们再利用成暖心礼物。"], ["这块弯木板来自旧城垃圾填埋场边上的废品堆。", "街道排污施工后它落满灰，我用温和的洗涤剂把它洗净。", "护理员送我护手乳和一只矮宽盆，用来泡脏布。", "我拔掉小塞子，打开旧水龙头，把架子冲干净。", "一截短锌管和一根软空心管把腿牢牢接在一起。", "开工前我先用湿拖把和旧草扫帚拖地扫地。"], ["老人带来一张又薄又破的床垫和一卷落灰的地毯。", "他的小碎花地毯和门口垫子要包新边，添新色。", "我在每个扁坐垫里塞进柔软的羽毛垫芯，坐着更舒服。", "宝宝的蓝毯子和珍爱的婚被晒满了多年阳光的味道。", "我洗了发黄的枕头，用软海绵擦掉印子。", "我用厚白毛巾擦干它，再用一枚小订书钉别上标签。"], ["我拔掉每颗松动的旧钉子，用锋利剃刀修掉毛边。", "我把粗糙的角磨光滑，换掉里面出故障的保险丝。", "一条黑电源线和一条长白电线悬垂在书桌后面。", "我把每股松散的线丝捻紧，再点一支小蜜蜡烛。", "烛蜡暖暖滴落，我边看旧平装书上的修补窍门。", "一本图画小册子介绍老手艺，我把小零件包在软纸巾里。"], ["我把旧发票复印一份，把那张简短备忘录贴在桌子上方。", "旧文具抽屉很乱，不过那管强力胶水还很好用。", "蓝墨水弄脏了本子，粗橡皮筋箍着书页。", "我用大银剪刀沿白线剪开厚布。", "椅子圆边松了，但每处雕花依然好看。", "价钱只是一个小因素，我只修补损坏最重的那部分。"], ["我擦亮他的旧校徽，拧紧每颗小银螺栓。", "圆门把和弯抽屉柄今天要轻轻修一修。", "受损的百叶窗直晃，长长的碎花窗帘垂下来。", "我换新裂了的窗玻璃，它雾蒙蒙的不透光，挡住了暖光。", "纽扣睡在玻璃罐里，旧钩子躺在小木桶中。", "我用红桶提水，在小搪瓷水壶里洗刷子。"], ["店里电话响两声，小门铃开心地唱起来。", "我的便携灯很顺手，但亮工作射灯照得出每处瑕疵。", "换了小暖灯泡，旧纸灯笼又柔柔亮起来。", "小手电帮我照见嗡嗡响的旧冰箱后面。", "小冰箱嗡嗡响，我用吵吵的吸尘器吸灰。", "用旧的送货架和倒了的花园栅栏在店后等着修。"], ["我给松动的自行车脚踏上油，扶正长长的墙架。", "我爬上短红梯，去拿高处三条腿的画凳。", "破黑伞和发黄的童雨衣在门口滴水。", "我把盘子里的旧漆刮出来，倒进生锈的搪瓷罐。", "旧镀铬厂关了，我去邻居的小锻炉那儿暖接头。", "这个轻巧的混合合金架子，比纯实心金属软一些。"], ["旧扁熨斗立在旁边，黄铜烛台闪闪发光。", "一匹小绿铜马和一袋灰水泥摆在一起。", "白石灰粉和墙面灰浆补好了裂墙角。", "裂了的棕皮包和透明塑料罩等着打理。", "每根植物纤维摸着粗，蓝软布摸着滑。", "奶奶爱织暖帽，我把破椅面重新编好。"], ["厚画布和白桌布铺在台面上。", "软白棉衬衫和结实的蓝尼龙包悬垂在户外。", "新锯的木料闻着甜，每条木腿上了油发亮。", "一颗枣核躺在暖气边，木头给冬天稳稳的燃料。", "我给每个紧铰链上润滑油，再悬挂一颗亮水晶吊坠。", "劣质零件一概不用，假币一律退回。"], ["假珍珠碎得快，薄漆壳真脆弱。", "小小微缩椅模是今天唯一还有的礼物。", "结实的缝线让修补耐穿，慢慢赢得邻居的喜爱。", "短斗篷正流行，但暖和舒服在这儿永远占上风。", "年轻偶像歌手爱朴素打扮，不爱店里奢华风。", "不用乱花钱，旧传家珠宝一亮就跟新的一样。"], ["每颗小亮宝石和蓝色宝石在盘里发光。", "淡绿玉戒指要装点旧音乐盒盖。", "每枚小金饰要让素节日裙更美。", "我绣红花，妹妹练温柔的新娘发型。", "天然绿颜料和安全棕染料给浅布上色。", "春假面舞会上，她戴薄闪面纱。"], ["她的旧舞衣要迷住前排每个孩子。", "干净体面的折边真好看，齐整纽扣添精致。", "她每天走路温柔优雅，安安静静。", "她整洁的新样子，完全不用贵化妆品。", "淡淡的妆保住她甜美迷人的笑。", "我们给孩子穿暖，补好每件撕破的校服。"], ["叠好的干净衣服又装满她小卧室衣柜。", "他的工装全是灰，借了件长灰大衣。", "软晨袍和长晚礼裙悬垂在屏风后。", "我补蓝冬毛衣和棕色骑行夹克。", "他的灰工裤要钉新扣，加小银搭扣。", "我整好弯帽檐，洗软碎花围巾。"], ["白点手帕和小扣钱包躺在一起。", "我留着棕旧钱包和灰无袖背心。", "我包好礼物，把黑剧场斗篷悬挂进去。", "白衬衫领弯了，长大衣一只袖子短了。", "一只暖冬袜和一只薄派对长袜要配对。", "她的粉软拖鞋穿破了，白蕾丝边还漂亮。"], ["好心老裁缝要在晚会前缝好折边。", "我们匀匀纺纱，加一针结实暗针。", "镀铬针闪闪，每枚彩针别住褶缝。", "长红绳和细白线躺在滚轮边。", "破包带垂着，墙上漆条指引我下剪。", "粉缎带系盒子，黑校腰带要打洞。"], ["细金链在她小新手镯边闪光。", "她的旧珍珠项链断了，我换新每颗小落珠。", "攒下的旧纺织碎布和红丝绒装满一箱。", "软灰羊毛和碎花膝盖补丁救下旧大衣。", "破抹布擦着台面，角落虽破旧却温馨。", "收紧的腰带放宽了，深紫色盖住修补痕。"], ["软棕黄大衣洗好了，暖色永远不褪色。", "每块深食渍和漆点慢慢离开布面。", "高兴的高个子穿着修好的裙子苗条一笑。", "黄昏我们喝茶，感谢每处小小修补暖了整条街。"], ["奶奶宣布了新的建造计划不再理会过去那些关于钱的种种限制", "妈妈同意建一间温暖的饭厅虽然旧尘土可能会毁掉晚餐", "明明想定下明确分工先从冲洗灰色水泥地面开始", "王叔带来了闪亮的钢制工具确保架子结实耐用很久", "他们围着满是灰尘的场地走梦想着未来聚会地点迎接客人的样子", "老屋是村里的标志静静立在绿树和窄路旁边"], ["妈妈试着找出旧图纸那是爷爷当年选中居住做饭的地方", "小鸟还住在屋顶上不过响声一起来它们就会迁往别处", "奶奶决定住在楼下让整栋房子白天黑夜都有生气", "明明笑说自家既不是高楼也不是富人别墅却满是爱", "不像冰冷的大宅也不像拥挤的公寓这里留着童年回忆", "他们不肯把它变成吵闹的旅舍或者陌生人打猎的小屋"], ["院子后面立着一间破棚和一间木屋里面堆满破旧椅子", "妈妈打开黑洞洞的地窖和倾斜的棚子被浓尘呛得咳嗽", "隔壁小屋子曾在白天当过村里孩子的托儿所", "明明在那里找到自己小时候的摇篮如今成了小猫安稳的窝", "王叔搬开每一块掉落的砖块在纸上画了整齐的清扫分区", "他们先扫出一条窄过道接着清掉宽门廊上的落叶"], ["长走廊蒙着灰尘摇晃的楼梯旁挂着蜘蛛网", "楼上那层积着厚厚的灰呛得大家大声打喷嚏", "明明开玩笑说少了自动扶梯紧紧抓住松动的木扶手", "外婆一块接一块擦石柱大声数着每一根高柱子", "一根裂开的木梁撑着大厅上方弯弯的穹顶", "妈妈夸圆拱和高天花板让夏天的空气很凉爽"], ["麻雀在宽屋檐下筑巢旁边高高的石头烟囱积满烟灰", "他们打算布置简单的迎客角比镇上任何旅馆大堂都亮", "摇晃的木长凳让旧客厅显得空荡又冷清", "外婆留下石头壁炉却搬走旁边生锈的铁暖气", "明明擦净客厅落灰的架子把每个木柜门都擦亮"], ["妈妈推开朝阳的阳台门扫掉石头露台上的枯叶", "旧厨房满是烟味比旁边被遗忘的后盥洗室还难闻", "王叔刷洗发黄的马桶座又擦掉浴缸边上的污渍", "不像镇上吵闹的商场和石头购物中心家里很安静", "他们列出要买的物品略过远处的超市和夜市摊位"], ["没人想要花哨的赌场或吵闹的照相馆只想吃暖暖的饭", "虽然镇上发展很有城市气息他们的小巷仍像偏远梦境一样静", "附近的店铺早早关门夜晚的街道只剩空荡", "清走杂物后大厅显得宽敞却还蒙尘远没到密闭安全的程度"], ["明明穿过宽阔的空地跑向门前小广场愉悦地喊叫", "他把房子想象成童话城堡接着看见老木匠出现", "细心的泥瓦匠敲了敲每块松动的地砖哼着村里老调", "到黄昏时门口新砌的灰色砖墙预示着以后许多忙碌的清晨"], ["明明一早饿得肚子咕咕叫迫不及待帮妈妈为明天的客人备餐", "他们检查了储备袋只留下新鲜能吃的食物做饭", "外婆说出一个秘方打算把旧厅变成一家小饭馆", "不像学校食堂或吵闹的酒吧家里的饭菜味道更温和", "开幕那天他们不要冷清的自助食堂也不要昂贵的酒店自助餐", "王叔借出院子里的烧烤台让家里的晚饭不再单调"], ["外婆梦想摆一场丰收宴给每个孩 ，便轻轻给他盖上暖毯。", "回程的清晨，车厢安静，父亲轻声总结了关于选举的见闻。", "叔叔唱起老歌，父亲在尘土上画线，勾勒远方宽阔的调查对象。", "在跨国列车上，父亲把民意调查和沿途的山河连在一起讲给我听。", "我们吃着热面，父亲忽然提起野心，惹得邻座哈哈大笑。", "弟弟在面包店外像小丑一样搞提名，逗得整条困倦的队伍哄堂大笑。"], ["清晨，父亲带着关于清单的念头，和我在庭院里喝热茶，商量出发的事。", "父亲给我讲面包店后面那场安静的权力交接，老农们在那里轻声合唱。", "夜里住在小店里，我们聊到福利，窗外雨声轻轻响着。", "天刚亮，我们登上列车，父亲指着远山说起幸福。", "车过平原，阳光照进来，父亲把和谐讲成一段有趣的经历。", "中午在边境停留，父亲拉着我去看市集，顺便说到稳定的。"], ["进入第二国后，夜色降临，我们在灯下继续谈繁荣兴旺。", "傍晚，邻座的旅客也加入进来，大家围绕成功聊了很久。", "到了第三国，晨雾很浓，父亲用前景来形容眼前的景色。", "看新闻时，主持人提到选票和辩论，父亲联想到视角，和我细细分析。", "回程的清晨，车厢安静，父亲轻声总结了关于观点的见闻。", "快到家时，村口灯火亮起，父亲乐呵呵地把立场编进回家的故事里。"], ["在跨国列车上，父亲把观点和沿途的山河连在一起讲给我听。", "午夜柔和的铃声响起，父亲叫醒我，在银色月光下看苍白的路线指示牌。", "父亲翻开小本子，把道德规范记在行程旁边，说回家要讲给母亲听。", "父亲说，经过一夜驰往边境之地的长途跋涉，烦恼再也劝不动他了。", "排队的时候，父亲低声讲起提案，让我别紧张，慢慢往前走。", "夜里住在小店里，我们聊到暗示，窗外雨声轻轻响着。"], ["天刚亮，我们登上列车，父亲指着远山说起宣布。", "车过平原，阳光照进来，父亲把断言讲成一段有趣的经历。", "中午在边境停留，父亲拉着我去看市集，顺便说到声称。", "进入第二国后，夜色降临，我们在灯下继续谈宣告。", "傍晚，邻座的旅客也加入进来，大家围绕状态聊了很久。", "到了第三国，晨雾很浓，父亲用宣布来形容眼前的景色。"], ["午夜时分，我听见父亲在睡梦中轻轻念叨澄清，便轻轻给他盖上暖毯。", "回程的清晨，车厢安静，父亲轻声总结了关于帮助的见闻。", "快到家时，村口灯火亮起，父亲乐呵呵地把帮助编进回家的故事里。", "拂晓，列车员让高个男孩们互相鼓着劲迅速让开门口，好让老人们先过。", "我们吃着热面，父亲忽然提起实施，惹得邻座哈哈大笑。", "父亲翻开小本子，把监控记在行程旁边，说回家要讲给母亲听。"], ["父亲说，经过一夜驰往边境之地的长途跋涉，烦恼再也不会接纳他了。", "排队的时候，父亲低声讲起非洲的，让我别紧张，慢慢往前走。", "夜里住在小店里，我们聊到欧洲的，窗外雨声轻轻响着。", "天刚亮，我们登上列车，父亲指着远山说起拉丁语的。", "车过平原，阳光照进来，父亲把犹太人的讲成一段有趣的经历。", "中午在边境停留，父亲拉着我去看市集，顺便说到阿拉伯。"], ["一位来自葡萄牙的高个旅人与我们分享暖面包，哼着轻柔的歌直到深夜。", "傍晚，邻座的旅客也加入进来，大家围绕古罗马的聊了很久。", "到了第三国，晨雾很浓，父亲用俄国的来形容眼前的景色。", "看新闻时，主持人提到选票和辩论，父亲联想到西班牙语，和我细细分析。", "回程的清晨，车厢安静，父亲轻声总结了关于瑞士的的见闻。", "快到家时，村口灯火亮起，父亲乐呵呵地把希腊的编进回家的故事里。"], ["一位来自意大利的高个旅人与我们分享暖面包，哼着轻柔的歌直到深夜。", "我们吃着热面，父亲忽然提起苏联，惹得邻座哈哈大笑。", "父亲翻开小本子，把印度的记在行程旁边，说回家要讲给母亲听。", "清晨，父亲带着关于澳大利亚的念头，和我在庭院里喝热茶，商量出发的事。", "排队的时候，父亲低声讲起新西兰，让我别紧张，慢慢往前走。", "夜里住在小店里，我们聊到加拿大，窗外雨声轻轻响着。"], ["一位来自英国的高个旅人与我们分享暖面包，哼着轻柔的歌直到深夜。", "车过平原，阳光照进来，父亲把法国讲成一段有趣的经历。", "中午在边境停留，父亲拉着我去看市集，顺便说到德国。"], ["老林梦想成为街角小店主，每天面对沉重的生计压力。", "他用自己微薄的积蓄租下店铺，还常常把热饭送给邻居。", "好心邻居仿佛给老屋注入新的希望，远不止是做生意。", "他没有大声吆喝，只在木门外写下一句温暖的标语。", "买货架之前，他把租约里的每一条都仔细看过。", "第一个月的费用他勉强才能负担，却梦想给整条街带来零售的小愉悦。"], ["小杂货店安静开张，他给附近老顾客一点小优惠。", "开幕促销时，他给在外玩耍的孩子发纸质礼券。", "老人带来纸质优惠券，还打听亲戚从外地带来的钱币。", "他愿意和邻居交换小物件，有时也用故事换微笑。", "他把每张收据都收进箱子，担心对小店加收新税。", "他了解到进口水果的关税，责任感一天比一天强。"], ["他怕大房东强行涨租，很快耗光他微薄的钱财。", "每天的进账很少，毛收入勉强够付水电费。", "全镇笼罩在经济不景气里，夜里他心里满是低落。", "一场突如其来的短缺危机，打碎了他冬天求安稳的指望。", "和邻居的情谊支撑着他，尽管欠了供货商不少债。", "定期亏空慢慢累积，物价上涨把价格越推越高。"], ["他盼着物价回落，可存下的硬币一天天变少。", "为了撑过生意下滑，他只好缩短夜晚营业时间。", "他看着希望在心里下降，来店的人好像也在飞快减少。", "他努力减少后屋的浪费，在货架上多摆新鲜水果。", "客人每多一点点，都像寒冬过后的暖意生长。", "成本不断攀升，他不敢把店面扩到隔壁。"], ["附近年轻人突然涌入，不暗示整条街很快变富。", "他想丰富早餐种类，却没有足够地方放新货架。", "后屋勉强够用，也没有多余椅子给客人休息。", "微薄的存款维持着灯火，旧箱子在角落成了多余之物。", "缺人手让他筋疲力尽，直到隔壁小公司来搭把手。", "那家小企业派来和气的人，商量共同早晨送货。"], ["作为单打独斗的人，没有家人支持他不敢多投钱。", "听了邻居实在的意见，他认真挑好每件早货。", "一次冒险进的便宜冬货，把后屋堆到屋顶。", "冬天运来的货物晚到了，他忘了给易碎箱子保价。", "司机再三保证，下次一定派更可靠沉稳的人来。", "长久商谈之后，老林请教子每晚都来旁听。"], ["定大米最终售价那晚，桌边一个人也没缺席。", "他们争论批发价，还开玩笑说天亮摆摊卖豆子。", "供货商报了低价，老林怀着希望拍板成交。", "每笔买卖都记下来，定期在周日结算营业额。", "他们保证不丢烂菜，也不把麻烦推给别街。", "他们约定每周按限额进新鲜水果，有危险一起担。"], ["没有银行利息牵扯，也没答应给外人十二个月分红。", "老林把剩货记进本子，另开一本账管日常。", "他先留下一点定金，余下定期分期付清。", "他数清每一枚小钱，擦亮旧铜罐做摆设。", "出租人说老房产一带很快会有新店入驻。", "老林希望小店成为家传，日子长久安宁。"], ["他觉得辛苦很值得，每个邻居都像金子般宝贵。", "一点盈利的鼓舞，让他想把开幕提早一小时。", "他招呼利落讨人喜欢，留着硬币给店员发薪水。", "微薄的进项还够喝汤，也够付小帮工的日工资。", "饭馆晚付货款，逼得他向供货商要一点退款。", "他很快报销车费，工资本却锁在抽屉里。"], ["没有额外报酬，但街道补贴帮他付了冬灯费。", "他想慢慢挣得信任，把小店当一辈子事业珍惜。", "看店是朴素的行当，也是全家体面的职业。", "他把它当成天职，天亮到天黑都出实在力气。", "三个帮工的小队伍，笑着说他是温和的拼命人。", "店里人个个和气，年轻店员记得每个孩子的名字。"], ["每次面谈，他都就着热茶细看手写简历。", "邻居推荐老实青年，他都乐意多收一个帮手。", "他发誓不在怒气中招人，不在雨天开除人。", "从不突然裁员吓人，也不赶走生病的孩子。", "他只清理碎掉的箱子，从不强迫人丢脸辞职。", "他从不用面袋当椅子，还说笑自己不早退。"], ["一次送货失败，像打碎了他所有早晨计划。", "鲜奶突然断货，给对手散布难听话的机会。", "老林没机会详述，只能在沉默和争吵之间选择。", "他想平心静气解决问题，保住和供货商的长久往来。", "他努力管住情绪，放缓呼吸听刺耳的抱怨。", "街规拦不住吵闹，朋友们只好来协调谈话。"], ["双方答应合作一晚，一起对账查本子。", "年轻学生讲解法律字句，把冰冷条例读了两遍。", "老口头约定太松，不如老林手里的纸约可靠。", "墙上的店规和司机留的送货规矩对不上。", "晚送打破了行规，也低于他们定的底线。", "鲜奶啥算合格没写清，也从没定过统一标准。"], ["司机请求先开口，勉强承认自己晚了。", "老林说要信守每个承诺，严守早晨送货时间。", "烂瓶他一律拒收，黎明时间卡得很紧。", "街道干部说早送是食品店必须守的规矩。", "浓茶提神，两人都讲情义愿心平气和谈。", "老林说对孩子有责任，怕丢脸走上公堂。"], ["不用惊动大人物，街道会定简单的共用规矩。", "他们不想立苛刻条文，只求小店之间大致公平。", "对新人的旧偏见散了，当晚没人搞歧视。", "老林不再发怒指责，保证不为一车货打官司。", "没人想告疲惫的司机，也不忍责备他家人。", "抵制的话不提了，大家喝着热茶静静开会。"], ["梅姨来温和调解，平静听完每个疲惫的诉说。", "老林软语求信任，却没有生硬反驳司机。", "她努力劝和双方，给变质牛奶的争执降温。", "屋里掠过紧张的低语，司机开始嘟囔道歉。", "理解的轻声蔓延，连生气的叔伯都安静沉默。", "他们答应查清晚到的车，向路上见证人问实情。"], ["事实会证明谁有理，也撑起新的送货安排。", "梅姨挑了合适时间，不请严厉的人来断案。", "旧怒慢慢化了，不用开庭也能治好伤口。", "没人再是嫌疑人，纸上也没写严厉的判语。", "那晚没人被抓，也没人面对冰冷的牢房。", "对黑屋的惊恐散了，谈话不只停在纸上。"], ["梅姨愿盯着早晨到货，天天亲自查牛奶。", "他们约定少接夜单，不在孩子面前大吵。", "双方答应存善心，除了晚车不再有亏心事。", "街上没有寒冷的案件，小店后面也没有藏着歪心。", "没人在黑夜行贿，也没人抢朋友的功劳。", "夜里没有贼碰货架，帮工也不偷罐里硬币。"], ["贼和命案的话题，离热茶微笑很远很远。", "绝望没走到绝路，也没人再骗老朋友。", "店里不用掺水奶骗人，也不藏微笑后的骗局。", "没人再被骂骗子，新约里也没藏苦陷阱。", "不用耍小聪明，也不用装欢快喝热茶。", "没人觉得自己傻，司机一家甩掉了旧骂名。"], ["司机决定公开承认晚点，服从新的黎明规矩。", "老林乐意彻底和好，遵守那晚定的共行计划。", "双方都不再屈从面子，也不再受重罚。", "重罚单没开，小店也没押出去。", "店面归属仍是老林，手绘招牌也留着简朴款。", "为街坊服务是安静的福气，邻居都认他的实心。"], ["一张小纸条帮他们找到城外新鲜农场。", "没匿名纸条再传怒气，假话也进不了店。", "真诚笑容回到老林脸上，早晨的流程也有了章法。", "天天打扫成了平静习惯，善举都带来暖报。", "硬性要求压不住善意，尖声也不再打破安宁。", "新规矩不费多少钱，只请各家签下共同信。"], ["梅姨不像头儿那样下令，只用故事轻声教帮工。"]], "paraZh": ["我们在家收拾行李，父亲带我去排队办签证，屋里屋外都是出发前的忙碌。", "签证有了着落，我们住进小店，父亲核对材料，商量乘车的事。", "清晨登上列车，车厢温暖，父亲指着窗外讲沿途的山河。", "列车穿过平原，阳光正好，我们和邻座分享吃食，有说有欢。", "中午到达边境，市集热闹，父亲带我下车走走，看看异乡风物。", "进入第二国后，田野开阔，夜里灯光明亮，旅途格外安稳。", "傍晚停车时，我们认识了新朋友，大家围坐一起谈天。", "夜深了，车厢安静，父亲轻声讲过去的事，哄我入睡。", "清晨雾气未散，列车继续向前，父亲带我看日出。", "上午经过大河，桥很长，水面发亮，我们都趴在窗边看。", "中午在小站停靠，我们买了热汤，味道鲜美，暖了全身。", "下午穿过村庄，孩子们挥手，父亲也挥手回应。", "进入第三国时，已是黄昏，灯火渐渐亮起，街景新鲜。", "晚上住进旅馆，父亲打开新闻，画面里正在谈论选举。", "新闻里选情激烈，父亲结合一路见闻，给我讲其中的道理。", "邻座旅客也来讨论，大家看法不同，但聊得很和气。", "深夜回到车厢，父亲总结几国的见闻，说世界很大。", "回程的清晨，阳光温柔，我们整理行李，准备回家。", "车过平原，春花开放，父亲说回家要把故事讲给家人听。", "中午短暂停留，我们买了点心，分给同车的孩子。", "下午离家渐近，熟悉的山水出现，心里格外踏实。", "傍晚到家，母亲迎出来，一家人围坐吃饭，旅途圆满结束。", "我们在家收拾行李，父亲带我去排队办签证，屋里屋外都是出发前的忙碌。 灯下团聚，欢语不断。", "签证有了着落，我们住进小店，父亲核对材料，商量乘车的事。 灯下团聚，欢语不断。", "清晨登上列车，车厢温暖，父亲指着窗外讲沿途的山河。 灯下团聚，欢语不断。", "列车穿过平原，阳光正好，我们和邻座分享吃食，有说有欢。 灯下团聚，欢语不断。", "中午到达边境，市集热闹，父亲带我下车走走，看看异乡风物。 灯下团聚，欢语不断。", "进入第二国后，田野开阔，夜里灯光明亮，旅途格外安稳。 灯下团聚，欢语不断。", "傍晚停车时，我们认识了新朋友，大家围坐一起谈天。 灯下团聚，欢语不断。", "夜深了，车厢安静，父亲轻声讲过去的事，哄我入睡。 灯下团聚，欢语不断。", "清晨雾气未散，列车继续向前，父亲带我看日出。 灯下团聚，欢语不断。", "上午经过大河，桥很长，水面发亮，我们都趴在窗边看。 灯下团聚，欢语不断。", "中午在小站停靠，我们买了热汤，味道鲜美，暖了全身。 灯下团聚，欢语不断。", "下午穿过村庄，孩子们 d a quick [[maid:maid]] rinsed jars.", "Its [[maiden:maiden]] trial passed, pleasing the whole tired [[household:household]] at dusk."], ["Each dull [[chore:chore]] felt light when pupils sang, led by a funny host.", "The grey-haired [[landlord:landlord]] lent a shed, and his new [[tenant:tenant]] swept it clean.", "Each [[guest:guest]] tasted clean tea, and each shop [[customer:customer]] praised the clear water.", "A shy [[client:client]] asked questions, and a brief [[encounter:encounter]] led to more help.", "Pupils did not [[chase:chase]] stray dogs or [[miss:miss]] lunch while fixing drips.", "After each [[appointment:appointment]] with judges, Mei would [[accompany:accompany]] Lin to the gate."], ["Small Bo, still [[dependent:dependent]] on crutches, dared to [[propose:propose]] a safer spout.", "Their close [[engagement:engagement]] with the street felt sweet, longer than a short [[honeymoon:honeymoon]].", "No row caused [[divorce:divorce]] in the team; each kept a [[single:single]] shared aim.", "Mei took [[sole:sole]] care of charts, and others kept [[respective:respective]] jars in line.", "Each [[individual:individual]] wrote notes, even the tired [[commuter:commuter]] uncle from North Street.", "The whole [[neighbourhood:neighbourhood]] clapped, even the stern [[boss:boss]] from the tea shop."], ["A kind [[supervisor:supervisor]] praised work, never scolding a slow [[subordinate:subordinate]] helper.", "Lan chose Tao as [[partner:partner]], too shy to [[mate:mate]] pigeons for the school show.", "A sick [[colleague:colleague]] sent greetings, and a brave [[comrade:comrade]] brought soup at noon.", "An old [[acquaintance:acquaintance]] smiled warmly, showing true [[affection:affection]] for the busy crew.", "A kind [[stranger:stranger]] watched long, then joined as a fervent [[apprentice:apprentice]] helper.", "The tired [[deputy:deputy]] head bowed to each small [[hero:hero]] of the street."], ["Rain fell softly over quiet roofs and washed dusty lanes at last.", "A brave [[heroine:heroine]] from the drama club and a shy [[actress:actress]] cheered loudly.", "No stern [[chancellor:chancellor]] visited, but a retired [[commander:commander]] sent a kind note.", "The kind [[director:director]] of the fair stayed a firm [[proponent:proponent]] of school builds.", "The fair [[committee:committee]] met twice, and the town [[council:council]] lent chairs and tables.", "They chose Lan as [[delegate:delegate]], guided by a water [[specialist:specialist]] from South Street."], ["Kids laughed aloud and shared warm buns under bright lamps.", "A plant [[consultant:consultant]] and a kind [[veterinary:veterinary]] doctor praised the safe runoff.", "The school [[counsellor:counsellor]] smiled, and a fair [[solicitor:solicitor]] explained contest rules clearly.", "No stern [[attorney:attorney]] argued, and a calm [[umpire:umpire]] timed each trial fairly.", "The busy [[cashier:cashier]] from the store and a tall [[fireman:fireman]] kept order near spouts.", "A gentle [[nurse:nurse]] bound an aching knuckle, while a cheerful [[gardener:gardener]] planted new seeds."], ["Morning sun dried wet paths brightly and pupils smiled again.", "The funny [[barber:barber]] promised free [[haircut:haircuts]] to winners after the fair.", "The old [[fisherman:fisherman]] grinned widely while the kind [[butcher:butcher]] shared hot buns.", "Boys learned to [[groom:groom]] ponies gently; no shouting held patience [[hostage:hostage]] in fright.", "Years of hard [[toil:toil]] ended sweetly; even a poor [[beggar:beggar]] drank clean water.", "Nobody lived as a tired [[slave:slave]] to thirst, and no [[coward:coward]] feared telling truth."]], "sentZh": [["上周日爷爷说，过去的战争给村庄带来了深重的暴力和长久的冲突。", "他告诉我们，一次夜间突袭让人看到豪言背后的巨大折磨。", "那个冬天的旧战役以冷河边最后一战结束。", "弟弟听见他低沉的挣扎声，以及远山之外响亮的爆炸声。", "大炮会轰击镇子，飞机则在夜间轰炸桥梁。", "每次巨响都震碎窗户，小孩子们躲在桌下哭泣。"], ["炉边的小火星至今仍在他悲伤的记忆里闪烁。", "火药味弥漫在田野里那辆毁坏的坦克周围。", "一门重炮静静立着，小路旁还躺着一枚小导弹。", "爷爷把旧武器和磨旧的手枪放回木箱。", "一支生锈的步枪旁放着一颗子弹，成为过去岁月的伤感见证。", "墙上的旧靶子曾帮助炮弹偏转，远离附近的家园。"], ["在灯暖暖的火焰旁，他的第一个任务是送信。", "红色信号弹升起，点点亮光轻轻洒满黑夜。", "柔和的微光照着爷爷晚饭后慢慢擦拭的刀刃。", "他把剑和旧斧放在安静的壁炉边。", "小锤子修好了那把在寒夜里拉琴的琴弓。", "一张弯箭和一杆长矛放在布满灰尘的教室图画下。"], ["一顶裂开头盔和一面凹盾放在学校门上方。", "好心的老师帮孩子们配好物品，并为疲惫的客人准备热茶。", "纪念馆能提供热汤，并在门口安排好心的帮手。", "石头从未击中墙壁，歌声也未曾驱散孤独的恐惧。", "没有响亮的袭击声，也没有拳头在薄门上打出洞。", "砍柴的手永远不会因怒气刺伤朋友。"], ["那个艰难的困境让全家多年处于困苦之中。", "每个隐藏的陷阱都源于贪婪首领的残酷阴谋。", "可怜的街道一片赤贫，漫长的饥荒蔓延山谷。", "寒夜剥夺了温暖饭食，瘦弱的孩子们只好挨饿。", "壮汉们来夺走粮食，并沿小巷追赶悲伤的农夫。", "每个新的威胁都会冒犯热爱安静乡村生活的人们。"], ["再响亮的好斗喊声也无法侵犯我们充满爱的小屋。", "外人不能越过栅栏非法闯入，也不能擅闯院子。", "即使喧闹的人群攻击旧日的和平，善良的规则也不容违反。", "突如其来的袭击考验了我们用平静话语挑战恶意的诺言。", "漫长的围攻没能用饥饿和惊恐包围镇子。", "高墙无法在漫长的谈话间歇中围住我们。"], ["最后枪声止住，悲伤的歌声也慢慢停息。", "勇敢的母亲们反对恶意，人群也不再压迫弱者。", "明智的话语能对抗惊恐，劝止年轻人加入打斗。", "旧法律禁止枪支，城市学校也禁止玩刀具游戏。", "冷静的领导设法防止损失，农夫们则开始悄悄反抗。", "儿子不会背叛朋友，叛国也不会玷污家名。"], ["河对岸，一位年轻的反抗者拒绝了雇佣叛徒的称赞。", "真正的爱国者不为首领可悲的过错承担责备。", "温和的责备比摆在桌上的冰冷证据更有力。", "清楚的证据消除了爱听夜晚故事的孩子们的闲散恐惧。", "消息很可怕，但心中对和平的渴望却极其强烈。", "可怕的噪声惊醒了每间小木屋里的警觉。"], ["深深的恐惧笼罩夜晚，巨响常吓到小狗。", "在动荡的日子里紧张渐长，直到安静的交谈带来希望。", "过去的动荡为温暖大厅里分享的每个真实场景染上色彩。", "那个特殊的场合教会人们尊重对骄傲和怒气的限制。", "旧界石仍像缰绳一样勒住烦躁的牲口棚马匹。", "队伍不再参加射击比赛，而参加欢乐的丰收游戏。"], ["老对手学会友好竞争，不让对手式的骄傲毁掉春耕。", "一位曾经的竞争者如今称老敌人为珍爱的密友。", "好的战略需要比仓促枪炮和苦涩哭声更明智的战术。", "每次巧妙的调动都遵循爷爷安全回家的简单蓝图。", "爷爷会警告孩子们，而饥饿曾迫使母亲们轻声抽泣。", "善良的护士因职责感到有义务为饥饿的人们订购面包。"], ["他们平静的抗议帮助驳斥了远方电台散布的谎言。", "真正的力量不在残酷的武力，而在温柔相助的手。", "热食会增强虚弱的身体，任何事都不能损害亲切的关怀。", "柔和的歌能减轻折磨，给孤独的寡妇带来安慰。", "每个小事件都包含值得成年人安静思考的事情。", "善行每天在学校周围发生的地方，就会有巨大变化。"], ["在爷爷温柔的皱纹笑容旁，野蛮鲁莽的行为都显得黯然。", "冬天他猛烈的咳嗽声很难听，但他的心依然善良。", "邪恶的念头只会助长靠愤怒争吵为生的魔鬼。", "严厉的惩罚绝不该处决因饥饿偷走热面包的男孩。", "他们没有挂起旧外套休息，而是牺牲甜美睡眠帮助邻居。", "每一位死伤者都提醒我们把骄傲和生锈炮弹一起埋葬。"], ["白杨后苔藓墓旁，一场寂静的葬礼结束。", "朴素的坟墓远离硝烟旧地的喧闹地狱。", "古老的海事地图显示了忧心水手曾用的海军航线。", "安静的舰队沉睡，疲惫的部队在绿松旁休息。", "海鸥盘旋在蓝色波浪上，没有粗暴的登陆惊扰海湾。", "慢行者沿石阶前行，和平也会在心中推进。"], ["没有军用卡车载着核货物穿过盛开的苹果园。", "在孩子们栽种幼小树苗的花园，苦毒无法摧毁一切。", "每次不必要的风险都会偷走求知旅行青年的平静冒险。", "突来的危险会给忽视早期迹象的城镇带来灾难。", "古桥不必在漫长雨季的折磨下倒塌。", "残酷的话羞辱玩伴，谎言会损害新兴的友谊。"], ["这种有害的玩笑误导新人，破坏安静的晚课。", "大声争吵打扰困倦的心，自夸的喊叫干扰课程。", "迟来的钟声打断游戏，但好孩子从不从职责上退缩。", "干叶在阳光下收缩，疲惫的脚步从尘土路上撤回。", "体弱的老人靠邻里间坚定的妥协抵御寒风。", "疲惫的手放下刀具，白鸽逃向云端。"], ["困倦的职员停止争吵，领导们抛弃骄傲热情握手。", "我们欣然放弃 严苛的口号，丢弃旧日的褪色海报。", "干净的院子清除了杂草，孩子们用心守护花朵。", "石墙守护种子，温柔的爱终将战胜寒冷的不信任。", "温柔的手抵制怒气，信件留住远方表亲的微笑。", "真正的胜利给简朴的家和阳光校园带来安静的凯旋。"], ["善良的心战胜惊恐，白色纪念碑上刻着沉默的名字。", "灰色石碑立在幽静院子里的高大塑像旁。", "铜质奖章为战时冬天的护士们保持崇高荣誉。", "他们光荣的事迹每年为明朗的秋日教室增添光亮。", "老朋友们奉献夜晚，向无名帮手致谢。", "夜巡变成了守望沉睡村巷的友好卫兵。"], ["褪色的伪装如今在盛开的牡丹丛中不再构成障碍。", "深洞庇护兔子，午夜再无狡猾间谍行走。", "年轻的侦察员沿小路走去，和善的将军在那里分享热面包。", "疲惫的士兵在枫树下靠着威严的老兵休息。"], ["镇上小理工学院请了一位和善的机修工来指导学生。", "他们想要真正的进步，希望学生为干净街道创新。", "没人想到院子里做的小发明会有大突破。", "职员讲解了专利，告诉学生如何安全地发明实用东西。", "团队不提前透露计划，要在集市上揭晓。", "他们希望评委发现亮点，绝不冷漠地暴露短处。"], ["老海员选了熟悉的蓝色水域领域。", "一家小绿色基金会出资，学生们专攻净水。", "他们每天中午集中，用学校后面的雨水罐。", "日常用法简单，害羞的测试员每次试验后记笔记。", "第一个装置连着厨房电器，为植物节水。", "学校院子免费提供场地，晚上共用设备干活。"], ["每件锋利的仪器和手工具都放在上锁的木箱里。", "黄铜量规帮学生稳稳地测量浑水。", "他们晚饭后在纸上计算省下的水滴和费用。", "他们数清空的罐子，估算整条街的节水量。", "老师们来评估作品，带着微笑评价图纸。", "一个免费配件，带来可做花肥的干净副产品。"], ["一根辅助管让作品更适合小家庭，功能多样。", "学生们收集旧瓶子，用结实的绳线接好。", "这些玻璃罐属于学校实验室，用于学光学基础。", "学校的显微镜透过弯曲镜片在正午亮光下照出脏物。", "玩具雷达轻轻响，微弱回声逗乐了篱笆边的孩子。", "小传感器把信号送到普通多媒体屏幕上给大家看。"], ["安全的网络连着房间，圆形刻度盘调节水流。", "借来的笔记本电脑记录图表，大喇叭通知休息。", "便宜的麦克风录下声音，旁边是装歌的老磁带盒。", "胶带把电线粘紧，二进制代码在小屏上闪。", "无线连接正常，池塘的高清图片很清楚。", "清晰的音频让大家听见，共同的愿景让团队勇敢平静。"], ["他们的幻想像关于清水河的科幻故事一样奔放。", "手压泵抽起池水，小发电机点亮小灯。", "每个塑料齿轮很牢，底座能向太阳转动。", "没有液压油漏，学校排水沟整周都干爽。", "脏污水隔开，新鲜通风让小棚气味清新。", "他们压缩湿叶子，让蒸汽在冷盖上冷凝。"], ["他们打磨每个接缝，简化管子方便每天打理。", "他们净化灰水，滤掉汤渣给菜地用。", "他们不蒸馏饮用水，那种模式要更多热量和时间。", "第三个原型立在大门旁的轻木架上。", "每个方面都好看，只有一个阶段夜里还漏。", "老陈教学生操作水嘴，让早检更顺利。"], ["他们能转化沟水，供花坛使用。", "他们没改屋顶水道，只挪罐子收集雨水。", "黄昏时全组转动阀门，为口渴的根调水。", "他们调小螺丝，用粉笔标出滴水点。", "三天平静试验后读数又准又精。", "每个正确的配件都节水，每处改好的错误都教人细心。"], ["小失误暴露了左下接缝的细裂纹。", "欢迎回家的牌子鼓舞工人，微笑遮住小故障。", "李被松动的石头绊了一下，很快修好这个意外。", "在艰难情况下老海员仍是大家真正的先驱。", "没有大声的预言者许诺胜利，但和善的传令者夸他们稳。", "老人让梅管罐子做继承人，让兰管笔记做接班人。"], ["三代学生加入，一起写共用的姓氏名单。", "没人问性别，学生和配偶帮手任务一样。", "和善的老祖父和疲惫的岳父搬起重罐。", "每个兄弟姐妹带堂表亲每天午后刷瓶子。", "小侄子涛慢慢倒，侄女安娜高举漏斗。", "他们看豆胚醒来，像虚弱婴儿睁大眼睛。"], ["流浪小狗是个小孤儿，跟着每个少年帮手去棚里。", "每个年轻人都分面包，青春歌声让正午明亮。", "没有喧闹的帮伙挡路，青少年志愿者每天扫巷。", "明亮的青春期里他们学了很多，亲戚在旁帮忙。", "乡亲们停下看，远方亲戚寄来种子。", "夜里亲密的谈话变多，感谢米茶情意深。"], ["小莹是大家的心肝，给每位爱花人端凉茶。", "敬爱的林夫人老师夸接头整齐、双手沉稳。", "笑盈盈的女主人倒茶，严厉的女房东洗杯。", "院子的女主人和忙碌的家庭主妇一起拖地。", "苏寡妇缝布袋，手脚麻利的女仆冲罐子。", "首次试验通过，让疲惫的全家傍晚开心。"], ["有风趣的主持人带唱，每件讨厌的杂活都轻了。", "白发的房东借出棚子，新房客打扫干净。", "每位客人喝到干净茶，每位顾客都夸水清。", "害羞的客户提问，短暂相遇带来更多帮助。", "学生们修滴水时不追野狗，不误午饭。", "每次和评委约见后，梅都陪林走到门口。"], ["拄拐的小波仍靠人照顾，却敢提议更安全的水嘴。", "他们和街道的密切关系很甜，比短暂蜜月还长。", "团队没因吵闹离婚，大家守着同一个目标。", "梅独自管图表，其他人管好各自的罐子。", "每人记笔记，连北街疲惫的通勤叔叔也写。", "整街鼓掌，连茶铺严厉的老板也拍手。"], ["和善的主管夸干活，从不骂慢的下属帮手。", "兰选涛做搭档，不好意思为校演配鸽子。", "生病的同事问好，勇敢的伙伴中午送汤。", "老相识暖暖地笑，对忙碌的全组满是喜爱。", "好心的陌生人看了很久，加入做热切的学徒帮手。", "疲惫的副手向街上每个小英雄鞠躬。"], ["雨轻轻落在安静的屋顶，洗净了尘土小巷。", "戏剧社的勇敢女主角和害羞的女演员大声喝彩。", "严厉的大臣没来，退休的指挥官寄来暖心字条。", "集市的和善主任一直支持学生作品。", "集市委员会开了两次会，镇议会借出桌椅。", "他们选兰做代表，有南街的水专家指导。"], ["孩子们大笑，分着暖包子站在亮灯下。", "植物顾问和和善的兽医夸排水安全。", "学校辅导员微笑，公正的事务律师讲清规则。", "没有严厉的律师争辩，平静的裁判公平计时。", "商店忙碌的出纳和个子高的消防员在水嘴旁维持秩序。", "温柔的护士包好作痛的指关节，开朗的园丁种下新种子。"], ["晨阳晒干湿路，学生们又笑了。", "风趣的理发师答应赛后给获胜者免费剪发。", "老渔夫咧嘴笑，和善的屠夫分热包子。", "男孩们轻柔地给马梳毛，不再大喊吓人。", "多年辛苦劳作有了甜果，连穷乞丐也喝到清水。", "没人做口渴的奴隶，没懦夫不敢说真话。"]], "paraZh": ["周日爷爷讲述战争的起因与炮火，孩子们初闻战争之痛。", "火星与旧武器陈列无声，爷爷把战争遗物收进木箱。", "灯火旁的任务与刀剑琴弓，见证日子由武转文。", "头盔盾牌下纪念馆接待客人，昔日打斗永不再来。", "阴谋带来赤贫饥荒，夺粮追赶让人不忍回首。", "好斗喊声无法侵犯小屋，善良规则守护旧和平。", "枪声止息后智言劝止青年，农夫悄悄反抗损失。", "拒绝叛徒之后，证据消散恐惧，和平愿望强烈。", "走出恐惧的动荡聚会，教会人们为骄怒设限。", "老敌变挚友，巧谋蓝图与劝告化为助人力量。", "真力不在武力而在援手，日常善行带来巨变。", "远离野蛮与邪念，牺牲睡眠换来对死伤者的反思。", "墓园寂静海陆安眠，石阶之上和平在心中生长。", "军车不扰果园，风险灾难只留在 教训里。", "止息争吵干扰，退守妥协让出和平之路。", "抛弃口号与杂草，温柔书信迎来安静凯旋。", "纪念碑石碑旁荣誉长存，巡守化为友好守望。", "牡丹丛中再无障碍，老兵与孩子共享面包守望和平。", "小镇理工学院请机修工带学生为清水街道创新，立志参赛。", "老海员定下水域方向，基金支持下学生在院子里开工。", "工具量具齐备，学生测量计算，请老师评估改进。", "管子瓶罐搭起多用结构，光学观察加上传感显示。", "网络刻度盘加电脑喇叭，录音录像记录池塘试验。", "幻想化作动力，水泵电发齿轮运转，排水通风向好。", "打磨净化简化流程，原型架起，操作渐熟。", "调水调阀找滴水，读数变准，节水见效。", "小错小绊被修好，老海员带头传承分工。", "三代家庭齐上阵，祖父辈搬罐，孩子们学发豆芽。", "少年青年和乡亲亲戚围观帮忙，气氛亲热。", "女主人女房东烧茶管饭，首次试验全家开心。", "房东借棚待客，修修补补不误约见评委。", "拄拐小波也提议，全街鼓掌目标一致。", "主管搭档同事相识陌生人齐夸，小英雄受敬。", "戏剧喝彩加官方支持，选出代表继续冲刺。", "顾问律师裁判后勤到场，比赛有序又暖心。", "理发师渔夫屠夫庆功，辛苦换来清水和勇气。"], "subheads": ["上篇·纪念馆", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "下篇·发明比赛", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", " ste for tales beyond school walls.", "He kept a [[permanent:permanent]] desk by the window, arriving [[punctual:punctual]] each morning with washed hands.", "For the [[duration:duration]] of spring Lin read daily, finishing three [[consecutive:consecutive]] books without a break."], ["Anna checked his work [[periodically:periodically]], praising growth before the [[imminent:imminent]] birthday show at school.", "[[incidentally:Incidentally]] Lin met an old nurse there, who smiled at his strong firm steps forward."]], "sentZh": [["清晨利奥做一件好事，让自己习惯早起。", "他听到闹钟，学会快速反应、冷静回想昨天。", "利奥要忍受冷空气，为漫长的一天采用坚定的计划。", "温暖的早餐能滋养身体，爸爸帮忙修剪门前小草。", "利奥走到户外，呼出白气，查看每日饮食摄入计划。", "一杯热牛奶能恢复他疲惫的头脑，让他度过忙碌的早晨。"], ["低矮的阳光有些刺眼，但利奥很快瞥见了公交车。", "利奥快速看一眼手表，又向长路尽头张望一下。", "他目光稳定地看着路面，努力透过清晨小雨凝视。", "他没有盯着手机，而是开始思考温暖的学习目标。", "利奥立下安静的誓言，心中记着小小的誓约今天努力。", "他做出准时的坚定保证，一个吹口哨的路人微笑走过。"], ["利奥会回复妈妈，并通知朋友公交晚点了。", "他喜欢清楚地主张想法，再冷静解释公交延误。", "两个男孩大声争吵，但司机很快制止了小纠纷。", "短暂的争论后，利奥必须加快脚步跑到校门。", "一位和善的门卫似乎催他快跑，没有因迟到责骂他。", "利奥不会咒骂坏运气，也不会对拥堵交通发誓抱怨。"], ["粗鲁的喊声可能激起怒气，老师只想宣讲耐心。", "利奥不吹嘘分数，也不取笑疲惫的同学。", "没人会嘲笑他的口音，很多朋友会为他的短发言鼓掌。", "同学们大声喝彩他的努力，利奥努力抓住每个有用单词。", "他不抢别人的书，也不从共享书桌上抓笔。", "利奥想超过过去的自己，牢牢把握住日常习惯。"], ["他清理书桌上的杂乱，学着安静地拧开盖子。", "他不会把纸撒得到处都是，课后会把每张纸条折好。", "利奥会系紧书包带，再慢慢放松僵硬的肩膀。", "他不会因怒气砸桌子，也不会用笔划伤墙面。", "他帮忙刮掉鞋上的泥，帮忙擦亮旧教室的窗户。", "他们会平分清洁任务，树在窗外轻轻摇摆。"], ["他的手机开始轻轻振动，灰尘似乎在暖光中打转。", "风扇叶片在上方慢慢旋转，利奥觉得想法在疲惫的脑中打转。", "学生们午饭时拖着脚走，但在窄走廊里没有相撞。", "利奥喜欢把米饭和蔬菜搭配，把水果融入午餐。", "好闻的食物香似乎弥漫大厅，穿透他昏昏欲睡的午后心情。", "他会快速插入饭卡，扶稳餐盘保持平衡。"], ["午饭后朋友们一起拖着球包，沿着尘土飞扬的小路去球场。", "他们帮忙把标志桶摆成直线，学着很好地操控球。", "教练教利奥控制跑位，任汗水浸透他的球衣。", "没人想拿比赛打赌，也不想放学后拿自尊冒险。", "他们不会拿安全赌博，只公平约定干净比赛。", "快节奏比赛总能吸引很多学生，但利奥不执着于比分。"], ["流畅的动作能迷住小球迷，但投丢就像短暂的噩梦。", "利奥能用传球惊艳全队，他们惊叹他灵活的脚步。", "他的跳跃能震惊高个对手，让每个朋友都加入欢呼。", "坏判罚可能惹恼疲惫的队员，但不能破坏友好心情。", "奇怪的规则会让新手困惑，这就是街头比赛的小讽刺。", "利奥讨厌作弊的耻辱，鄙视粗鲁的犯规。"], ["他不会对训练规则疏忽，也不会无视教练的声音。", "不懂规则还上场显露偏见，常带来无谓犯规。", "利奥不会偏离公平竞赛，否则会被下令罚出。", "他不会从强对手面前逃跑，也不欺负球场上更小的孩子。", "最后几秒会带来恐慌，但大喊不应吓到小队员。", "对上次失利的复仇想法夺不走他冷静友好的情绪。"], ["没人能劫持快乐的比赛，也不能把坏情绪偷运进队伍。", "公正的裁判会给故事里的作弊者定罪，压力却想扼杀愉悦。", "那不是比分的大屠杀，只是对旧恐惧的公平削减。", "教练可能介入阻止打架，那些打架会阻碍团队精神。", "胜利很有诱惑，但甜言只是诱饵，让粗心少年上当。", "善意的欢呼能诱发新能量，绝不会诱惑队员耍坏。"], ["赛后老师会指定阅读区，布置夜读页数。", "帮手会分发干净的练习纸，快速发送消息给晚到的队友。", "利奥学着摆脱手机噪音，挽回懒散习惯的损害。", "他不会用谎言掩饰低分，也不向老师隐瞒弱点。", "利奥不会拒绝难任务，也不会把慢朋友排除出学习小组。", "他想扭转弱成绩，用稳定进步让妈妈放心。"], ["利奥会承担额外的听力训练，训练明确规定每日时限。", "好成绩能说服爸爸，安慰家里担心的亲人。", "利奥学着志向高远，控制对游戏和手机的狂热渴望。", "他似乎渴望广博知识，常引用过去的伟大例子。", "内心对进步的渴望推动每次对难题听力的尝试。", "利奥每晚都会努力，慢慢完成每周学习计划。"], ["大考在六月临近前，他会按主题整理新单词。", "利奥会启动新的复习循环，从简单的听力开始。", "他会利用免费图书馆时间，勇敢探索难的学术文章。", "利奥必须付出稳定努力，每晚攻克长阅读段落。", "他学着应对压力，善意处理掉旧无用笔记。", "利奥会做短计时训练，从不遗漏单词表里的生词。"], ["他会快速擦掉错误答案，从过去错误中抢救有用想法。", "利奥不会靠长午睡逃避，而用短散步恢复体力。", "热茶能恢复平静专注，帮助纠正小语法错误。", "额外练习能赎回懒散的日子，弥补拼写弱点。", "新鲜水果能补充能量，帮他获得稳定的夜读专注。", "图书馆能提供安静书桌，提供温暖灯光供长时间阅读。"], ["家教能把难课讲简单，把小进步放大成大收获。", "图片能增加枯燥课文的可读性，放大疲惫双眼前的小细节。", "话筒能放大轻声音，但老师从不夸大小学生的错误。", "利奥不会把短休息拖太长，但会坚持严格作息。", "存下的笔记是强大后盾，能推动利奥冲向更高分。", "利奥每晚会更新单词表，慢慢提高模考分数。"], ["雨可能从旧窗漏进来，把冷水洒在木桌上。", "潮气能从缝隙渗入，让旧漆泛潮发出霉味。", "学生不用疏散大厅，但要避开门口泥泞的壕沟。", "大雨能很快浸透鞋子，这是稍晚到的合理借口。", "老师会原谅迟到的脚步，帮年轻的心容纳担忧和惊恐。", "利奥对保洁员深怀敬意，从不用谎言奉承老师。"], ["他不盲目崇拜高分，也不为狭隘的事业而战。", "为了家人的爱，利奥保持清晰的学习目标。", "每个小目标都能慢慢唤起他疲惫心中的新希望。", "低分可能触发担忧，但利奥仍会寻求明智帮助。", "他能快速找回旧笔记，让结果证明努力。", "利奥会检查两遍答案，清楚写明每项任务时间。"], ["好书能启发年轻的心，温暖地传授永恒的学习技巧。", "努力的人真正值得好分数，夜里从不让专注掉线。", "利奥不会让希望下沉，也不会让分数因懒夜暴跌。", "他学着隔住手机噪音，不让压力盖过平静思考。", "黎明他会问候妈妈，自豪地向晨旗敬礼。", "老师会祝贺他的进步，长辈会祝福他勇敢的路。"], ["利奥想参加比赛，再向恐惧温暖告别。", "他会按颜色整理笔记，让答案和问题 хорошо 对应。", "老师按规则和善一致行动，把进步归功于稳定努力。", "利奥能很好记起早晨单词，安静回想晚间语法。", "短卡片能提醒他短语，他能简单复述故事。", "利奥会大声重复重点句子，写下平静的夜晚回顾。"], ["稳定习惯能给严格评委留下印象，帮利奥克服期末恐惧。", "小失败不必羞辱年轻的心，平静希望能弥漫房间。", "利奥会用书代替无聊手机时间，睡眠无可替代。", "他学着区分主要观点，清楚辨别事实和看法。", "利奥习惯前倾听讲，从不懒散后靠。", "最后利奥侧身对月亮微笑，怀着希望睡去。"], ["奶奶很快发了脾气，但在家里说话方式很温柔。", "她平静的态度向我们大家展现了她温暖善良的个性。", "耐心是她最好的特点，善良是她一生中最大的美德。", "她的微笑是一个特别的特征，虽然年纪大了她的身形有点弯。", "她说柔弱的肉体是全人类生活的一部分。", "医生说她腿部的骨头有点软，因为爷爷是这个家的中坚。"], ["墙上的挂图很清楚地展示了完整的骨架和圆圆的头骨。", "强壮的大脑需要好的睡眠，平静的心需要每天的爱。", "奶奶既需要身体上的照顾，也需要家人温暖的心理支持。", "护士用轻柔的手摸了摸她发红的脸颊和发热的前额。", "那天早晨汗珠挂在她的额头上，泪水挂在她长长的睫毛上。", "她咬着干燥的嘴唇，要求在房间里多留些呼吸的空间。"], ["她伸出舌头，医生很快深深看了看她发红的喉咙。", "她住在绿色峡谷附近，抬起小小的下巴大声回答。", "她僵硬的下巴有点疼，于是慢慢把长长的脖子左右活动。", "爷爷摸着花白的胡须，把手轻轻放在她颤抖的肩膀上。", "她缓慢的肢体感觉沉重，把酸痛的肘部靠在桌边休息。", "护士握着她细细的手腕，按了按她小小的拇指测试力气。"], ["奶奶张开温暖的手掌，用一根颤抖的手指指着挂图。", "第一项检查是用黑管子听她宽宽的胸部。", "接着医生按了按她柔软的腹部，一个一个数她下面的肋骨。", "他在她细细的腰上系了带子，用回声波扫描每个内部器官。", "他说她和善的肝脏看起来很好，但空空的胃每天需要热饭。", "多年前她的子宫孕育了妈妈，现在一个肾工作得有点慢。"], ["她左边的肺听起来有点沉，一个小腺体摸起来比以前大。", "扫描清楚显示了一个温暖的腔，食物正慢慢穿过长长的肠。", "她揉着粗粗的大腿，弯曲每个僵硬的关节给我们看疼在哪里。", "一条暖毯盖在她的大腿上，遮住我们小队看不见的粗粗的脚踝。", "她抬起酸痛的脚后跟，动动每个小脚趾逗我们笑。", "每块瘦肌肉都需要每天散步，每个小毛孔也需要新鲜空气。"], ["护士摸着她缓慢的脉搏，说每条红红的动脉都很好地送血。", "每根细神经传送快速信号，每种小激素影响情绪起伏。", "强大的免疫防线需要像晨间一起散步这样温和的刺激。", "去年春天她的睡眠节律变了，可怜的视力让她看书困难。", "视觉表很简单，每个字母从远处都能清楚看见。", "她的回答很含糊，并不愚蠢，只是她在陌生人面前害羞。"], ["听觉测试很顺利，快速的牙科检查也显示牙齿很干净。", "她十点前都醒着，晚上从不掩饰大大的哈欠。", "中午短短的小睡帮她休息，但她晚饭后从不喜欢打盹。", "她喜欢中午安静的房间，因为刺耳的噪音会毁掉她的白天休息。", "她害怕变得瘸腿，但高大的树会让旁边的小草显得矮小。", "妈妈回忆起当年怀孕的日子，爸爸曾开玩笑说起一只薄避孕套。"], ["医生在血液里没发现克隆问题，但认真记下每个小症状。", "扫描没显示严重疾病，但轻微的小病让她夜里咳嗽。", "她从不发出呻吟，虽然轻微感染让她冒冷汗。", "吸烟是对呼吸的明显损害，摔一跤会留下断裂的手臂。", "高糖会毁掉日常生活，让强壮的人几周都像病人一样虚弱。", "作为平静的病人，她详细告诉护士她的睡眠障碍。"], ["今天没有糖尿病的迹象，也没有让护士担心的肥胖迹象。", "她一点也不超重，虽然轻微高血压需要每天检查。", "惊恐会让老人身体瘫痪，让她几小时都昏昏沉沉。", "担忧不是发疯，但长期失眠会偷走她的夜晚休息。", "她没有食物过敏，扫描显示现在没有心脏病发作风险。", "检测没有癌症痕迹，虽然轻微关节炎让她的手有点僵。"], ["她鼻子上的小粉刺消了，医生也没看到任何中风迹象。", "今天没有瘟疫在街上走，只有轻微流感每个冬天来访。", "她轻微的发烧昨夜退了，沉闷的头疼也随着晨茶走了。", "她的脚没有再肿，干饭吃饭时也从不让她噎住。", "一滑会伤到走路的老人，所以雨天我们防着任何受伤。", "她摔倒可能会弄伤自己，但她的皮肤现在不常流血。"], ["她手臂上的黑瘀青淡了，只留下一道细白疤痕。", "我们轻轻清理每个小伤口，怕她里面有深创伤。", "她手臂上没长硬肿块，散步时也没感到刺痛。", "我们在家从不谈死亡，因为每个会死去的生命都很珍贵。", "我们不惧悲伤的离世，也不每天等着阴郁的厄运。", "没有致命的撞车碰到我们的街，也没有致命的烟进入我们的家。"], ["诊所好好保存每份尸体记录，告诫老员工别每天无聊过度劳累。", "长楼梯让她双腿疲惫，冒烟的公交让她早晨呼吸费力。", "午饭后有轻微疲劳，但她散步时从不开始昏倒。", "昨天她的脚步很虚弱，久等让她疲倦又苍白。", "饥饿很快让她手臂无力，冷椅子让她的脊柱不舒服。", "她以前从没昏迷过，虽然慢性咳嗽留了几个月。"], ["现在没有急性咳嗽烦她，雨后手臂只有轻微酸痛感。", "我们用微笑藏起悲伤，少把痛苦讲给奶奶听。", "家里现在没有悲伤哀叹，只有音乐作每天早晨的治疗。", "好的医疗保健从家开始，每天保持干净卫生习惯。", "热汤夜里有治愈力，每天讲卫生让感冒走开。", "我们和善的内科医生每周打电话，年轻外科医生也看她的片子。"], ["她现在不需要大手术，休息和饭会慢慢治好她。", "时间会轻轻愈合她的咳嗽，短短的处方列着两种淡茶。", "她完全不需要皮肤移植，今年也不需要长长的注射。", "作为明智的预防，诊所春天会给全家接种疫苗。", "我们从不需要隔离奶奶，也不把她的饭菜分开。", "我们从不把她孤立在房里，街角药房每天送茶来。"], ["她每天的药吃着甜，蜜茶也是她晚上的良方。", "她架上现在没有烈性药，只有一小粒药片配温水。", "医生拒绝用抗生素帮治感冒，一次选了轻柔针灸代替。", "今天不需要青霉素针，也没有烈性吗啡让她笑容变暗淡。", "每小剂量都紧跟时钟，一天天带着她慢慢康复。", "晨走让她的脸重新焕发精神，给大家带来甜甜的宽慰。"], ["轻柔的歌在黄昏减轻她的担忧，暖浴缓解她腿疼。", "热茶夜里能缓解她的咳嗽，帮她身体在柔光下放松。", "她的睡眠又正常了，笑容在晚餐桌边很常见。", "我们照常早饭后开始散步，奶奶每次都感到明亮乐观。", "现在没人悲观，每个小胜利都给家带来积极欢乐。"], ["久病卧床后，天色灰暗低垂时，林感到消极又被动。", "妹妹梅对慢走依然热情，但林对明朗的春日空气漠不关心。", "他通话时回答冷漠，说腿软只是可以忽略的小问题。", "后来奶奶的热汤，给他疲惫的心带来柔软的幸福和安静的喜悦。", "欢乐的邻家男孩讲短笑话，清脆的笑声洒满小小向阳的会客室。", "林重新感到纯粹的喜悦，全家人含着温暖的眼泪微笑，似乎都在欢庆。"], ["湖边短短一走，带来柔柔的兴奋和久违的舒心平静。", "凉空气似乎让他肺部振奋，长休之后的第一步走得令人满意。", "缓慢的进步让他觉得称心，他也渴望每个明朗早晨学点新本领。", "他带着新鲜的热情读旧书，加入公园边小小而有活力的小组。", "他们可爱的老师安娜笑容明亮，林也喜欢上她柔和的故事和歌。", "她偏爱慢学的孩子，这在灰色日子里给了林意外之喜。"], ["礼堂的锣鼓声已不再让他受惊，虽然虚弱时大嗓门曾让他震惊。", "他告别从前紧张忙碌的工作节奏，选了留有休息和读书时间的开明计划。", "陈叔叔大方地送米送书，每次来都用低柔温和的声音说话。", "林对小小进步保持谦逊，用朴素的本子记下每天的步数和饭食。", "本在午饭时讲幽默故事，林则礼貌地笑着亮出酒窝作答。", "梅对林一向坦率，墙上旧地图则显得神秘有趣，值得研究。"], ["林对星星渐生好奇，也有勇气在课上大胆问难。", "父亲夸他有男子气概，坚持走路，又给了直接清楚的安全呼吸法。", "林一脸认真，保证每天练习，话语里带着简单的诚实和暖意。", "梅为他缓慢的成长感到自豪，又帮他列了饮食睡眠的理性清单。", "他每个晴晨都认真训练，公园管理员总留好舒适的长椅给他休息。", "他喜欢浪漫的河流之歌，独行时感到自由和轻盈的空气。"], ["小胜利建起他的信心，他在楼梯上对老邻居也更体贴了。", "安娜在页边写下体贴的批注，林走得慢时同学也报以同情。", "摔倒后医生给了温柔的仁慈，林也开始敬佩长夜值班的护士。", "他画的湖泊生日小画很出色，手指稳定让他深怀感激。", "他给安娜写了感谢信，说渴望开启新的学习之年。", "医生说他的肺很健康，风景如画的小路也适合他天天走。"], ["这个春天他的成绩很有希望，安娜把他的作文贴在墙上显眼处。", "诊所屋顶望见的山景令人惊叹，虽然去年冬天爬楼十分艰辛。", "林走完一段难走的楼梯，腿脚比阴雨周时更加强健。", "他买了结实的走路鞋，梅不论刮风下细雨都坚定陪在身边。", "奶奶煮了软烂的嫩菜，饭食温和清淡，顾着他弱弱的胃。", "他的纸鸟精致漂亮，把平淡的灰色午后变成孩子的游戏。"], ["最初的问题显得天真孩子气，但安娜夸他有勇气多学。", "林对帮工露出真诚微笑，知道软膝在湿石上还容易打滑。", "本是值得信赖的学友，还提了个进取的计划去卖纸鸟。", "林保持理智的睡眠时间，避开熬夜的繁重任务，免得脸色苍白。", "安娜定了严格的阅读目标，安静自习时手机管理也很严。", "冬天的咳嗽曾很严重，但春天里林和老友互相帮助。"], ["他的速写开始像真树，线条和安娜旧书上的相似。", "湖边小路每天早晨都熟悉，即使早春风里树还光秃。", "林光脚踩暖沙，喜欢高苇后那片安静私密的平静。", "他对旋律的直觉渐强，为奶奶生日即兴唱了首柔歌。", "安娜的夸奖藏着含蓄的推力，不是让人一夜成功的假象。", "林画了座想象中的绿岛，孩子们喜欢他的亮纸船和漂亮小旗。"], ["他不再怨命运让自己生病，而感谢好运和家人满满的照顾。", "腿上的剧痛已缓，但他记得卧床孤独日子的深深悲伤。", "他不久悲输掉的比赛，不愿在朋友等待时闷闷不乐。", "诊所旧时的警报曾带来剧烈痛苦，音乐却软化了雨午的旧悲伤。", "阴沉灰日里，林不愿让安娜失望，慢慢写完一页。", "冷雨浇不灭他，虽有次湿鞋让他觉得惨兮兮又疲惫。"], ["错过比赛令人沮丧，但林不为河边丢掉的进球哀悼。", "对康复太慢的怒气已散，他不再为错过的春游大怒。", "安娜平静的微笑抚平他的皱眉，教他不带闷怒地等。", "吵闹的公交不再惹他烦，他也不恨楼梯上的慢进步。", "他放下对久等的憎恨，把飞虫只当小麻烦而非大事。", "苦汤没让他露出厌恶，晚点公交也没扰乱他的平和。"], ["他请孩子们别骚扰弱鸭，也别打扰墙边睡的老猫。", "雨后泥鞋很麻烦，但远不如卧床孤独周那样糟糕。", "连难受的取药长队也走得快，尽管寒风拍打诊所窗。", "如今没邻居面带敌意，短队等待也没让他气愤。", "安娜开了份大胆的新书单，不是一周十本的疯狂赶读。", "湿石上的疯狂野游戏被禁，伤小孩子的恶毒玩笑也不许。"], ["流浪狗没露出凶恶撕咬，男孩们也不在静湖对岸骂粗话。", "没小孩写刻薄纸条，林也用家务管住渐涨的小我。", "他拒了独吞颜料的自私念头，不对慢搭档说难听话。", "林避开冒失冲过马路，陡坡后先稳住起伏不定的呼吸。", "奇怪的梦天亮即散，深夜的过量零食也戒了，睡得好。", "对考试的旧焦虑回来，让林坐在椅上坐立难安到中午。"], ["长演讲前他紧张不安，但用慢呼吸直面朗读的旧恐惧。", "从前胆小的男孩如今不大惊小怪，笑着门口迎客。", "他从不对慢跑者扔侮辱的话，也不学大男孩的刻薄顺口溜。", "林不嫉妒游得快的孩子，也不眼红好友得的奖。", "对数字的旧怀疑散了，看老师的眼光也没了阴暗猜疑。", "起初林怀疑网课，把杂音大当不合格的学习门槛。"], ["旧椅子摇晃不稳，暗角也不适合深夜读书。", "林帮奶奶从不推辞，虽有次不愿洗绿菜。", "他分面包从不犹豫，只在吃了最后一甜包时有点内疚。", "响亮的嗝曾让他在课上尴尬，小失误却没让他深深后悔。", "林会为失言快快忏悔，若伤了梅柔软的心更觉羞愧。", "他对旧照片轻轻叹气，但保证不再独自台阶上哭泣。"], ["安娜教孩子安静包容慢读者，治好林对新同学的无知偏见。", "林学会忍受长长的康复走，路过偷热奶的狡猾小猫。", "故事里的狐狸看起来狡猾机灵，游戏规则也从不随意松散。", "安娜屋里没问题显得可笑，黑板上也没错误显得愚蠢。", "第一支舞步别扭笨拙，但音乐轻轻托着他滑过地板。", "林不再把书粗心丢在雨里，也不再无视公园上空的湿云。"], ["淘气的小狗天天咬拖鞋，吃饭时却从不贪心。", "诊所边的喇叭声很突兀，懒洋洋的午后渐渐变成快走。", "林甩掉懒洋洋的晨意，跟着去河边画画的明亮冲动走。", "旧的死板时刻表松了，奶奶却固执地坚持饭后热茶。", "林打破弱病人的刻板印象，每月在诊所大厅分享画。", "诊所每季度办读书秀，明朗春天还有盛大年会。"], ["林每年的复查正逢生日周，看病变成新生的欢乐周年。", "学习的新时代开始了，林送安娜绿纸包的小礼物。", "他们读当代城市故事和中世纪短歌谣，遥望远山。", "老师讲千年变迁，小小百万步也在塑造城镇。", "她先展示十亿星空沙漠照，又分一打暖包子给孩子。", "黎明时林在水边慢跑，正午又在高大荫树下休息。"], ["午夜没有点灯夜读，夜雨却轻轻落在铁皮屋顶过夜。", "每晚林早早合书，英文笔记保持最新整齐，等着上课。", "他立刻回安娜，珍惜长静后每瞬夸奖。", "凭素描的老底子，林帮一位老病友在湖边画鸟。", "过去一周他天天读，为镇上新学者立了好先例。", "最重要的课是耐心，开篇第一页是日出时的静湖。"], ["起初林进初级组，后来搬到故事更长的中级书架。", "考试正中林很平静，散步与饭之间的空隙读诗。", "与此同时梅在附近学吉他，鼓笛齐鸣响满傍晚的大厅。", "林加入长期读书会，养成校园墙外持久的书香爱好。", "窗边有了固定书桌，每天早晨准时到，洗净手。", "整个春天林天天读，连着三本不断。"], ["安娜定期查作业，生日演出临近前夸他长大。", "顺便说，林在那里遇见老护士，她笑看他坚实的步伐向前。"]], "paraZh": ["清晨起床，利奥做好准备迎接忙碌的一天。", "赶公交上学，利奥立志今天准时努力。", "一路波折后利奥赶到学校，学会冷静有礼。", "课堂上利奥专注听讲，养成良好的学习习惯。", "课间打扫整理，利奥爱护教室环境。", "午饭时间安静有序，利奥好好吃饭休息。", "午后去球场，约定公平干净地比赛。", "球赛激烈但友好，利奥享受团队快乐。", "坚持公平竞赛，利奥不怕强手不欺弱小。", "比赛圆满团结，欢呼带来正能量。", "赛后转入夜读，老师布置任务立新规。", "利奥立志高远，用计划安慰家人。", "启动复习循环，利奥认真攻克听说读写。", "查漏补缺攒能量，图书馆安静陪伴夜读。", "巧用方法放大进步，坚持作息稳步提分。", "夜雨晚自习，师生互敬互谅。", "目标清晰心态正，利奥踏实求助向前。", "夜读收获祝福，感恩中继续坚持。", "整理归纳告别恐惧，利奥越记越牢。", "克服恐惧明辨笃行，利奥怀着希望安然入睡。",   let streak = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);

  const el = document.querySelector(`.w[data-w="${CSS.escape(k)}"]`);
  if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    const sent = el.closest('.sent');
    if (sent) { sent.classList.add('playing'); setTimeout(() => sent.classList.remove('playing'), 1200); }
    el.style.background = 'var(--hl)'; setTimeout(() => el.style.background = '', 1200); }
}

/* ============ 键盘 ============ */
function visibleCards() { return [...document.querySelectorAll('#vlist .item')]; }
function cardNav(d) {
  const cards = visibleCards();
  if (!cards.length) return;
  let i = cards.findIndex(el => el.classList.contains('sel'));
  i = i < 0 ? (d > 0 ? 0 : cards.length - 1) : Math.max(0, Math.min(cards.length - 1, i + d));
  cards.forEach(el => el.classList.remove('sel'));
  cards[i].classList.add('sel');
  cards[i].scrollIntoView({ block: 'nearest' });
}
function cardSpeakSel() {
  const sel = document.querySelector('#vlist .item.sel') || document.querySelector('#vlist .item');
  if (sel) { sel.classList.add('sel'); jumpWord(sel.dataset.k, sel.dataset.d); }
}
document.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) {
    if (e.target.id === 'q') {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cardNav(e.key === 'ArrowDown' ? 1 : -1); }
      else if (e.key === 'Enter') { e.preventDefault(); cardSpeakSel(); }
      else if (e.key === 'Escape') e.target.blur();
    }
    return;
  }
  if (e.code === 'Space' && e.target.tagName === 'BUTTON') return; // 按钮聚焦时走原生空格点击，避免双重触发
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'Escape') { pop.style.display = 'none'; const cp = document.getElementById('cloudPop'); if (cp) cp.style.display = 'none'; const jp = document.getElementById('jumpPop'); if (jp) jp.style.display = 'none'; const mp = document.getElementById('markPop'); if (mp) mp.style.display = 'none'; }
});

/* ============ 进度存档 + 手动书签 ============ */
function savePos() {
  try { localStorage.setItem('ielts-pos', JSON.stringify({ i: idx, t: Date.now() })); } catch (e) {}
}
function loadPos() {
  try {
    const o = JSON.parse(localStorage.getItem('ielts-pos') || 'null');
    if (o && Number.isInteger(o.i) && o.i >= 0 && o.i < sents.length) {
      idx = o.i; paint(); syncSeek(idx);
      const el = sents[idx];
      if (el) setTimeout(() => el.scrollIntoView({ block: 'center' }), 60);
    }
  } catch (e) {}
}
function getMarks() { try { return JSON.parse(localStorage.getItem('ielts-marks') || '[]'); } catch (e) { return []; } }
function setMarks(m) { try { localStorage.setItem('ielts-marks', JSON.stringify((m || []).slice(0, 50))); } catch (e) {} }
function markLabel(i) {
  const ai = artOfSent[i];
  if (ai === undefined) return `全文第${i + 1}句`;
  const [s0, e0] = segRange(ai);
  return `第${ai + 1}章第${i - s0 + 1}句 · 全文${i + 1}/${sents.length}`;
}
function addMark() {
  const at = idx >= 0 ? idx : 0;
  const d = new Date();
  const ts = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const m = getMarks().filter(x => x && x.i !== at);
  m.unshift({ i: at, t: ts });
  setMarks(m); renderMarks();
}
function delMark(i) { setMarks(getMarks().filter(x => x && x.i !== i)); renderMarks(); }
function renderMarks() {
  const list = document.getElementById('markList');
  if (!list) return;
  const m = getMarks().filter(x => x && Number.isInteger(x.i) && x.i >= 0 && x.i < sents.length);
  list.innerHTML = m.length ? m.map(x =>
    `<div class="mitem"><div><div class="mt">${esc(markLabel(x.i))}</div><div class="ms">${esc(x.t || '')}</div></div>` +
    `<button class="btn play" onclick="jumpMark(${x.i})">直达</button>` +
    `<button class="btn" onclick="delMark(${x.i})">删</button></div>`).join('')
    : '<div style="font-size:12px;color:var(--muted)">还没有书签，先点“记下当前位置”。</div>';
}
function jumpMark(i) { toggleMarkPop(false); playFrom(Math.max(0, Math.min(sents.length - 1, i))); }
function toggleMarkPop(force) {
  const p = document.getElementById('markPop');
  if (!p) return;
  const show = force !== undefined ? force : p.style.display !== 'block';
  if (show) { renderMarks(); p.style.display = 'block'; }
  else p.style.display = 'none';
}
window.addEventListener('pagehide', savePos);
document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(); });

/* 移动端词库抽屉：下滑关闭手势 */
(function() {
  const panel = document.getElementById('panel');
  if (!panel) return;
  let startY = 0, dragging = false;
  panel.addEventListener('touchstart', e => {
    if (!window.matchMedia('(max-width: 700px)').matches) return;
    if (e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    dragging = true;
  }, { passive: true });
  panel.addEventListener('touchmove', e => {
    if (!dragging) return;
  }, { passive: true });
  panel.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    const dy = (e.changedTouches[0] || {}).clientY - startY;
    if (dy > 60) togglePanel();
  }, { passive: true });
})();
render(); renderList(); loadVoices(); bindSeek(); loadPos();
function mobileBtnIcons() { // 移动端播放条：确保图标在窄屏下正常显示，不再替换文字
  const btns = document.querySelectorAll('.audiobar .btn');
  btns.forEach(btn => {
    btn.style.minWidth = '0';
    btn.style.flex = '0 0 auto';
    // 确保图标可见：保留文字但通过行高控制
    const icon = btn.querySelector('i');
    if (icon) { icon.style.fontSize = '14px'; }
  });
}
mobileBtnIcons();
function stickAnchors() { // 移动端锚点吸顶：top 取顶栏实高，滑到哪跟到哪
  try {
    if (!window.matchMedia('(max-width: 700px)').matches) return;
    const tb = document.querySelector('.topbar');
    const nav = document.getElementById('anchors');
    if (tb && nav) nav.style.top = tb.getBoundingClientRect().height + 'px';
  } catch (e) {}
}
stickAnchors();
window.addEventListener('orientationchange', () => setTimeout(stickAnchors, 300));
setTimeout(stickAnchors, 600);
let _rzT = false;
window.addEventListener('resize', () => {
  if (_rzT) return; _rzT = true;
  requestAnimationFrame(() => { _rzT = false; mobileBtnIcons(); stickAnchors(); });
});
if (typeof CLOUD !== 'undefined') CLOUD.boot();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => loadVoices());
setTimeout(loadVoices, 500);
</script>
