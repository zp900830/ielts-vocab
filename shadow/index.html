         补考是"挂在同一份清单后面"，不是另开一条流程：quizN / quizCursor / quizPaceLeft / 进度条
         因此天然把补考算进同一份账（分子分母同一份，不会看到 3/2）。批次快照本身没动 ——
         补考题出自 ① 开始时快照的那批，绝不反查滚动队列。 */
      function quizList() {
        const base = batchItems.filter(x => x.pass === pass);
        return (pass >= 2 && retakeItems.length) ? base.concat(retakeItems) : base;
      }
      /* 一趟 ② 的全部计数器。进模式 / setPass / ①→② 三处都要重置，
         少清一样（比如补考清单）就会把上一遍错过的词带进这一遍。 */
      function resetQuizRun() {
        quizCursor = 0; quizWrongN = 0; quizAnsweredN = 0; reveal = null;
        retakeItems = []; retakeServedN = 0; retakeOkN = 0;
      }
      /* 「这一题之后还有没有题」要跳过出不了题的项（ensureCursor 干的活），
         光看数组长度会把末题写成「下一题」，点下去却弹出小结。 */
      function hasNextQuiz() {
        const list = quizList();
        for (let n = quizCursor + 1; n < list.length; n++) if (buildQuiz(list[n])) return true;
        return false;
      }
      function ensureCursor() {
        const list = quizList();
        while (quizCursor < list.length && !buildQuiz(list[quizCursor])) quizCursor++;
        return quizCursor < list.length ? buildQuiz(list[quizCursor]) : null;
      }
      function currentQuiz() { return ensureCursor(); }
      /* 两步制：只有 ① 通读 与 ② 挖空选择。旧的第三步（③ 选义）整步删除，
         setPass(3) 这种历史调用一律折回 ②，不许再开出第三步。 */
      function setPass(n) {
        pass = (n === 1 ? 1 : 2); resetQuizRun();
        quizStart = (pass === 2 ? Date.now() : 0);
        renderQuiz(); updateTaskBar(); syncQueueFromPlan(); updateMarkers();
      }
      function answerQuiz(choice) {
        const item = quizList()[quizCursor];
        const q = buildQuiz(item);
        if (!q || reveal) return false;
        // 「回看句子」可能还在播；答题先把声音收掉，否则下一题还压着上一句的朗读
        try { playing = false; speakToken++; speechSynthesis.cancel(); } catch (e) {}
        const ok = String(choice).trim().toLowerCase() === String(q.answer).trim().toLowerCase();
        push2(ShadowPlan.mkQuiz(q.w, item.s, q.kind, ok, Date.now(), day2()));
        quizAnsweredN++;
        item.tries = (item.tries || 0) + 1;
        if (item.tries > 1) {          // 补考那一遍：只统计结果，不再进清单 —— 补考只一轮，收工才有尽头
          retakeServedN++; if (ok) retakeOkN++;
        } else if (!ok) {
          quizWrongN++;                // 「错 N」= 这一遍错过的题数：同一个词补考再错不双记
          /* 补考那份是**拷贝**，不是原题对象：共享 built 缓存会把原题那道（连选项顺序一起）
             直接端回来，换序就成了空话。tries 跟着拷过来 = 1，所以补考这一答必然走上面
             那条 tries > 1 的分支 —— 只补一次这条不靠数组去重，靠的是这一格。 */
          retakeItems.push(Object.assign({}, item, { retake: true, built: undefined }));
        }
        reveal = { q: q, s: item.s, ok: ok, pick: choice };
        renderQuiz(); updateTaskBar();
        return ok;
      }
      /* 推进只有一处实现：任务条那颗（唯一的推进按钮）、键盘 → 、「这题有问题」都调这里。
         补考题挂在 quizList() 末尾，所以这里不必知道补考存在 —— 游标自然走进那一段。 */
      function nextQuiz() {
        reveal = null; quizCursor++;
        if (!currentQuiz()) finishPass(pass);
        else { renderQuiz(); updateTaskBar(); }
      }
      function flagQuiz() {
        const item = quizList()[quizCursor], q = buildQuiz(item);
        if (!q) return;
        push2({ type: 'flag', w: q.w, s: item.s, kind: q.kind, opts: q.opts || null, ts: Date.now(), day: day2() });
        showAbToast('已记下：这题有问题 —— 它会停止出现，等裁决后再放回');
        nextQuiz();
      }
      function finishPass(n) {
        renderPassSummary(n);
        if (n === 1) { pass = 2; resetQuizRun(); quizStart = Date.now(); }
        else { taskFinished = true; pass = 2; }
        _cachedPlan = null;
        updateTaskBar();
      }
      function startSummaryContinue() {
        if (taskFinished) { hideCard(); updateTaskBar(); return; }
        hideCard();
        if (pass === 2) { if (!currentQuiz()) { finishPass(2); return; } renderQuiz(); updateTaskBar(); }
        else { goToNextTask(true); }
      }
      function hideCard() { const el = document.getElementById('taskCard'); if (el) { el.hidden = true; el.innerHTML = ''; } }
      function advance() {
        if (taskFinished) return;
        if (pass === 1) { goToNextTask(true); return; }
        if (reveal) nextQuiz();
      }
      function syncCardBottom() {
        const bar = document.getElementById('taskBar'), ab = document.querySelector('.audiobar');
        // 做题态播放条不再消失，所以做题卡永远要给两条都让位
        const h = (bar ? bar.offsetHeight : 62) + (ab ? ab.offsetHeight + 8 : 64) + 10;
        document.documentElement.style.setProperty('--task-card-b', h + 'px');
      }
      function syncQueueFromPlan() {
        if (!ROOT2 || !ROOT2.plan) return;
        todayQueue = todayPlan().queue.map(q => ({ i: q.i, type: q.pool === 'C' ? 'new' : 'review' }));
      }
      function revealNote(q) {
        if (!reveal) return '';
        const card = VOCAB[q.w] || {};
        const compare = (!reveal.ok && card.cmp && typeof renderCompareNote === 'function')
          ? renderCompareNote(card.cmp, true) : '';   // 做题答错直接摊开表：这里再让人多点一次就成打断源了
        // 这里不摆推进按钮：全页唯一的「下一题 / 小结」在任务条上（那颗也是键盘 → 的等价物）。
        // 卡里再放一颗就是同屏两颗同名按钮，末题两处文字还会不一致（走查 2026-09-22 #1）。
        return `<div class="qz-note">${reveal.ok ? '对了。' : '正确的那一个是 '}<b>${esc(q.answer)}</b></div>
          ${compare}`;
      }
      /* 义项字符串（'n. 薄雾；烟雾' 这种）剥掉词性前缀，剩下的就是能在译文里划出来的那几个字 */
      function senseText(sense) {
        return String(sense || '').replace(/^\s*(n|v|vt|vi|adj|adv|prep|conj|pron|num|int|abbr|phrase)\.\s*/i, '')
          .split(/[；;]/)[0].trim();
      }
      /* 提示（规格 §2 那句「通过提示确定唯一性」）：中文译文里把这个位置的意思划出来。
         译文没直译到这个词（划不出来）时改在提示行里整条写出来，绝不静默丢掉这条提示。 */
      function zhWithHint(zh, sense) {
        const core = senseText(sense);
        const at = core ? String(zh).indexOf(core) : -1;
        if (at < 0) return esc(zh);
        return esc(String(zh).slice(0, at)) + '<u>' + esc(core) + '</u>' + esc(String(zh).slice(at + core.length));
      }
      function renderQuiz() {
        const el = document.getElementById('taskCard');
        if (!el) return;
        const item = quizList()[quizCursor];
        const q = buildQuiz(item);
        if (!taskMode || pass < 2 || !q) { hideCard(); return; }
        const b = q.blank || maskSplit(q.text || '', q.w);
        const core = senseText(q.sense);
        // 空格按被遮的那个词形给长度（D6：遮的是句子里的实际词形）
        const sentLine = `${esc(b.before)}<span class="qz-blank" aria-label="这里少了一个词">${'_'.repeat(Math.min(14, Math.max(3, b.mid.length)))}</span>${esc(b.after)}`;
        const body = `<div class="qz-sent">${sentLine}</div>
            <div class="qz-zh">${zhWithHint(q.prompt, q.sense)}</div>
            <div class="qz-hint">选出填回空格的那个词（按 1–4 也能选）· 这个位置的意思：<b class="qz-sense">${esc(core || q.sense || '')}</b></div>
            <div class="qz-opts" role="group" aria-label="四个候选单词">${q.opts.map((o, i) => {
              const cls = reveal ? (o === q.answer ? ' right' : (reveal.pick === o ? ' wrong' : '')) : '';
              return `<button class="qz-opt${cls}" aria-label="选项 ${i + 1}，共 ${q.opts.length} 个，${esc(o)}" onclick="TASK.pickOpt(${i})"><span class="n">${i + 1}</span>${esc(o)}</button>`;
            }).join('')}</div>${reveal ? revealNote(q) : ''}`;
        el.innerHTML = `<div class="qz-head"><span class="qz-tag">② 挖空选择</span><span class="sp"></span>
            <button class="qz-mini" onclick="TASK.flagQuiz()">这题有问题</button></div>${body}`;
        el.hidden = false;
        /* 焦点进卡：卡片是整块换 innerHTML 的，不主动接手的话焦点还在正文里，键盘只能用 1–4；
           preventScroll 免得焦点一进来就把正文滚走。 */
        const first = el.querySelector('.qz-opt');
        if (first) first.focus({ preventScroll: true });
        syncCardBottom();
      }
      function pickOpt(i) {
        const q = currentQuiz();
        if (!q || !q.opts || !q.opts[i]) return;
        answerQuiz(q.opts[i]);
      }
      function reviewSentence() {
        const item = quizList()[quizCursor];
        if (!item) return;
        if (item.s === 'ex') { showAbToast('这句是词卡上的例句 —— 看卡片就行'); return; }
        const local = globalToLocal(item.s);
        if (local >= 0 && sents[local]) { sents[local].scrollIntoView({ block: 'center', behavior: 'smooth' }); playFrom(local); }
      }
      function renderPassSummary(n) {
        const el = document.getElementById('taskCard');
        if (!el || !ROOT2) return;
        const d = ROOT2.state.daily[day2()] || {};
        const nums = n === 1 ? [[doneToday(), '句读完了'], [todayPlan(true).words.length, '个词今天见过'], [d.promote || 0, '个词往前走了一步']]
                             : [[quizAnsweredN, '题答了'], [quizWrongN, '题答错（不倒退）'], [d.promote || 0, '个词累计晋升']];
        const title = n === 1 ? '① 通读完成' : '② 挖空选择完成';
        const label = n === 1 ? '开始 ② 挖空选择' : '今天完成';
        /* 补考的账只在这句里说一次：任务条不加、也不另起一格（条上是三个数，见 updateTaskBar）。
           措辞不用「欠 / 待补」—— 补考是本遍里做完的事，不是留给明天的账。 */
        const sub = n === 1 ? '这一遍读完了，下一遍是这一批句子的词'
          : '这一批过了两遍：读到 → 选得出' + (retakeServedN ? ` · 补考 ${retakeServedN} 个，对 ${retakeOkN} 个` : '');
        el.innerHTML = `<div class="pass-summary"><h4>${title}</h4>
          <div class="sub">${sub}</div>
          <div class="nums">${nums.map(x => `<div><b>${x[0]}</b><span>${esc(x[1])}</span></div>`).join('')}</div>
          <button class="go" onclick="TASK.summaryContinue()">${label}</button></div>`;
        el.hidden = false;
        syncCardBottom();
      }
      function doneToday() {
        const d = (ROOT2 && ROOT2.state.daily[day2()]) || {};
        return d.sentDone || 0;
      }
      function passNumber() { return pass; }
      function quizDoneCount() { return quizAnsweredN; }
      function quizWrongCount() { return quizWrongN; }
      function isFinished() { return taskFinished; }


      // ---- 计划生成 ----
      function createPlan(totalDays, dailyMinutes) {
        const newPerDay = newPerDayOf(totalDays);
        plan = { startDate: today(), totalDays, dailyMinutes, newPerDay, paused: false };
        savePlan();
        prog = { sentences: {}, daily: {}, streak: 0, lastDay: '', cycleCount: 0, cycleSeen: {}, pace: (prog && prog.pace) || {} };
        saveProg();
        buildQueue();
        updateBtn();
      }

      // ---- 句子阶段 ----
      function sentState(i) {
        const s = prog.sentences[i];
        if (!s) return { reps: 0, phase: 'new', nextDue: 0 };
        return s;
      }
      function phaseOf(reps) {
        if (reps >= PHASE_THRESHOLDS.mastered) return 'mastered';
        if (reps >= PHASE_THRESHOLDS.solid) return 'solid';
        if (reps >= PHASE_THRESHOLDS.learning) return 'learning';
        return 'new';
      }

      // ---- 实测节奏：用相邻两次跟读的间隔估算每句耗时（折算回 1× 基准后落盘） ----
      let _lastRepAt = 0;
      function samplePace(type, now) {
        if (!prog.pace || typeof prog.pace !== 'object') prog.pace = {};
        const gap = (now - _lastRepAt) / 1000;
        _lastRepAt = now;
        // 只采信「连续跟读」的样本：太快是误触/引擎残留，太慢是中途停顿走神
        if (gap < 2 || gap > 120) return;
        const base = gap * (rate || 1);   // 实测秒数折算回 1 倍速基准
        const w = 0.15;                   // 指数平滑，抗单句抖动
        const round1 = v => Math.round(v * 10) / 10;
        if (type === 'new') avgNew = round1(avgNew * (1 - w) + base * w);
        else avgReview = round1(avgReview * (1 - w) + base * w);
        prog.pace.new = avgNew; prog.pace.review = avgReview;
        prog.pace.samples = (prog.pace.samples || 0) + 1;
      }

      // ---- 记录一次跟读 ----
      function recordRep(globalIdx) {
        if (!prog || !plan) return;
        const now = Date.now();
        let s = prog.sentences[globalIdx];
        if (!s) { s = { reps: 0, phase: 'new', nextDue: 0, lastRead: 0 }; prog.sentences[globalIdx] = s; }
        s.reps++;
        s.lastRead = now;
        s.phase = phaseOf(s.reps);
        try { readDone(globalIdx); } catch (e) {}   // 同一句读一遍 = 句里每个未毕业词各一次接触
        // 计算下次到期
        const intIdx = Math.min(s.reps, INTERVALS.length - 1);
        // 注意：间隔表前几档是 0（当日重复），必须用 ?? 而不是 ||，否则 0 会被误当成 14 天
        const daysLater = INTERVALS[intIdx] ?? 14;
        s.nextDue = now + daysLater * 864e5;
        // 每日记录
        const d = today();
        if (!prog.daily[d]) prog.daily[d] = { newDone: 0, reviewDone: 0, totalSec: 0, reps: 0 };
        prog.daily[d].reps++;
        if (s.reps <= PHASE_THRESHOLDS.learning) prog.daily[d].newDone++;
        else prog.daily[d].reviewDone++;
        // 连续天数
        if (prog.lastDay !== d) {
          const yesterday = new Date(Date.now() - 864e5);
          const yd = yesterday.getFullYear() + '-' + String(yesterday.getMonth() + 1).padStart(2, '0') + '-' + String(yesterday.getDate()).padStart(2, '0');
          prog.streak = (prog.lastDay === yd) ? prog.streak + 1 : 1;
          prog.lastDay = d;
        }
        // 循环计数：本轮内每句至少跟读过一次 = 完成 1 次循环
        if (!prog.cycleSeen) prog.cycleSeen = {};
        const isNewInCycle = !prog.cycleSeen[globalIdx];
        if (isNewInCycle) {
          prog.cycleSeen[globalIdx] = now;
          if (Object.keys(prog.cycleSeen).length >= SENT_RAW.length) {
            prog.cycleCount = (prog.cycleCount || 0) + 1;
            prog.cycleSeen = {};
            _cycleJustCompleted = prog.cycleCount;
          }
        }
        // 实测节奏（放在 saveProg 前，一起落盘）
        samplePace(s.reps <= PHASE_THRESHOLDS.learning ? 'new' : 'review', now);
        saveProg();
        // 更新 UI
        if (_cycleJustCompleted) {
          showAbToast(`恭喜完成第 ${_cycleJustCompleted} 轮循环！全部 ${SENT_RAW.length} 句已通读一遍`);
          _cycleJustCompleted = 0;
          const p = document.getElementById('todayPanel');
          if (p && _panelOpen) renderToday(p);
        }
        if (taskMode) updateTaskBar();
        updateMarkers();
      }

      // ---- 构建今日队列 ----
      function buildQueue() {
        if (!plan || !prog) { todayQueue = []; return; }
        const now = Date.now();
        const totalSents = SENT_RAW.length;
        const newSentences = [];
        const reviewSentences = [];

        // 新句窗口按「已开过的句子数」推进，不按日历天数。
        // 原来 startNew = dayIndex() * newPerDay：断更 N 天后窗口直接前移 N 格，
        // 那 N 天的句子既不再进新句窗口、也因 reps=0 不会转成复习，被永久跳过。
        // 现在游标停在原地，欠的句子留在今天的队列里 —— 顺延，不吞内容。
        if (!plan.paused) {
          let started = 0;
          for (let i = 0; i < totalSents; i++) if (sentState(i).reps > 0) started++;
          const startNew = Math.min(started, totalSents);
          const endNew = Math.min(startNew + plan.newPerDay, totalSents);
          for (let i = startNew; i < endNew; i++) {
            const st = sentState(i);
            if (st.reps < PHASE_THRESHOLDS.learning) newSentences.push(i);
          }
        }

        // 到期复习句
        for (let i = 0; i < totalSents; i++) {
          const st = sentState(i);
          if (st.reps > 0 && st.reps < PHASE_THRESHOLDS.mastered && st.nextDue <= now) {
            if (!newSentences.includes(i)) reviewSentences.push(i);
          }
        }
        // mastered 抽查（每 14 天到期）
        for (let i = 0; i < totalSents; i++) {
          const st = sentState(i);
          if (st.phase === 'mastered' && st.nextDue <= now) {
            if (!reviewSentences.includes(i)) reviewSentences.push(i);
          }
        }

        // 按章节分组排序
        const sortByChapter = (arr) => arr.sort((a, b) => {
          const ca = artOfSentGlobal(a), cb = artOfSentGlobal(b);
          return ca !== cb ? ca - cb : a - b;
        });
        sortByChapter(newSentences);
        sortByChapter(reviewSentences);

        // 标记类型
        todayQueue = [
          ...newSentences.map(i => ({ i, type: 'new' })),
          ...reviewSentences.map(i => ({ i, type: 'review' }))
        ];

        // 过滤已完成的（今天已经读过的）
        const d = today();
        todayQueue = todayQueue.filter(item => {
          const st = sentState(item.i);
          // 新句：今天 reps 达到 learning 阈值就算完成
          if (item.type === 'new') return st.reps < PHASE_THRESHOLDS.learning || st.lastRead > startOfToday();
          // 复习句：今天读过一次就算完成
          return !(st.lastRead >= startOfToday() && st.reps > 0);
        });
      }

      function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }

      // 全局句索引→章索引（不依赖当前 render 的 chapter 过滤）
      function artOfSentGlobal(globalIdx) {
        let count = 0;
        for (let si = 0; si < SECTIONS.length; si++) {
          const n = SECTIONS[si].paragraphs.reduce((a, p) => a + p.length, 0);
          if (globalIdx < count + n) return si;
          count += n;
        }
        return SECTIONS.length - 1;
      }

      // 全局句索引→当前渲染的本地索引
      function globalToLocal(globalIdx) {
        if (currentChapter < 0) return globalIdx;
        const start = computeChapterStart(currentChapter);
        const local = globalIdx - start;
        const count = chapterSentCount(currentChapter);
        return (local >= 0 && local < count) ? local : -1;
      }
      function localToGlobal(localIdx) {
        if (currentChapter < 0) return localIdx;
        return chapterSentStart + localIdx;
      }

      // ---- 任务模式 ----
      /* 他 2026-09-21 拍的：任务模式底部只留一条通栏任务条，播放条的全部功能都放这条上。
         做法是把播放条那两排控件搬进任务条的第二行，退出时搬回 —— 搬 DOM 而不是复制一份，
         这样 id、事件、paint() 只有一份真值，播放状态不会在两个地方各说各话。 */
      function dockAudiobar(on) {
        const ab = document.getElementById('audiobar'), slot = document.getElementById('tbPlay');
        if (!ab || !slot) return;
        if (on) {
          ['.ab-left', '.ab-right'].forEach(sel => {
            const el = ab.querySelector(':scope > ' + sel);
            if (el) slot.appendChild(el);
          });
        } else {
          const anchor = ab.querySelector('.ab-expand') || null;
          ['.ab-left', '.ab-right'].forEach(sel => {
            const el = slot.querySelector(':scope > ' + sel);
            if (el) ab.insertBefore(el, anchor);
          });
        }
      }
      function enterTaskMode() {
        if (!plan) return;
        /* 已经在任务模式里（今日面板那颗这时候写着「继续任务」）就只把面板收掉。
           不设这道闸会从这里整套重跑：pass 被拍回 ①、批次快照重拍、quizCursor 归零，
           而屏幕上② 的题卡还挂着 —— 它绑的是旧批次，新批次里没有 pass===2 的题，四颗选项全哑。 */
        if (taskMode) { closePanel(); return; }
        buildQueue(); syncQueueFromPlan();
        // 批次快照：② 考的就是这一批读过的句子，不是队列此刻还剩下什么
        batchItems = todayPlan(true).items.map(x => Object.assign({}, x));
        pass = 1; resetQuizRun(); taskFinished = false;
        _tabStarted = false;                       // 那颗键每一趟都从「放这一句」起步
        if (!todayQueue.length) { showAbToast('今天没有排到的句子 —— 把每天的分钟数调大一点试试'); return; }
        hideResumeOffer();
        taskMode = true;
        sessionStart = Date.now();
        sessionReps = 0; exitConfirm = false; startSessionClock();
        document.body.classList.add('task-mode');
        dockAudiobar(true);
        document.getElementById('taskBar').classList.add('show');
        syncTaskBarHeight(); watchTaskBar();
        closePanel();
        // 跳到第一个未完成句
        goToNextTask(false);
      }
      function exitTaskMode() {
        taskMode = false; exitConfirm = false; stopSessionClock();
        document.body.classList.remove('task-mode', 'quiz-mode');
        dockAudiobar(false);
        const bar = document.getElementById('taskBar');
        if (bar) { bar.classList.remove('show'); bar.dataset.state = 'idle'; }
        hideCard(); updateMarkers();
        try { paint(); } catch (e) {}   // 播放条标题在任务模式里让给了任务栏，退出时要拿回来
      }
      /* 点 ✕ 先问一句（他 2026-09-22）。仍然零惩罚：不改排期、不生成欠账，
         所以这句只报「进度已经记下」，不写「确定要放弃吗」那种挽留话术。 */
      function requestExit() { if (!taskMode) return; exitConfirm = true; updateTaskBar(); }
      function cancelExit() { exitConfirm = false; updateTaskBar(); }
      function confirmExit() { exitConfirm = false; exitTaskMode(); }

      function goToNextTask(autoPlay) {
        // 找队列中下一个未完成的
        let found = -1;
        for (let qi = 0; qi < todayQueue.length; qi++) {
          if (!readToday2(todayQueue[qi].i)) { found = qi; break; }
        }
        if (found < 0) {
          if (pass === 1) { finishPass(1); return; }
          showAbToast('今天这批读完了');
          updateTaskBar(true);
          return;
        }
        revealTaskPos(found, autoPlay);
      }

      /* 「落到队列里的第 found 句」唯一的实现：goToNextTask 和底栏那根位置条都走这里。
         分开写两份的话，跨章切换（先换章、等 300ms 再定位）只会修好一边 —— 上一轮 prev() 就是栽在两份实现上。 */
      function revealTaskPos(found, autoPlay) {
        taskPos = found;
        const globalIdx = todayQueue[found].i;
        /* 换了一句 = 单句循环要跟到新这句上（默认就是循环 3 次，锚在旧句等于悄悄失灵）；
           A-B 区间则整段作废（播到 B 点把人拽回上一句的区间，屏幕上已经不是那句）。
           这段原先在 next() 和 taskSeekGo() 里各写一份 —— 搬进来，两条入口共用一份。 */
        try { if (loopMode) { loopSent = globalIdx; loopCurrent = 0; } if (abMode === 3) abCancel(true); } catch (e) {}
        const localIdx = globalToLocal(globalIdx);
        if (localIdx >= 0 && localIdx < sents.length) {
          // 当前章节内可见：「我在哪一句」由 playFrom → paint 的 .playing 唯一负责，这里不再另设标记
          if (autoPlay !== false) playFrom(localIdx);
          else { idx = localIdx; paint(); sents[localIdx].scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        } else {
          // 需要切换章节
          const ch = artOfSentGlobal(globalIdx);
          if (ch !== currentChapter) {
            const sel = document.getElementById('chapSel');
            if (sel) { sel.value = String(ch); onChapterChange(String(ch)); }
            // 切换后延迟定位
            setTimeout(() => {
              const newLocal = globalToLocal(globalIdx);
              if (newLocal >= 0 && sents[newLocal]) {
                if (autoPlay !== false) playFrom(newLocal);
                else { idx = newLocal; paint(); sents[newLocal].scrollIntoView({ block: 'center', behavior: 'smooth' }); }
              }
            }, 300);
          }
        }
        updateTaskBar();
        updateMarkers();
      }

      /* 拖完 / 按键盘选了一句：停掉正在念的、单句循环跟到新句、A-B 区间作废 —— 和 next() 同一套收尾。
         唯一的差别是这里不记接触：把条子拖过去不等于读过那句。 */
      function taskSeekGo(k) {
        if (!taskMode || !todayQueue.length) return;
        k = Math.max(0, Math.min(todayQueue.length - 1, k));
        playing = false; speakToken++;
        try { speechSynthesis.cancel(); } catch (e) {}
        try { if (typeof CLOUD !== 'undefined') CLOUD.stop(); } catch (e) {}
        paint();
        const g = todayQueue[k].i;
        revealTaskPos(k, true);
      }

      /* 「上一句」必须和「下一句」对称（他 2026-09-22：只能跟着下一句走，上一句没反应）。
         以前这颗直接调全局 step(-1)：正文高亮跟着走了，队列位置 taskPos 还停在原句 ——
         于是再按「下一句」，记的是那句并没在读的句子的进度。翻完句要把队列位置对齐到屏幕上这句。 */
      function prev() {
        if (!taskMode) { step(-1); return; }
        if (pass >= 2) { reviewSentence(); return; }   // ② 没有「上一句」这个动作，这颗本来也不显示
        step(-1);
        if (idx >= 0) {
          const g = localToGlobal(idx);
          for (let qi = 0; qi < todayQueue.length; qi++) {
            if (todayQueue[qi].i === g) { taskPos = qi; break; }
          }
        }
        updateTaskBar();
      }
      /* 本次已用多久：sessionStart 一直在记，以前界面上没地方看（他 2026-09-22：显示）。
         必须自己走表 —— 只在点按钮时刷新的话，坐着读一句不动它就停在那儿了。 */
      let _clock = null;
      function startSessionClock() {
        stopSessionClock();
        _clock = setInterval(function () {
          if (!taskMode) { stopSessionClock(); return; }
          if (!document.hidden) updateTaskBar();
        }, 15000);
      }
      function stopSessionClock() { if (_clock) { clearInterval(_clock); _clock = null; } }
      /* 前 20 秒不报 —— 刚点进来就写「本次 0秒」，看着像坏了而不是像刚开始 */
      function sessionSpent() { const ms = sessionStart ? Date.now() - sessionStart : 0; return ms < 20000 ? '' : fmtTime(ms / 1000); }
      /* ② 的「还剩几分钟」用他自己刚才的速度算，不编常数：一题都没答完时宁可不给分钟数，
         只报题数 —— 一个凭空来的数比没有数更坏。 */
      function quizPaceLeft(leftQ) {
        if (leftQ <= 0) return '这批做完了';
        if (!quizStart || quizAnsweredN < 1) return '还剩 ' + leftQ + ' 题';
        const perQ = (Date.now() - quizStart) / quizAnsweredN;
        return '还剩 ~' + fmtTime(perQ * leftQ / 1000) + '（按你刚才的速度）';
      }

      function again() {
        const _bar = document.getElementById('taskBar');
        if (_bar && _bar.dataset.state === 'resume') { skipResume(); return; }   // 续读条上的「今天先不做」
        // ①：重播当前句；②：回看这句（重听不算答错，也不记接触）
        if (!taskMode) return;
        if (pass >= 2) { reviewSentence(); return; }
        if (taskPos >= todayQueue.length) return;
        const globalIdx = todayQueue[taskPos].i;
        const localIdx = globalToLocal(globalIdx);
        if (localIdx >= 0) playFrom(localIdx);   // 不在这里记完成：记在「这一遍真的放完了」那一刻
      }
      function next() {
        const _bar = document.getElementById('taskBar');
        if (_bar && _bar.dataset.state === 'resume') { resumeTask(); return; }    // 续读条上的「接着做」
        // 记录当前句完成，跳下一个；② 态下这个键是「下一题 / 跳过这题」
        if (!taskMode) return;
        if (pass >= 2) {
          if (!quizList().length) { finishPass(pass); return; }
          nextQuiz();
          return;
        }
        if (taskPos >= todayQueue.length) return;
        /* 这一颗在 ① 态有两种身份（他 2026-09-23 定的名，2026-09-24 定的动作）：
           这趟还没放过 → 「放这一句」；放过之后 → 「下一句」。
           两种都先把正在念的收掉；完成计数仍挂在「这句真的放完了」那一刻
           （taskSentenceFinished），不挂在点击上 —— 点一下就记完成等于没读就打卡。 */
        playing = false; speakToken++;
        try { speechSynthesis.cancel(); } catch (e) {}
        try { if (typeof CLOUD !== 'undefined') CLOUD.stop(); } catch (e) {}
        if (!_tabStarted) {
          /* 这一趟的第一下：放「屏幕上这一句」，不往后跳。
             写成 goToNextTask 的话，用「上一句」退回去再点会悄悄跳到队列里第一句还没听的，
             而不是你退回的那句 —— 这条路径以前栽过。 */
          paint();
          revealTaskPos(taskPos, true);
          _tabStarted = true;
          syncTaskNextLabel();
          return;
        }
        /* 「下一句」（他 2026-09-24 拍板）：从当前位置往后找第一条没读的，**高亮挪过去 + 同步开播**；
           放完就停在那句，不再自动往下走（放完自动挪高亮是他明确不要的）。
           往后没有就回卷找一条，再没有 = 这批读完了 → 把 ② 端上来。 */
        let found = -1;
        for (let qi = taskPos + 1; qi < todayQueue.length; qi++) {
          if (!readToday2(todayQueue[qi].i)) { found = qi; break; }
        }
        if (found < 0) {
          for (let qi = 0; qi <= taskPos && qi < todayQueue.length; qi++) {
            if (!readToday2(todayQueue[qi].i)) { found = qi; break; }
          }
        }
        if (found < 0) { finishPass(1); return; }
        revealTaskPos(found, true);
        syncTaskNextLabel();
      }

      // ---- 时间估算 ----
      /* 今天还剩多少新句 / 复习句，走的是旧句子账（prog.sentences + todayQueue）。
         2026-09-22 走查 #4 把顶栏绿点改到 todayLeftN()（新引擎账）之后这条暂时没有读者：
         留着是因为它算的是「今天的量」，与工期（estimateDays）两回事（走查 §7(b)），
         别把它接进任何工期展示；要接回界面，先确认它不会跟条上那个 n/N 变成两个数。 */
      function estimateRemaining() {
        let newLeft = 0, reviewLeft = 0;
        const st = startOfToday();
        for (const item of todayQueue) {
          const s = sentState(item.i);
          if (item.type === 'new' && !(s.reps >= PHASE_THRESHOLDS.learning && s.lastRead >= st)) newLeft++;
          else if (item.type === 'review' && !(s.lastRead >= st)) reviewLeft++;
        }
        const sec = newLeft * secNew() + reviewLeft * secReview();
        return { newLeft, reviewLeft, sec };
      }
      function fmtTime(sec) {
        if (sec < 60) return Math.round(sec) + '秒';
        const m = Math.floor(sec / 60), s = Math.round(sec % 60);
        return s > 0 ? `${m}分${s}秒` : `${m}分钟`;
      }

      // ---- 计划容量估算（1 轮 = 全部句子通读一遍） ----
      function newPerDayOf(days) { return Math.ceil(SENT_RAW.length / Math.max(1, days)); }
      // cumDays()[n] = 按间隔表排期，第 n 遍最早落在累计第几天（第 1 遍当天即可）
      let _cumDays = null;
      function cumDays() {
        if (_cumDays) return _cumDays;
        const max = PHASE_THRESHOLDS.mastered;
        const a = new Array(max + 1).fill(Infinity);
        a[1] = 0;
        for (let n = 1; n < max; n++) a[n + 1] = a[n] + (INTERVALS[Math.min(n, INTERVALS.length - 1)] ?? 14);
        _cumDays = a;
        return a;
      }
      // D 天内、按 SRS 排期最多能读到第几遍（= 平均每句最多几轮）
      function repsBySchedule(days) {
        const a = cumDays();
        let n = 1;
        while (n < a.length - 1 && a[n + 1] <= days) n++;
        return n;
      }
      // ---- UI 更新 ----
      let _barRO = null;
      /* 条子现在多高，就把 --task-bar-h 写成多高；条子收起来就把这个变量撤掉，让 CSS 兜底值接管。
         两个方向都要写：以前这里挂着 `&& taskMode`，只有任务模式才量 —— 可吃这个变量的
         `body.resume-offer .audiobar` 恰恰活在任务模式外（刷新时那张「今天 N 句」的续读卡），
         于是它永远拿 62px 的兜底值，而那张卡实测 88px，播放条就被压住 18px（他 2026-09-23 图 1）。
         反过来只设不清也会错：退出任务模式后留一个旧高度，常规模式的同步药丸会凭空浮高。 */
      function syncTaskBarHeight() {
        const bar = document.getElementById('taskBar');
        if (!bar) return;
        const h = bar.offsetHeight;
        if (h) document.documentElement.style.setProperty('--task-bar-h', h + 'px');
        else document.documentElement.style.removeProperty('--task-bar-h');
      }
      /* 条子的高度不是常量：①/② 两种态、工期那行字到没到、窄屏折不折行都会让它长高。
         只在进模式那一刻量一次 → 靠 --task-bar-h 让位的东西（做题卡、回顶按钮、同步条）和条子错开一截；
         实测窄屏 ① 态条子 107px 而变量还停在 87px。挂个观察器，比在每处文案后面补一次调用可靠。 */
      function watchTaskBar() {
        const bar = document.getElementById('taskBar');
        if (!bar || _barRO || typeof ResizeObserver === 'undefined') return;
        _barRO = new ResizeObserver(function () {
          if (!bar.offsetHeight) return;              // 收起时高度为 0，别把变量清成 0px
          syncTaskBarHeight(); syncCardBottom();
          try { placeSyncHint(); } catch (e) {}       // 条子一长高，压在它上面的提示药丸要跟着抬
        });
        _barRO.observe(bar);
      }
      /* ① 通读态那颗键的文案：这趟还没动过 →「放这一句」；动过之后整趟都叫「下一句」。
         只在 next()/enterTaskMode() 两处变，所以同步函数很轻 ——
         不重跑 updateTaskBar()（那个会重建今日队列，逐句跑不起）。 */
      function syncTaskNextLabel() {
        if (!taskMode) return;
        const bar = document.getElementById('taskBar');
        if (!bar || bar.dataset.state !== 'read') return;
        const btn = document.getElementById('tbNext');
        if (!btn) return;
        const on = _tabStarted;               // 文案只看「这趟放过一句没有」：点过之后整趟都叫「下一句」
        const label = on ? '下一句' : '放这一句';
        if (btn.dataset.label === label) return;
        btn.dataset.label = label;
        btn.innerHTML = '<i class="ri-arrow-right-line" aria-hidden="true"></i> ' + label;
        btn.title = on ? '下一句（还没放的先放起来；正在放的收尾，跳到队列里下一句）'
          : '放这一句（放完自动记为已读，再点就是下一句）';
        btn.setAttribute('aria-label', label);
      }
      /* 一条栏三种态，只换内容不藏控件（PRD §10.1）。
         今日进度这一个数字只活在任务栏；播放条标题回过去报「读到第几句」。 */
      function updateTaskBar(allDone) {
        const bar = document.getElementById('taskBar');
        if (!bar) return;
        const titleEl = document.getElementById('tbTitle');
        const subEl = document.getElementById('tbSub');
        const againBtn = document.getElementById('tbAgain');
        const nextBtn = document.getElementById('tbNext');
        if (!taskMode && bar.dataset.state === 'resume') return;   // 续读条占着这一行，别把它刷成任务态
        if (!ROOT2 || !ROOT2.plan) { bar.dataset.state = 'idle'; return; }
        todayPlan(true);   // 保证 todayQueue / plannedToday 用的是今天的计划（以前顺手取 todayMinutes 上屏，那个数现在不在条上说了）
        const d = ROOT2.state.daily[day2()] || {};
        const doneN = d.sentDone || 0;
        const planned = plannedToday();
        const leftN = todayLeftN();   // 这条减法只住在 todayLeftN() 里：绿点与首屏提示读同一个函数
        const quizN = quizList().length;
        const fin = taskFinished || allDone === true;
        const asking = !!taskMode && exitConfirm;
        const spent = sessionSpent();
        const clockEl = document.getElementById('tbClock');
        /* 条上填充归一根人管：setProg 只报比例，role / aria / 滑块露不露由 syncTaskSeek 定 ——
           两处各写一半会互相盖掉（上一轮 abTitle 那条锁就是为这个红的）。 */
        bindTaskSeek();
        const setProg = (f) => syncTaskSeek(false, f);
        /* 条上只留三个数（他 2026-09-22：「文字一堆，都没耐心看」）：
           主行 = 进度（大字 n/N + 一条进度条，不再用文字复述百分比，也不再报「今天多少分钟」）；
           辅行左 = 还剩多久（唯一一个能立刻行动的数）；辅行右 = 本次多久（小表，跟左边拉开两端摆）。
           「全部过完约某年某月」也撤了 —— 设置屏 / 计划页 / 今日面板三处都还在，底栏是第四个重复点。 */
        /* 这一颗的文案每次都由下面各分支重写（② 是「下一题/小结/跳过这题」，① 是「放这一句/下一句」），
           而 syncTaskNextLabel() 靠 dataset.label 防抖 —— 进分支前清掉，别让它拿着上一态的值跳过刷新。 */
        nextBtn.dataset.label = '';
        bar.dataset.state = asking ? 'exit' : (fin ? 'done' : (pass >= 2 ? 'quiz' : 'read'));
        document.body.classList.toggle('quiz-mode', !!taskMode && !fin && !asking && pass >= 2);
        if (clockEl) clockEl.textContent = (asking || !spent) ? '' : '本次 ' + spent;
        if (asking) {
          titleEl.textContent = '要退出任务模式吗？';
          subEl.textContent = '今天的进度已经记下了，退出不会欠下什么';
        } else if (fin) {
          titleEl.innerHTML = '<i class="ri-trophy-line" aria-hidden="true"></i> 今天完成';
          subEl.textContent = `${doneN} 句 · ${d.promote || 0} 个词往前走了`;
          againBtn.style.display = 'none';
          nextBtn.textContent = '看词本';
          setProg(1);
        } else if (pass >= 2) {
          titleEl.textContent = '② 挖空选择 ' + Math.min(quizCursor + 1, quizN) + '/' + quizN
            + (quizWrongN ? ' · 错 ' + quizWrongN : '');
          /* ② 这一行原来是提示语（「选出填回空格的那个词」），现在让给「还剩几分钟」——
             他 2026-09-22：显示。四选一没什么要教的，而「还要多久收工」正是这一步唯一想知道的数。 */
          subEl.textContent = quizPaceLeft(Math.max(0, quizN - quizCursor));
          againBtn.style.display = '';
          againBtn.textContent = '回看句子';
          /* 这一颗是全页唯一的推进按钮（做题卡里那颗已删）。末题写「小结」不写「下一题」——
             点下去就是把这一遍（含末尾的补考）收掉，说「下一题」是假承诺。 */
          nextBtn.textContent = reveal ? (hasNextQuiz() ? '下一题' : '小结') : '跳过这题';
          setProg(quizN ? quizCursor / quizN : 1);
        } else {
          /* 分母是当天快照，不跟分子涨。分子可能超过它（今天多读了）—— 主行封顶写 36/36，
             不写 40/36 这种看着像出错的数；多出来的在副行如实说。 */
          const extra = Math.max(0, doneN - planned);
          titleEl.textContent = `① 通读 ${Math.min(doneN, planned)}/${planned}`;
          /* secNew() 已经把倍速除掉一次了，这里再除一遍就是平方（同一天在引擎里抓到的那个坑的第二个现场）。 */
          subEl.textContent = leftN ? `还剩 ~${fmtTime(leftN * secNew())}`
            : (extra ? `今天的量读完了 · 多读了 ${extra} 句` : '这批读完了，接着出这一批的词');
          againBtn.style.display = '';
          againBtn.innerHTML = '<i class="ri-repeat-line" aria-hidden="true"></i> 再来';
          /* 名字跟着口径改（他 2026-09-23：删掉播放键、点一句放一句）：这颗现在不"翻到下一句"，
             而是"把这一句放一遍"，放完才记完成；正在放的时候改名「下一句」（收尾前进）。
             图标仍用 →：窄屏上这颗只显示图标（.lbl 那套 font-size:0），给个 ▶ 三角形就等于
             把他刚要求删掉的那颗播放键又画了回来。 */
          syncTaskNextLabel();
          /* ① 通读态：这一根改成"位置条"，读的是屏幕上这句在队列里的第几格 —— 做完只读的 setProg 在这里换轨。
             已读句数没丢：主行「① 通读 12/36」一直在说它。 */
          syncTaskSeek(true);
        }
        /* 播放条那一格的说法归播放条：任务模式里它被搬进按钮行、暂时看不见，但 paint() 和这条
           更新写的是同一个元素，谁也不许把对方的字抢过去（task-flow 有锁）。我曾把它当"写给
           看不见元素的死代码"删掉，那条锁当场红 —— 记在这里，别再删第二次。 */
        const abT = document.getElementById('abTitle');
        if (abT && taskMode) {
          const cur2 = todayQueue[taskPos];
          const chName = (cur2 && SECTIONS[artOfSent[cur2.i]] && SECTIONS[artOfSent[cur2.i]].title) || '';
          abT.textContent = cur2 ? `读到第 ${cur2.i + 1} 句${chName ? ' · ' + chName : ''}` : '今日任务';
        }

        syncTaskBarHeight(); syncCardBottom();
      }

      /* ---- 底栏那根位置条 ----
         ① 通读态：它是「这一批里的第几句」—— 能拖、能 Tab 聚焦按 ← →；
         其余态（② 做题 / 完成 / 续读）：同一根退化成只读的进度条，role 跟着换成 progressbar。
         一根条、两种身份，比"看着像能拖其实拖不动"诚实。 */
      function taskSeekK() {
        if (idx >= 0) {
          const g = localToGlobal(idx);
          for (let qi = 0; qi < todayQueue.length; qi++) if (todayQueue[qi].i === g) return qi;
        }
        return Math.max(0, Math.min(taskPos, Math.max(0, todayQueue.length - 1)));
      }
      function syncTaskSeek(drag, f) {
        const el = document.getElementById('tbSeek'); if (!el) return;
        if (el._dragging) return;                     // 拖动中别让 15 秒一次的刷新把手抢回去
        const fill = document.getElementById('tbProg'), knob = document.getElementById('tbKnob');
        const n = todayQueue.length;
        const k = drag ? taskSeekK() : 0;
        const frac = Math.max(0, Math.min(1, drag ? (n < 2 ? 0 : k / (n - 1)) : (f == null ? 0 : f)));
        const pct = (frac * 100).toFixed(2) + '%';
        if (fill) fill.style.width = pct;
        if (knob) knob.style.left = pct;
        const live = !!drag && taskMode && n > 1;
        el.classList.toggle('off', !live);
        el.setAttribute('role', live ? 'slider' : 'progressbar');
        el.setAttribute('tabindex', live ? '0' : '-1');
        el.setAttribute('aria-label', live ? '跳到今天第几句' : '今天这批的进度');
        if (live) {
          el.title = '跳到今天第几句 —— 按住拖动，或用 ← → 跳句';
          el.setAttribute('aria-valuemin', '1');
          el.setAttribute('aria-valuemax', String(n));
          el.setAttribute('aria-valuenow', String(k + 1));
          el.setAttribute('aria-valuetext', '今天第 ' + (k + 1) + ' 句，还剩 ' + (n - k) + ' 句');
        } else {
          el.removeAttribute('title');
          el.removeAttribute('aria-valuetext');
          el.setAttribute('aria-valuemin', '0');
          el.setAttribute('aria-valuemax', '100');
          el.setAttribute('aria-valuenow', String(Math.round(frac * 100)));
        }
      }
      function bindTaskSeek() {
        const el = document.getElementById('tbSeek');
        if (!el || el._bound) return;
        el._bound = true;
        const tip = document.getElementById('tbTip');
        const nOf = () => todayQueue.length;
        const live = () => !el.classList.contains('off') && nOf() > 1;
        const paintTo = (k, pct) => {
          const fill = document.getElementById('tbProg'), knob = document.getElementById('tbKnob');
          const p = (pct == null ? (nOf() < 2 ? 0 : k / (nOf() - 1)) * 100 : pct) + '%';
          if (fill) fill.style.width = p;
          if (knob) knob.style.left = p;
          el.setAttribute('aria-valuenow', String(k + 1));
          el.setAttribute('aria-valuetext', '第 ' + (k + 1) + ' 句，共 ' + nOf() + ' 句');
        };
        const kAt = (clientX) => {
          const r = el.getBoundingClientRect();
          const ratio = r.width ? Math.min(1, Math.max(0, (clientX - r.left) / r.width)) : 0;
          return { k: Math.round(ratio * Math.max(0, nOf() - 1)), pct: ratio * 100 };
        };
        const hideTip = () => { if (tip) tip.style.display = 'none'; };
        const showTip = (k, clientX) => {
          if (!tip || !todayQueue[k]) return;
          const g = todayQueue[k].i;
          const sec = SECTIONS[artOfSentGlobal(g)];
          /* 只报「位置 + 还剩」，不再报「共 N 句」：那个 N 是队列长度，跟任务条上那个 n/N
             （当天快照）不是一个量纲。两个都写成「第 x/M 句」会被读成对不上
             —— 2026-09-24 他实测报过「条上 229/229，气泡却 24/68」。 */
          tip.innerHTML = '<div class="tip-idx">今天第 ' + (k + 1) + ' 句 · 还剩 ' + (nOf() - k) + ' 句 · '
            + (todayQueue[k].type === 'new' ? '新句' : '复习')
            + (sec ? ' · ' + esc(sec.title) : '') + '</div><div>' + esc(plainEN(SENT_RAW[g] || '')) + '</div>';
          tip.style.display = 'block';
          tip.style.transform = 'none';
          const bar = document.getElementById('taskBar');
          const er = el.getBoundingClientRect();
          const br = bar ? bar.getBoundingClientRect() : er;
          /* 量「自然宽度」必须先把 width 收回 max-content：以前直接读 tip.scrollWidth，
             而它的 width 还是上一次写进去的 px —— 带显式宽度、内容又折行的元素，
             scrollWidth 恒等于那个宽度，于是每显示一次就少 2px（边框/取整），
             几十次之后气泡塌成一条竖线（2026-09-24 他实测 1902 视口下整句英文一字一行）。
             收回 max-content 后这次量到的就与上一次无关了；再夹上「不窄于 220 / 不宽于条宽-28」。 */
          tip.style.width = 'max-content';
          const natural = tip.offsetWidth || er.width;
          const w = Math.min(Math.max(natural, 220), Math.max(220, br.width - 28));
          const anchor = (clientX == null ? er.left + er.width / 2 : clientX) - er.left;
          const lo = br.left + 14 - er.left, hi = Math.max(lo, br.right - 14 - er.left - w);
          tip.style.width = w + 'px';
          tip.style.left = Math.max(lo, Math.min(anchor - w / 2, hi)) + 'px';
          clearTimeout(showTip._t);
          showTip._t = setTimeout(hideTip, 2600);
        };
        let dragK = null;
        el.addEventListener('pointerdown', (e) => {
          if (!live()) return;
          el._dragging = true; el.classList.add('active');
          const p = kAt(e.clientX); dragK = p.k;
          paintTo(p.k, p.pct); showTip(p.k, e.clientX);
          e.preventDefault();                         // 不然手机上会变成选中一串正文
        });
        window.addEventListener('pointermove', (e) => {
          if (!el._dragging) return;
          e.preventDefault();
          const p = kAt(e.clientX); dragK = p.k;
          paintTo(p.k, p.pct); showTip(p.k, e.clientX);
        }, { passive: false });
        window.addEventListener('pointerup', () => {
          if (!el._dragging) return;
          el._dragging = false; el.classList.remove('active');
          const k = dragK; dragK = null; hideTip();
          if (k == null) return;
          if (k !== taskSeekK()) taskSeekGo(k);       // 没挪句就别重播，只做一次对齐
          else updateTaskBar();
        });
        el.addEventListener('mousemove', (e) => {
          if (el._dragging || !live()) return;
          const p = kAt(e.clientX); showTip(p.k, e.clientX);
        });
        el.addEventListener('mouseleave', () => { if (!el._dragging) hideTip(); });
        el.addEventListener('blur', hideTip);
        el.addEventListener('keydown', (e) => {
          if (!live()) return;
          const cur = taskSeekK(), n = nOf();
          let to = null;
          if (e.key === 'ArrowRight' || e.key === 'ArrowUp') to = cur + 1;
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') to = cur - 1;
          else if (e.key === 'Home') to = 0;
          else if (e.key === 'End') to = n - 1;
          else if (e.key === 'Enter' || e.key === ' ') to = cur;
          else return;
          e.preventDefault(); e.stopPropagation();    // 空格归这根条，别漏到全局的播放/暂停上
          const k = Math.max(0, Math.min(n - 1, to));
          paintTo(k); showTip(k, null); taskSeekGo(k);
        });
      }

      function updateMarkers() {
        if (!plan || !prog) return;
        const st = startOfToday();
        // 构建今日任务集合（全局索引）
        const taskSet = new Map(); // globalIdx -> 'new'|'review'|'done'
        if (todayQueue.length) {
          for (const item of todayQueue) {
            const s = sentState(item.i);
            const doneToday = s.lastRead >= st;
            /* 判据跟队列对齐：goToNextTask 找「下一句没读的」用的是 readToday2 = 今天读过没有，
               可这里以前对「新句」额外要求 reps >= 3（learning 门槛）才算 done。
               一步一停之后每句每天只记一次，于是刚读完的那句永远不退色 —— 36 句从头绿到尾，
               这条标记就不再说「我读到哪儿」了。复习句本来就用的是 doneToday，两档现在同一把尺。
               只改显示：reps / learning 那些账一个字没动，毕业判据不从这里读。 */
            if (doneToday) taskSet.set(item.i, 'done');
            else taskSet.set(item.i, item.type);
          }
        }
        // 应用到 DOM
        sents.forEach((el, localIdx) => {
          const gIdx = localToGlobal(localIdx);
          el.classList.remove('task-new', 'task-review', 'task-done');
          const type = taskSet.get(gIdx);
          if (type === 'new') el.classList.add('task-new');
          else if (type === 'review') el.classList.add('task-review');
          else if (type === 'done') el.classList.add('task-done');
        });
        updateBtn();
      }

      function updateBtn() {
        const btn = document.getElementById('btnToday');
        if (!btn) return;
        /* 绿点的判据与任务条同源（todayLeftN）。estimateRemaining() 那条旧句子账不再参与这里 ——
           它算的是「今天的量」，与工期两回事（走查 §7(b)），仍留给展示用。 */
        btn.classList.toggle('has-task', todayLeftN() > 0);
      }

      // ---- 面板 ----
      function togglePanel() {
        if (_panelOpen) closePanel();
        else openPanel();
      }
      function openPanel() {
        const p = document.getElementById('todayPanel');
        const scrim = document.getElementById('todayScrim');
        if (!p) return;
        if (!plan) { renderSetup(p); }
        else { renderToday(p); }
        p.classList.add('open');
        scrim.style.opacity = '1'; scrim.style.pointerEvents = 'auto';
        _panelOpen = true;
        p.focus();
      }
      function closePanel() {
        const p = document.getElementById('todayPanel');
        const scrim = document.getElementById('todayScrim');
        if (p) p.classList.remove('open');
        if (scrim) { scrim.style.opacity = '0'; scrim.style.pointerEvents = 'none'; }
        _panelOpen = false;
      }

      let _view = 'today', _bookFilter = 'all';
      function setView(v) { _view = v; const el = document.getElementById('todayPanel'); if (el) renderToday(el); }
      function setBookFilter(f) { _bookFilter = f; setView('book'); }

      /* 计划设置只问一件事：每天有多少分钟。
         「总天数 → 反推每天句数」这条除法链和「慢/正常/快」三档一起删掉了：
         前者是债务膨胀的根源，后者是把每天句数偷偷乘个倍数，没人知道今天到底几句。 */
      /* ---- 「这一期还要多久」----
         他 2026-09-21：「这一期单词毕业需要多久需要在设置计划时和任务正在进行时都要展示。」
         设置屏 / 计划页 / 今天面板 / 任务条四处读的是同一份 ShadowPlan.estimateDays 的返回值，
         这里只负责缓存和措辞，一律不许另立算式（PRD「界面数字单一来源」）。
         措辞用「新词全部过完一遍」而不是「全部毕业」：保温还没做，引擎里毕业词永不再回来
         （assemble 直接 continue），说"毕业"就是许诺一件做不到的事。
         2026-09-22 D10：这个数【只按通读时间算、只数通读到过几个词】，挖空选词不进工期。
         他原话「这个时间用通读时间算，不加挖空选词了，我希望是快速刷词，现在这种算法给我压力太大了」
         —— 旧口径数的是毕业，15 分钟档显示「一年只过完 48 个词」，与他每天真读进去的句数差一个量级。
         毕业进度仍然看得见，但那是「已毕业 N / 3245」这种从存档里数出来的真值，不由模型许诺。 */
      const _etaMemo = new Map();          // 一次全量模拟 0.3–0.9s，同一档分钟绝不许重跑
      const _etaPending = new Map();
      const etaCalls = { n: 0 };           // 只给测试看：证明缓存真的生效
      /* 缓存键里【故意不放事件条数】。放了才"诚实"，但代价是每读一句、每答一题都要重跑一遍
         上千个模拟日（实测 0.3–0.9 秒），而他 2026-09-21 的要求正是「任务条那一处只在进任务模式时算一次」；
         更要紧的是那个数对几百天的工期根本不会动（15 分钟档实测 354 天），动了反而是在抖 —— 底层假设本身就带 ±20%。
         所以按「计划的指纹」缓存：改分钟 / 改日界 / 暂停新词 / 换一天 / 词表变了 才重算。 */
      function etaKey(m) {
        const p = (ROOT2 && ROOT2.plan) || {};
        return [m, ALL_TARGET_WORDS, day2(), p.boundaryHour, p.pausedNew ? 1 : 0, rate].join('|');
      }
      function etaFor(minutes) {
        const key = etaKey(minutes);
        if (_etaMemo.has(key)) return Promise.resolve(_etaMemo.get(key));
        if (_etaPending.has(key)) return _etaPending.get(key);      // 同时在算同一档：只跑一遍
        const p = (ROOT2 && ROOT2.plan) || {};
        const run = new Promise(function (resolve) {
          setTimeout(function () {                                  // 让浏览器先把「算一下…」画出去
            etaCalls.n++;
            const val = ShadowPlan.estimateDays(ROOT2 && ROOT2.state, minutes, {
              totalSents: SENT_RAW.length, wordsOf: wordsOfSent, totalWords: ALL_TARGET_WORDS,
              boundaryHour: bdHour(), plan: ROOT2 && ROOT2.plan,
              secNew: avgNew, secReview: avgReview, rate: rate || 1,   // 1× 基准 + 倍速：与 todayPlan 同一口径，倍速只除一次
            });
            _etaPending.delete(key);
            if (_etaMemo.size > 24) _etaMemo.clear();
            _etaMemo.set(key, val);
            resolve(val);
          }, 0);
        });
        _etaPending.set(key, run);
        return run;
      }
      function etaMonth(ts, exact) {
        const d = new Date(ts);
        return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月' + (exact ? ' ' + d.getDate() + ' 日' : '');
      }
      function etaText(r, m, exact) {
        if (!r || r.empty) return '按每天 ' + m + ' 分钟排不出任务，先调大一点或取消「只复习」';
        if (!r.done) return '按每天 ' + m + ' 分钟，三年内到不了终点（先把每天时间调大些）';
        return '到 ' + etaMonth(r.doneAt, exact) + ' <b>新词全部过完一遍</b>（需要 ' + r.days + ' 天）';
      }
      function etaShort(r) {                 // 任务条那一行：已经有今日进度和「这批还剩」，第三个数只留最短形态
        if (!r) return '';
        if (!r.done) return r.empty ? '排不出任务' : '三年内到不了终点';
        return '全部过完约 ' + etaMonth(r.doneAt, false);
      }
      function milestoneText(r) {
        if (!r || !r.atHorizon) return '';
        // 一年之内就已经全部过完的档，里程碑与完工日是同一件事，别再摆一个重复数（他看不懂第二个派生数）。
        if (r.done && r.days <= r.atHorizon.days) return '';
        return '到 ' + etaMonth(r.atHorizon.at, false) + ' 能过完约 ' + r.atHorizon.passed + ' 个词';
      }
      function activeDaysRecent(n) {         // 数出来的事实，不是第二个模型
        const d = (ROOT2 && ROOT2.state && ROOT2.state.daily) || {};
        const bd = bdHour();
        let c = 0;
        for (let i = 0; i < n; i++) {
          const x = d[ShadowPlan.dayKey(Date.now() - i * 864e5, bd)];
          if (x && ((x.sentDone || 0) > 0 || (x.minutes || 0) > 0)) c++;
        }
        return c;
      }
      function seedDailyForTest(back) {      // 唯一允许的测试后门：函数名带 ForTest，免得被当成产品代码接走
        if (!ROOT2) return;
        const bd = bdHour();
        const k = ShadowPlan.dayKey(Date.now() - back * 864e5, bdHour());
        ROOT2.state.daily[k] = { minutes: (ROOT2.plan && ROOT2.plan.todayMinutes) || 30, sentDone: 5, promote: 3 };
        // 造一段「两周前就开始了」的老存档：补句的判据是这个计划的年龄，光塞 daily 不算老
        if (ROOT2.plan) {
          // 只往早了挪：连调多次时留下最早那天，否则最后一次会把存档又变回几天前
          const want = Date.now() - (back + 1) * 864e5;
          const born = Date.parse(ROOT2.plan.startDate || '0');
          if (!isFinite(born) || born > want) ROOT2.plan.startDate = ShadowPlan.dayKey(want, bd);
          savePlan();
        }
        _etaMemo.clear(); persist2();
      }
      function etaSet(el, html, r) {
        if (!el || !el.isConnected) return;
        el.innerHTML = html;
        el.dataset.days = r && r.done ? String(r.days) : '';
      }
      function paintPlanEta() {
        const el = document.getElementById('planEta');
        if (!el || !ROOT2 || !ROOT2.plan) return;
        const m = ROOT2.plan.todayMinutes;
        el.textContent = '算一下…';
        etaFor(m).then(r => etaSet(el, etaText(r, m, false) + (milestoneText(r) ? ' · ' + milestoneText(r) : ''), r));
      }
      function paintTodayEta() {
        const el = document.getElementById('todayEta');
        if (!el || !ROOT2 || !ROOT2.plan) return;
        const m = ROOT2.plan.todayMinutes;
        el.textContent = '算一下…';
        etaFor(m).then(r => {
          const c = countStages();
          let t = '已毕业 ' + c.graduated + ' / ' + ALL_TARGET_WORDS + ' · ' + etaText(r, m, false);
          const ms = milestoneText(r); if (ms) t += ' · ' + ms;
          /* 补句要有历史可说才说：刚建好计划第一天就冒出「最近两周你实际只做了 1 天」是凭空指责。
             判据用「这个计划存在多久」，不是「做过几天」—— 不满两周不评价。 */
          const born = Date.parse((ROOT2.plan && ROOT2.plan.startDate) || '');
          const planDays = isFinite(born) ? Math.floor((Date.now() - born) / 864e5) + 1 : 1;
          const act = activeDaysRecent(14);
          if (planDays >= 14 && act < 7) t += '（最近两周你实际只做了 ' + act + ' 天）';
          etaSet(el, t, r);
        });
      }
      function renderSetup(p) {
        const MINS = [5, 10, 15, 20, 30, 45, 60];
        let sel = 15;
        /* 视觉上去掉「每天」那一行（标题已经说了「每天有多少分钟」），
           但组名不能丢 —— 换成 role=group + aria-label，读屏照样念得出这组是什么。 */
        p.innerHTML = `<div class="plan-setup">
          <h3>每天有多少分钟</h3>
          <p class="ps-sub">共 ${SENT_RAW.length} 句 · ${ALL_TARGET_WORDS} 个目标词。句数和题数由分钟数算出来。</p>
          <div class="ps-group"><div class="ps-opts" id="psMin" role="group" aria-label="每天多少分钟">
            ${MINS.map(m => `<button class="ps-opt${m === sel ? ' sel' : ''}" data-v="${m}">${m} 分钟</button>`).join('')}
          </div></div>
          <div class="ps-sum" id="psSum"></div>
          <div class="ps-eta" id="psEta" data-days="">算一下…</div>
          <div class="ps-eta sm" id="psEtaAssume">（只按通读时间估算：一句约 ${Math.round(secNew())} 秒，做题不占每天的分钟数）</div>
          <button class="ps-start" id="psStart">开始这个计划</button>
        </div>`;
        const refresh = () => {
          // D10：预算只计通读，所以句数 = 分钟×60 ÷ 一句秒数；题数与句数一样（一句一题，但不占时间）
          const per = Math.max(1, Math.round(sel * 60 / secNew()));
          const el = document.getElementById('psSum');
          if (el) el.innerHTML = `<div class="ps-sum-row"><span>今天大约</span><b>${Math.min(per, SENT_RAW.length)} 句 · ${Math.min(per, SENT_RAW.length)} 题</b></div>`;
          const eta = document.getElementById('psEta');
          if (eta) {
            eta.textContent = '算一下…';
            const want = sel;
            etaFor(want).then(r => etaSet(eta, etaText(r, want, true), r));
          }
        };
        refresh();
        p.querySelectorAll('.ps-opts').forEach(group => group.addEventListener('click', e => {
          const btn = e.target.closest('.ps-opt');
          if (!btn) return;
          group.querySelectorAll('.ps-opt').forEach(x => x.classList.remove('sel'));
          btn.classList.add('sel');
          sel = parseInt(btn.dataset.v, 10);
          refresh();
        }));
        document.getElementById('psStart').onclick = () => {
          initPlan(sel);
          buildQueue(); updateBtn();
          showAbToast(`计划已建好：每天 ${sel} 分钟，今天先排 ${todayPlan(true).queue.length} 句`);
          _view = 'today'; renderToday(p);
        };
      }

      function renderToday(p) {
        if (!ROOT2 || !ROOT2.plan) { renderSetup(p); return; }
        p.dataset.view = _view;
        const tabs = [['today', '今天'], ['plan', '计划'], ['book', '词本']]
          .map(v => `<button class="tp-tab${_view === v[0] ? ' on' : ''}" data-view="${v[0]}" onclick="TASK.setView('${v[0]}')">${v[1]}</button>`).join('');
        /* 标题写死一句「今日学习任务」：以前它跟着当前 tab 走（今天/计划/词本），
           于是同一行里「今天」出现两次（h3 一次、下面 tab 一次），纯重复。
           现在 h3 跟 dialogs 的 aria-label 同源，tab 负责说「现在在哪一屏」。
           顶栏那颗按钮的 aria-label 也是这句，plan-adjust 用例按名字点它。 */
        p.innerHTML = `<div class="tp-head"><h3>今日学习任务</h3>
          <button class="tp-close" onclick="TASK.closePanel()" aria-label="关闭面板">✕</button></div>
          <div class="tp-tabs">${tabs}</div>` +
          (_view === 'plan' ? renderPlanView() : _view === 'book' ? renderBookView() : renderTodayView());
        // 数字停在「打开面板那一刻」是这类双路径写同一节点最典型的翻车；放在这里，
        // 改分钟 / 改日界 / 暂停新词三条重绘路径就都自动带上，不用一个个补。
        if (_view === 'plan') paintPlanEta(); else if (_view === 'today') paintTodayEta();
      }

      /* 两栏并列、永不合并成一个「总进度」：今天做到位没有，和词往前走了几步，
         是两件不同的事 —— 今天 100% 可能只因为今天只排了 3 句。 */
      function renderTodayView() {
        const tp = todayPlan(true);
        const b = ROOT2.plan.boundaryHour, day = ShadowPlan.dayKey(Date.now(), b);
        const d = ROOT2.state.daily[day] || {};
        const qz = 6 / (rate || 1);
        const left = tp.queue.filter(q => !readToday2(q.i));
        const done = d.sentDone || 0;
        const n = plannedToday();
        const leftN = Math.max(0, n - done);
        const pct = n > 0 ? Math.round(done / n * 100) : 100;
        const c = countStages();
        // 「还剩」= 队列里没读的那几句的预留成本（句时 + ② 一题），
        // 不是「预算减已用」—— 后者刚开局就报 12 秒，说的是钱不是活
        const leftSec = left.reduce((a, q) => a + q.sec + qz, 0);
        /* 「地板」是内部三层的说法，学生看不懂 —— 三档改成说人话：还没起步 / 读得偏少 / 读够了。 */
        const grade = done >= 3 ? (done * 2 >= n ? '今天读够了' : '今天读得偏少')
                                : `还差 ${Math.max(1, 3 - done)} 句`;
        return `<div class="tp-cols">
          <div class="tp-col tp-col-today"><h4>今天 · ${ROOT2.plan.todayMinutes} 分钟</h4>
            <div class="tp-num">${done}<span class="unit"> / ${n} 句</span></div>
            <div class="tp-prog"><div class="tp-prog-fill" style="width:${pct}%"></div></div>
            <div class="tp-kv"><span>连续</span><b>${streak2()} 天${floorDayCount() ? `（${floorDayCount()} 天偏少）` : ''}</b></div>
            <div class="tp-kv"><span>完成度</span><b>${grade}</b></div>
            <div class="tp-kv"><span>预计还要</span><b>${fmtTime(leftSec)}</b></div>
          </div>
          <div class="tp-col tp-col-words"><h4>词汇</h4>
            <div class="tp-num">${d.promote || 0}<span class="unit"> 个词今天晋升</span></div>
            <div class="tp-kv"><span>文中可辨</span><b>${c.recognized}</b></div>
            <div class="tp-kv"><span>义项直连</span><b>${c.owned}</b></div>
            <div class="tp-kv"><span>重点词</span><b>${c.leech}</b></div>
          </div>
        </div>
        <div class="tp-note">今天 ${ROOT2.plan.todayMinutes} 分钟：<b>还剩 ${leftN} 句 · 覆盖 ${tp.words.length} 个词</b>
          <span class="sm">${tp.stats.dueWords} 个词到期 · ${tp.stats.newWords} 个新词进队列 · ${tp.items.length} 题${tp.stats.droppedA ? ` · ${tp.stats.droppedA} 个词明天见` : ''}${baowenNote(tp.stats)}</span></div>
        <div class="tp-note sm eta-foot" id="todayEta" data-days="">算一下…</div>
        <div class="tp-actions"><button class="btn primary" onclick="TASK.enterTaskMode()">${taskMode ? '继续任务' : '开始今天的任务'}</button>
          ${taskMode ? '<button class="btn" onclick="TASK.exitTaskMode()">退出任务模式</button>' : ''}</div>`;
      }

      /* 保温那一格的话（Task 3：只报负载、不报终点）。三个数全部从引擎的 stats 取 ——
         界面不许自己数队列、也不许自己写「15 分钟」这个门槛（一份逻辑一份实现）。
         刻意**不提「14 天」**：稳态约 232 个毕业词/天到期，配额一天只带得动十几个，
         一个词平均约 300 天才轮到一次；说"14 天回访"是空头许诺（实测 §8.3 第 2 条）。 */
      function baowenNote(st) {
        /* 先判档位再判负载：cap=0 是"这一档根本不保温"这条口径本身，
           不先判它，遇到"今天正好有毕业词被别的句顺带读到了"（riding，不吃配额）
           就会把那一句说成"今天 K 个词是回炉保温"，把"不保温"这档显示成在保温。 */
        if (!st.baowenCap) return ` · 每天不到 ${ShadowPlan.BAOWEN_MIN_MINUTES} 分钟不安排保温，先只顾新词`;
        if (st.retentionWords) return ` · ${st.retentionWords} 个词是回炉保温`;
        if (st.retentionDropped) return ' · 毕业词太多排不下，先顾完手头的词';
        return '';
      }

      function renderPlanView() {
        const MINS = [5, 10, 15, 20, 30, 45, 60];
        /* 六颗统一成「N 点」：旧标签里只有 4 点写成「凌晨 4 点」，一颗特殊写法看着像笔误。 */
        const BOUND = [[0, '0 点'], [2, '2 点'], [3, '3 点'], [4, '4 点'], [5, '5 点'], [6, '6 点']];
        const row = (label, opts, cur, fn) => `<div class="ps-group"><label>${label}</label>
          <div class="ps-opts">${opts.map(o => `<button class="ps-opt${String(o[0]) === String(cur) ? ' sel' : ''}" data-v="${o[0]}" onclick="${fn}(${o[0]})">${o[1]}</button>`).join('')}</div></div>`;
        return row('每天有多少分钟', MINS.map(m => [m, m + ' 分钟']), ROOT2.plan.todayMinutes, 'TASK.setMinutes') +
          row('几点算换一天', BOUND, ROOT2.plan.boundaryHour, 'TASK.setBoundary') +
          `<div class="ps-group"><label>新词</label><div class="ps-opts">
            <button class="ps-opt${ROOT2.plan.pausedNew ? '' : ' sel'}" onclick="TASK.setPauseNew(false)">正常见新词</button>
            <button class="ps-opt${ROOT2.plan.pausedNew ? ' sel' : ''}" onclick="TASK.setPauseNew(true)">只复习，先不见新词</button></div></div>
          <div class="ps-eta" id="planEta" data-days="">算一下…</div>
          ${ROOT2.report && ROOT2.report.words ? `<div class="tp-note sm">上次改成按词记：<b>${ROOT2.report.words}</b> 个词从句子账搬过来，`
            + `其中 ${ROOT2.report.cappedWords} 个原本算「巩固/掌握」的被压回「已见面」，要重新考才算数。</div>` : ''}
          <div class="tp-note sm">进度存在这台设备上，并以上传「完成记录」的方式同步。<span class="sync-state" id="syncState">${syncHintText()}</span></div>
          <div class="ps-adjust"><button class="btn" onclick="TASK.exportBackup()">导出进度备份</button>
            <button class="btn" onclick="TASK.importBackup()">导入备份恢复</button></div>
          <input type="file" id="importFile" accept="application/json,.json" style="display:none">
          <div class="ps-adjust"><button class="link-danger" onclick="TASK.resetPlan()">清空重来</button></div>`;
      }

      function setMinutes(m) {
        ROOT2.plan.todayMinutes = Math.max(1, Math.min(180, m));
        if (ROOT2.planned) ROOT2.planned[day2()] = 0;   // 预算变了，今天的句数承诺重算一次
        _cachedPlan = null; syncLegacyPlan(); savePlan(); persist2(); renderToday(document.getElementById('todayPanel'));
      }
      function setBoundary(h) { ROOT2.plan.boundaryHour = h; recompute2(); _cachedPlan = null; syncLegacyPlan(); savePlan(); persist2(); renderToday(document.getElementById('todayPanel')); }
      function setPauseNew(v) { ROOT2.plan.pausedNew = !!v; _cachedPlan = null; syncLegacyPlan(); savePlan(); persist2(); renderToday(document.getElementById('todayPanel')); }
      function syncHintText() {
        // 只有真的登录了、且上传链已接上才报差额 —— 没登录时说「还有 N 条没传上去」是空许诺
        if (typeof CLOUD === 'undefined' || !CLOUD._userMail) return '';
        const left = ROOT2 ? ROOT2.events.length - (ROOT2.uploaded || 0) : 0;
        return left > 0 ? `还有 ${left} 条没传上去` : '';
      }

      function renderBookView() {
        const c = countStages();
        /* 「全部」不是一个总数：这里是【已经收进来的词】，跟别处「已毕业 0 / 3245」的 3245（目标词）
           不是一个量纲。改叫「已收录」，别让两个数都被读成"我有多少词"。 */
        const filters = [['all', '已收录'], ['seen', '已见面'], ['recognized', '文中可辨'],
                         ['owned', '义项直连'], ['graduated', '已毕业'], ['leech', '重点词']]
          .map(f => `<button class="pill${_bookFilter === f[0] ? ' on' : ''}" onclick="TASK.setBookFilter('${f[0]}')">${f[1]} ${f[0] === 'leech' ? c.leech : (f[0] === 'all' ? Object.keys(ROOT2.state.words).length : c[f[0]])}</button>`).join('');
        const rows = Object.keys(ROOT2.state.words)
          .filter(k => _bookFilter === 'all' || (_bookFilter === 'leech' ? ROOT2.state.words[k].leech : ROOT2.state.words[k].stage === _bookFilter))
          .sort((a, x) => (ROOT2.state.words[x].reps || 0) - (ROOT2.state.words[a].reps || 0))
          .slice(0, 160)
          .map(k => {
            const w = ROOT2.state.words[k];
            return `<div class="tp-book-row"><span class="bw">${esc(k)}</span>
              <span class="bs">${STAGE_LABEL[w.stage] || w.stage} · 读过 ${w.reps} 次${w.leech ? ' · 重点' : ''}</span>
              <button class="bx" onclick="TASK.relearn('${esc(k)}')">重学</button></div>`;
          }).join('');
        return `<div class="tp-filters">${filters}</div>
          <div class="tp-book">${rows || '<p class="sm">这一档还没有词 —— 先去读几句，词是自己走进来的。</p>'}</div>
          <p class="sm">这里不是背单词的入口，是查「我到底会没会」的地方。</p>`;
      }

      function pauseNew() {
        if (!plan) return;
        plan.paused = !plan.paused;
        savePlan(); buildQueue(); updateBtn();
        showAbToast(plan.paused ? '已暂停新句，只复习' : '已恢复新句推进');
        const p = document.getElementById('todayPanel');
        if (p && _panelOpen) renderToday(p);
      }
      /* ---- 本地备份：计划与进度只存在 localStorage，清缓存或换设备即归零 ---- */
      const BACKUP_PREFIX = 'ielts-';
      function collectBackup() {
        const data = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(BACKUP_PREFIX)) data[k] = localStorage.getItem(k);
        }
        return data;
      }
      function exportBackup() {
        const data = collectBackup();
        const payload = { app: 'ielts-shadow', backupVer: 1, exportedAt: new Date().toISOString(), data };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const d = new Date();
        const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        a.download = `影子跟读备份_${stamp}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        showAbToast(`已导出 ${Object.keys(data).length} 项本地数据，请妥善保存文件`);
      }
      function importBackup() {
        const f = document.getElementById('importFile');
        if (!f) return;
        f.onchange = async () => {
          const file = f.files && f.files[0];
          f.value = '';
          if (!file) return;
          let o;
          try { o = JSON.parse(await file.text()); } catch (e) { showAbToast('导入失败：文件不是有效 JSON'); return; }
          if (!o || o.app !== 'ielts-shadow' || !o.data || typeof o.data !== 'object') {
            showAbToast('导入失败：这不是影子跟读导出的备份文件'); return;
          }
          if (!confirm(`导入将覆盖当前全部跟读数据（计划、进度、书签、播放位）。\n备份导出时间：${o.exportedAt || '未知'}\n确定继续吗？`)) return;
          const keys = Object.keys(o.data).filter(k => k.startsWith(BACKUP_PREFIX));
          if (!keys.length) { showAbToast('导入失败：备份里没有可恢复的数据'); return; }
          try {
            keys.forEach(k => localStorage.setItem(k, o.data[k]));
            Object.keys(collectBackup()).forEach(k => { if (!keys.includes(k)) localStorage.removeItem(k); });
          } catch (e) { showAbToast('导入失败：本地存储写入被拒绝（可能已满）'); return; }
          showAbToast('导入成功，正在重新加载');
          setTimeout(() => location.reload(), 400);
        };
        f.click();
      }
      function resetPlan() {
        if (!confirm('重置将清空当前计划与全部跟读进度（连续天数、统计一并清零），回到初始设置。确定继续吗？')) return;
        try { localStorage.removeItem(LS_PLAN); localStorage.removeItem(LS_PROG); } catch (e) {}
        // v2 事件根必须一起清：只清老 key 的话，重载后 ROOT2 还在，进度等于没重置
        try { localStorage.removeItem(LS_V2); } catch (e) {}
        ROOT2 = null; _cachedPlan = null;
        plan = null;
        prog = { sentences: {}, daily: {}, streak: 0, lastDay: '', cycleCount: 0, cycleSeen: {} };
        todayQueue = [];
        taskMode = false; taskPos = 0; sessionStart = 0; sessionReps = 0;
        document.body.classList.remove('task-mode');
        dockAudiobar(false);
        const bar = document.getElementById('taskBar');
        if (bar) bar.classList.remove('show');
        sents.forEach(el => el.classList.remove('task-new', 'task-review', 'task-done'));
        stopSessionClock();
        updateBtn();
        showAbToast('计划已重置');
        const p = document.getElementById('todayPanel');
        if (p && _panelOpen) renderSetup(p);
      }

      /* 底部这一行的两种态各有各的锁，别混成一把：
         「今天先不做」那把按天记在 localStorage（下面 skipResume），提不提由下面 offerResume 的注释说了算。 */
      const RESUME_KEY = 'ielts.shadow.resumeDay';
      function hideResumeOffer() {
        const bar = document.getElementById('taskBar');
        if (bar && bar.dataset.state === 'resume') { bar.classList.remove('show'); bar.dataset.state = 'idle'; }
        document.body.classList.remove('resume-offer');
        syncTaskBarHeight();   // 卡收掉了，高度变量也得撤，否则播放条还按 88px 让位
      }
      /* 刷新时底部这一行本来是任务栏的位置，今天的活没干完（或干脆还没开干）就占用它。
         不弹窗：弹窗每刷一次都要点掉一次，就成了新的打断源。
         2026-09-22 走查 #5：以前只在「做了一半」时才提（doneN > 0 那道闸），
         全新的一天界面零提示，得自己去顶栏找面板 —— 现在一句没读也提，条上就是「今天 N 句」+ 开始。
         2026-09-23 他把"提几次"这件事拍死了：「每次都提（只要今天没完成）」。
         原来这里还有一把 sessionStorage 锁，记「这一趟浏览器会话提过没有」，同一标签页第二次刷新就安静下来。
         他因此报了一条"时好时坏"的 bug（「页面刷新有时候出现两个条，有时是一个播放器的条」）——
         量过：两个条没重叠，多出来那条就是这张卡；也就是说这把锁省下的不是屏幕，是"一致性"，
         而一致性对他更值钱。所以判据只剩两条，都在"今天的活"这一本账上：
           还有没读完的（planned > doneN）  且  今天没按过「今天先不做」。
         按下那颗仍然是按天的（skipResume 写 localStorage）—— 那是他主动说的"今天不做"，
         不该下一刷就被追上来；除此之外网页自己不记"我提过了"。 */
      function offerResume() {
        const bar = document.getElementById('taskBar');
        if (!bar || taskMode || bar.classList.contains('show')) return false;
        if (!ROOT2 || !ROOT2.plan) return false;
        const d = (ROOT2.state.daily || {})[day2()] || {};
        const planned = plannedToday(), doneN = d.sentDone || 0;
        if (!(planned > doneN)) return false;
        const fresh = doneN === 0;
        let gone = null;
        try { gone = localStorage.getItem(RESUME_KEY); } catch (e) {}
        if (gone === day2()) return false;
        bar.dataset.state = 'resume';
        document.getElementById('tbTitle').innerHTML = fresh
          ? '<i class="ri-play-circle-line" aria-hidden="true"></i> 今天 ' + planned + ' 句'
          : '<i class="ri-play-circle-line" aria-hidden="true"></i> 今天的任务还没做完';
        // 开跑那一屏不给第二个数：N 句就是全部要做的，还剩多少等进了 ① 条上自然会说
        // 「还剩」这一格调 todayLeftN() 而不是就地做减法：算式只许住在一处（上面那行 planned/doneN
        // 是同一本账的另一半，减法多写一遍就是两份实现，本仓库反复栽在这上面）。
        document.getElementById('tbSub').textContent = fresh
          ? '' : `已读 ${doneN}/${planned} 句 · 还剩 ${todayLeftN()} 句`;
        syncTaskSeek(false, planned ? doneN / planned : 0);   // 续读条在任务模式外，这一根只读不拖
        const again = document.getElementById('tbAgain'), nxt = document.getElementById('tbNext');
        if (again) { again.style.display = ''; again.textContent = '今天先不做'; }
        if (nxt) nxt.innerHTML = '<i class="ri-arrow-right-line" aria-hidden="true"></i> ' + (fresh ? '开始' : '接着做');
        bar.classList.add('show');
        document.body.classList.add('resume-offer');
        syncTaskBarHeight();
        return true;   // 调用方（init）拿它决定那条断更 toast 还弹不弹
      }
      function resumeTask() { hideResumeOffer(); enterTaskMode(); }
      function skipResume() {
        try { localStorage.setItem(RESUME_KEY, day2()); } catch (e) {}
        hideResumeOffer();
        showAbToast('今天剩下的不补 —— 明天还是从这批里接着往下排');
      }

      // ---- 与播放链路集成 ----
      // 自由模式下读了任务句也计数
      function onSentenceComplete(globalIdx) {
        if (!plan || !prog) return;
        recordRep(globalIdx);   // 耗时实测在 recordRep 里统一采样
      }
      /* 任务模式一步一停的落点（他 2026-09-23 拍板：「不点不放，点一句放一句」）。
         播放链每放完一句回来问一次；返回 true 就停在这句，下一句由任务条那颗键叫起来。
         以前这两件事全挂在点「下一句」上：链子自己往前滚的时候，听完的句子一句都不计完成，
         ①→② 的交接也不触发 —— 条上写着「这批读完了，接着出这一批的词」，却永远不出题。
         循环遍数照当前设定跑完才算放完（上面那句的 loop 分支会先 return 回来几次）。 */
      function taskSentenceFinished(globalIdx) {
        if (!taskMode) return false;
        if (pass === 1 && plan && prog) {
          recordRep(globalIdx);
          sessionReps++;
          /* 他 2026-09-24 拍板：放完**不自动挪高亮** —— 高亮停在这句，下一句只由「下一句」那颗键叫起来
             （点了才挪高亮 + 同步开播）。所以这里不再 goToNextTask()。
             唯一例外是「这批一句没读的了」：那种情况照旧把 ② 端上来，否则那颗键会停在
             一个"没有下一句可点"的死角（task-mode-step ④ 锁的就是它）。 */
          if (!todayQueue.some(q => !readToday2(q.i))) { finishPass(1); return true; }
          try { updateTaskBar(); } catch (e) {}
          try { savePos(); } catch (e) {}
        }
        return true;
      }

      // ---- 初始化 ----
      function init() {
        loadPlan(); loadProg();
        try { loadRoot(); } catch (e) { dlog('root-load-fail', (e && e.message) || e); }
        if (plan) {
          buildQueue();
          updateBtn();
          let offered = false;
          try { offered = offerResume() === true; } catch (e) { dlog('resume-offer-fail', (e && e.message) || e); }
          /* 断更提示：新句窗口已改为按进度游标推进（见 buildQueue），欠下的句子
             不会因日历前移而被跳过，所以这里只如实说明现状，不再声称"已调整计划"。
             与底部那条提示同屏只冒一条（走查 #5）：条上那颗点了就开跑，这句只是解释昨天为什么
             排这些 —— 两条一起出，眼睛先被字多的那句抓走，而动作在条上。 */
          const lastDay = prog.lastDay;
          if (lastDay && !offered) {
            const gap = Math.round((startOfToday() - new Date(lastDay + 'T00:00:00').getTime()) / 864e5);
            if (gap > 2) {
              showAbToast(`欢迎回来。上次读到这里，今天先排 ${todayPlan(true).queue.length} 句（${ROOT2 && ROOT2.plan ? ROOT2.plan.todayMinutes : 15} 分钟），剩下的不用补`);
            }
          }
        }
        // 开页先拉后推：没登录时这两个函数自己就返回，不发请求
        try { cloudSync(); } catch (e) { dlog('cloud-sync-fail', (e && e.message) || e); }
        migrationNotice();
      }
      /* 迁移不能静默（PRD R4）：把一句读 8 遍的词从「巩固」压回「已见面」，
         不解释一句就会被当成"我的进度被清零了"。只说一次，说完就闭嘴。 */
      function migrationNotice() {
        if (!ROOT2 || !ROOT2.report || localStorage.getItem(MIG_KEY)) return;
        localStorage.setItem(MIG_KEY, '1');
        const r = ROOT2.report;
        if (!r.words) return;
        showAbToast(`进度改成按词记了：${r.words} 个词搬过来，其中 ${r.cappedWords} 个本来算「巩固/掌握」，`
          + `现在回到「已见面」要重新考 —— 一句读八遍不等于每个词都熟了`);
      }

      // ---- 公开 API ----
      return {
        init, togglePanel, openPanel, closePanel, enterTaskMode, exitTaskMode,
        again, prev, next, requestExit, cancelExit, confirmExit, pauseNew, resetPlan, onSentenceComplete,
        taskSentenceFinished,
        exportBackup, importBackup,
        get active() { return taskMode; },
        get hasPlan() { return !!plan; },
        get queue() { return todayQueue; },
        get progress() { return prog; },
        recordRep, buildQueue, updateMarkers, updateBtn,
        loadRoot, todayPlan, state: () => ROOT2 && ROOT2.state, events: () => (ROOT2 && ROOT2.events) || [],
        pendingEvents, cloudPush, cloudPull, cloudSync, retrySync, syncHintText,
        offerResume, resumeTask, skipResume, hideResumeOffer,
        initPlan, resetV2, readDone, relearn, setView, setBookFilter, setMinutes, setBoundary, setPauseNew,
        etaFor, etaCalls, countStages, seedDailyForTest,
        // 「今天这批的分母是不是被分子抬起来了」只有引擎自己知道 —— 给测试读一次真值。
        // 2026-09-24：plannedToday() 曾经返回 Math.max(快照, sentDone)，读超了就永远显示 N/N。
        plannedForTest: () => plannedToday(),
        // 「本次已用多久」要跨过 20 秒静默期才可测，所以把会话起点交给测试拨一下
        setSessionStartForTest: (ts) => { sessionStart = ts; updateTaskBar(); },
        // ① 那颗键在「放这一句 / 下一句」之间翻转只挂这里：全局 paint() 每次改 playing 都调一次
        refreshNext: syncTaskNextLabel,
        // 「② 有没有题可出」这条不变式要全库扫才知道，所以把句号→目标词递出去给测试用
        sentWordsOf: (i) => wordsOfSent(i), sentTotal: () => SENT_RAW.length,
        pass: passNumber, setPass, currentQuiz, answerQuiz, nextQuiz, advance, finished: isFinished,
        pickOpt, flagQuiz, reviewSentence, summaryContinue: startSummaryContinue,
        blankQuizFor: (s, w, from) => buildQuiz({ s: s, w: w, from: from }),   // 出题判据唯一的对外入口：给测试与「问题题」复核用，别另写一份
        quizTotal: () => quizList().length, quizDone: quizDoneCount, quizWrong: quizWrongCount,
        get view() { return _view; }
      };
    })();

    /* ② 挖空选择的 1–4 数字键（PRD §6 键盘/无障碍）。两步制后做题卡没有输入框了，不再需要防抢键 */
    document.addEventListener('keydown', e => {
      try {
        if (!TASK.active || TASK.pass() < 2) return;
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        const i = '1234'.indexOf(e.key);
        if (i < 0) return;
        const q = TASK.currentQuiz();
        if (q && q.opts && q.opts[i]) { e.preventDefault(); TASK.pickOpt(i); }
      } catch (err) {}
    });

    initApp(); loadVoices();
    function mobileBtnIcons() { // 移动端播放条：确保图标在窄屏下正常显示，不再替换文字
    const btns = document.querySelectorAll('.audiobar .btn');
    btns.forEach(btn => {
    btn.style.minWidth = '0';
    btn.style.flex = '0 0 auto';
    // 确保图标可见：保留文字但通过行高控制
    const icon = btn.querySelector('i');
    if (icon) { icon.style.fontSize = '14px'; }
    });
    }
    mobileBtnIcons();
    try { initNavCollapse(); } catch (e) {}
    window.addEventListener('orientationchange', () => setTimeout(mobileBtnIcons, 300));
    let _rzT = false;
    window.addEventListener('resize', () => {
    if (_rzT) return; _rzT = true;
    requestAnimationFrame(() => { _rzT = false; mobileBtnIcons(); if (abMode === 3) paintAB(); requestNavSync(); });
    });
    if (typeof CLOUD !== 'undefined') CLOUD.boot();
    // 断网恢复后自动重连云端（移动端网络抖动常见）
    window.addEventListener('online', () => {
    try { if (typeof CLOUD !== 'undefined' && CLOUD._userMail && !CLOUD._on) CLOUD.checkStatus(); } catch (e) {}
    try { TASK.cloudSync(); } catch (e) {}   // 断网期间攒下的事件，回网就补传
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => loadVoices());
    setTimeout(loadVoices, 500);
  </script>
</body>
</html>
