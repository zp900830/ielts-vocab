        // 测试断言两次 state 深相等（合并不许动账），并断言确实真掉了重复条。
        compactProbeForTest: () => {
          // 深排序后再 stringify：重放会按事件顺序重建对象，键序会变 —— 直接 stringify 会把
          // 「值相同、键序不同」误判成"丢了账"（第一版就栽在这儿）。只比内容，不比键序。
          const canon = v => {
            if (Array.isArray(v)) return v.map(canon);
            if (v && typeof v === 'object') {
              const r = {};
              Object.keys(v).sort().forEach(k => { r[k] = canon(v[k]); });
              return r;
            }
            return v;
          };
          const snap = st => {
            /* sents[].lastReadAt 只经 ShadowPlan.dayKey 被读过（readToday2），
               精确毫秒数不参与任何判断 —— 合并留下同一 w|s|day 的第一条，
               它的 ts 比最后一条早几毫秒，同一天内等价。快照按「天」归一，
               否则会把 3ms 的差报成"丢了账"（第二版对照实验就是这么红的）。 */
            const sents = {};
            Object.keys(st.sents || {}).sort().forEach(k => {
              sents[k] = { d: ShadowPlan.dayKey((st.sents[k] || {}).lastReadAt || 0, bdHour()) };
            });
            return JSON.stringify(canon({ words: st.words, daily: st.daily, sents }));
          };
          const before = snap(ROOT2.state), n0 = ROOT2.events.length;
          ROOT2.events = compactEvents(ROOT2.events);
          recompute2();
          return { before, after: snap(ROOT2.state), eventsBefore: n0, eventsAfter: ROOT2.events.length };
        },
        // 「今天这批的分母是不是被分子抬起来了」只有引擎自己知道 —— 给测试读一次真值。
        // 2026-09-24：plannedToday() 曾经返回 Math.max(快照, sentDone)，读超了就永远显示 N/N。
        plannedForTest: () => plannedToday(),
        // 「本次已用多久」要跨过 20 秒静默期才可测，所以把会话起点交给测试拨一下
        setSessionStartForTest: (ts) => { sessionStart = ts; updateTaskBar(); },
        // ① 那颗键在「放这一句 / 下一句」之间翻转只挂这里：全局 paint() 每次改 playing 都调一次
        refreshNext: syncTaskNextLabel,
        // 「② 有没有题可出」这条不变式要全库扫才知道，所以把句号→目标词递出去给测试用
        sentWordsOf: (i) => wordsOfSent(i), sentTotal: () => SENT_RAW.length,
        pass: passNumber, setPass, currentQuiz, answerQuiz, nextQuiz, advance, finished: isFinished,
        pickOpt, flagQuiz, summaryContinue: startSummaryContinue,
        blankQuizFor: (s, w, from) => buildQuiz({ s: s, w: w, from: from }),   // 出题判据唯一的对外入口：给测试与「问题题」复核用，别另写一份
        quizTotal: () => quizList().length, quizDone: quizDoneCount, quizWrong: quizWrongCount,
        // ② 文内挖空 + 浮窗（M1 Task 6）：外壳/测试经 APP3 调用，实现留在这里（见 app.js）。
        maskArticle, openBlank, nextBlank, currentBlank, closeBlankPop,
        get view() { return _view; }
      };
    })();

    /* ② 文内挖空的 1–4 数字键（PRD §6 键盘/无障碍）。浮窗没开就不认数字键 ——
       否则会答到正文里那个看不见的"当前题"（底部题卡已删，题只活在浮窗里）。 */
    document.addEventListener('keydown', e => {
      try {
        if (!TASK.active || TASK.pass() < 2) return;
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        const pop = document.getElementById('blankPop');
        if (!pop || pop.hidden) return;             // 浮窗关着：Esc 与数字键都不归这里管
        const i = '1234'.indexOf(e.key);
        if (i < 0) return;
        const q = TASK.currentQuiz();
        if (q && q.opts && q.opts[i]) { e.preventDefault(); TASK.pickOpt(i); }
      } catch (err) {}
    });

    initApp(); loadVoices();

    /* ============ W6 · PWA（PRD §2.5）：service worker ============
       注册仓内**真实文件** /app/sw.js（scope /app/）。2026-09-24 根因修复：旧实现把 SW
       内联成 Blob 再 register(blobUrl) —— Chromium 直接拒绝（blob 协议不被支持），SW 从未
       注册，M2 加的「失败退回网络」是死代码；静态服务器偶发丢 /app/app.js 时页面就白屏。
       策略与缓存名见 app/sw.js。manifest 仍走 data-URI（见 <head>）。
       注册失败静默降级，绝不抛未捕获错误。 */
    const App3PWA = (function () {
      const state = { manifest: null, attempted: false, ok: false, error: null };
      try {
        const link = document.querySelector('link[rel="manifest"]');
        state.manifest = link ? link.getAttribute('href') : null;
      } catch (e) {}
      async function init() {
        if (!('serviceWorker' in navigator)) return;
        state.attempted = true;
        try {
          const scopePath = location.pathname.replace(/\/[^/]*$/, '/') || '/';
          const swUrl = new URL('sw.js', location.href).href;
          const reg = await navigator.serviceWorker.register(swUrl, { scope: scopePath });
          state.ok = true; state.scope = reg && reg.scope;
          try { console.log('[APP3] Service Worker registered', state.scope); } catch (e) {}
        } catch (e) {
          state.error = (e && e.message) || String(e);
          try { console.log('[APP3] Service Worker registration skipped:', state.error); } catch (err) {}
        }
      }
      return { state, init };
    })();
    try { window.APP3 = Object.assign(window.APP3 || {}, { pwa: App3PWA.state }); } catch (e) {}
    try { App3PWA.init(); } catch (e) {}

    /* 文章内头部（W1 重做）：主站 .reader-head 的滚动收缩（滚过 40px 加 .shrunk）+
       「?」帮助气泡。逻辑与主站 index.html 的 onScrollRH / helpBtn 同一套。 */
    (function () {
      const rh = document.getElementById('readerHead');
      if (rh) {
        const onScroll = () => rh.classList.toggle('shrunk', window.scrollY > 40);
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      }
      const help = document.getElementById('ttHelp'), bubble = document.getElementById('ttBubble');
      if (help && bubble) help.onclick = () => bubble.classList.toggle('show');
    })();

    function mobileBtnIcons() { // 移动端播放条：确保图标在窄屏下正常显示，不再替换文字
    const btns = document.querySelectorAll('.audiobar .btn');
    btns.forEach(btn => {
    btn.style.minWidth = '0';
    btn.style.flex = '0 0 auto';
    // 确保图标可见：保留文字但通过行高控制
    const icon = btn.querySelector('i');
    if (icon) { icon.style.fontSize = '14px'; }
    });
    }
    mobileBtnIcons();
    try { initNavCollapse(); } catch (e) {}
    window.addEventListener('orientationchange', () => setTimeout(mobileBtnIcons, 300));
    let _rzT = false;
    window.addEventListener('resize', () => {
    if (_rzT) return; _rzT = true;
    requestAnimationFrame(() => { _rzT = false; mobileBtnIcons(); if (abMode === 3) paintAB(); requestNavSync(); });
    });
    if (typeof CLOUD !== 'undefined') CLOUD.boot();
    // 断网恢复后自动重连云端（移动端网络抖动常见）
    window.addEventListener('online', () => {
    try { if (typeof CLOUD !== 'undefined' && CLOUD._userMail && !CLOUD._on) CLOUD.checkStatus(); } catch (e) {}
    try { TASK.cloudSync(); } catch (e) {}   // 断网期间攒下的事件，回网就补传
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => loadVoices());
    setTimeout(loadVoices, 500);
  </script>
</body>
</html>
